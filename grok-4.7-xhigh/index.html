<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070607'/%3E%3Cpath fill='%23ee0000' d='M5 19.5c2.2 2.2 6.4 4 11 4s8.8-1.8 11-4c-1.6 1.6-5.4 3.1-11 3.1S6.6 21.1 5 19.5zm3.4-2c.5-3.4 2.8-6.3 7.6-6.3s7.1 2.9 7.6 6.3c-2.2.7-4.8 1.1-7.6 1.1s-5.4-.4-7.6-1.1z'/%3E%3C/svg%3E">
<title>Red Hat</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070607;
    --ink: #e6e0d8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, #1a0c0b 0%, var(--bg) 62%);
    color: var(--ink);
  }
  body {
    min-height: 100dvh;
    overflow: hidden;
  }
  main {
    position: relative;
    height: 100dvh;
    min-height: 100dvh;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    background: transparent;
  }
  canvas:focus { outline: none; }
  canvas:focus-visible {
    outline: 1px solid rgba(238, 0, 0, 0.55);
    outline-offset: 6px;
  }
  .caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: max(22px, calc(env(safe-area-inset-bottom) + 14px));
    margin: 0;
    text-align: center;
    pointer-events: none;
    font-family: "Red Hat Display", "Red Hat Text", "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(12px, 1.45vw, 16px);
    letter-spacing: 0.48em;
    text-indent: 0.48em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .fallback {
    margin: 0;
    font: 14px/1.5 system-ui, sans-serif;
    color: rgba(230, 224, 216, 0.72);
  }
  ::selection { background: rgba(238, 0, 0, 0.35); color: #fff; }
  @media (max-width: 540px) {
    .caption { letter-spacing: 0.36em; text-indent: 0.36em; }
  }
  @media (max-aspect-ratio: 4/5) {
    .caption {
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    canvas { cursor: default; }
  }
</style>
</head>
<body>
<main>
  <canvas id="scene" tabindex="0" role="img" aria-label="A red fedora with a black band, turning slowly. Hover, tap, or press Enter to scatter it into embers."></canvas>
  <p class="caption" id="caption">Red Hat</p>
</main>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const caption = document.getElementById("caption");
  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

  const FOV = 28 * Math.PI / 180;
  const EYE0 = [0.62, 0.38, 3.15];
  const TARGET = [0, 0.22, 0];
  const PARTICLE_COUNT = 6200;
  const KEEPERS = 34;
  const TAU = Math.PI * 2;

  const BAND_Y0 = 0.148;
  const BAND_Y1 = 0.292;
  const BAND_RX = 0.482;
  const BAND_RZ = 0.524;

  let reduceMotion = motionQuery.matches;
  let width = 1, height = 1, dpr = 1;

  const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: true,
    depth: true,
    stencil: false,
    premultipliedAlpha: false,
    powerPreference: "high-performance"
  });

  if (!gl) {
    canvas.remove();
    const note = document.createElement("p");
    note.className = "fallback";
    note.textContent = "This scene needs WebGL.";
    caption.before(note);
    return;
  }

  function rng32(seed) {
    let s = seed >>> 0;
    return () => {
      s = (Math.imul(1664525, s) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  const rand = rng32(0x5eed21);

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mix = (a, b, t) => a + (b - a) * t;
  const lerp3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
  const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len3 = (a) => Math.hypot(a[0], a[1], a[2]);
  const cross3 = (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
  function norm3(a) {
    const L = len3(a) || 1;
    return [a[0] / L, a[1] / L, a[2] / L];
  }
  function smoother(t) {
    const x = clamp(t, 0, 1);
    return x * x * x * (x * (x * 6 - 15) + 10);
  }
  function ramp(t, a, b) {
    return smoother((t - a) / (b - a));
  }

  function sidePoint(u, v) {
    const su = Math.sin(u);
    const cu = Math.cos(u);
    const k = smoother(v);
    let rx = mix(0.46, 0.39, k);
    let rz = mix(0.50, 0.43, k);
    const belly = Math.sin(clamp(v, 0, 1) * Math.PI) * 0.012;
    rx += belly;
    rz += belly;
    let y = 0.18 + v * 0.58;
    y += 0.025 * v * Math.max(cu, 0);
    y -= 0.04 * v * Math.max(-cu, 0);
    const top = smoother(clamp((v - 0.58) / 0.42, 0, 1));
    y += 0.028 * top * Math.pow(Math.abs(su), 1.35);
    y -= 0.04 * top * Math.exp(-(su * su) / 0.2) * Math.max(cu, 0);
    let x = su * rx;
    let z = cu * rz;
    const ang = Math.atan2(su, cu);
    const dent = (center) => Math.exp(-((ang - center) ** 2) / 0.1 - ((v - 0.6) ** 2) / 0.045);
    const w = dent(1.05) + dent(-1.05);
    const fade = Math.sin(clamp(v, 0, 1) * Math.PI);
    const rad = Math.hypot(x, z) || 1;
    const push = 0.04 * w * fade;
    x -= (x / rad) * push;
    z -= (z / rad) * push;
    return [x, y, z];
  }

  function capPoint(u, s) {
    const rim = sidePoint(u, 1);
    const sCl = clamp(s, 0, 1);
    let x = rim[0] * sCl;
    let y = mix(rim[1] - 0.055, rim[1], Math.pow(sCl, 0.78));
    let z = rim[2] * sCl;
    const channel = Math.exp(-(x * x) / (0.03 + 0.09 * sCl));
    y -= 0.05 * channel * Math.pow(1 - sCl, 0.5);
    return [x, y, z];
  }

  function crownPoint(u, v) {
    const wall = 0.66;
    if (v <= wall) return sidePoint(u, v / wall);
    return capPoint(u, 1 - (v - wall) / (1 - wall));
  }

  function brimPoint(u, t) {
    const su = Math.sin(u);
    const cu = Math.cos(u);
    const front = Math.max(cu, 0);
    const back = Math.max(-cu, 0);
    const side = Math.abs(su);
    const tt = clamp(t, 0, 1);
    const rx = mix(0.42, 0.80, tt);
    const rz = mix(0.46, 0.86, tt * (1 + 0.03 * front));
    const edge = tt * tt * (3 - 2 * tt);
    let y = 0.162;
    y += 0.075 * edge * side;
    y -= 0.1 * edge * front;
    y += 0.03 * edge * back;
    const lip = smoother(clamp((tt - 0.8) / 0.2, 0, 1));
    y += 0.026 * lip;
    return [su * rx, y, cu * rz];
  }

  function brimNormal(u, t) {
    const e = 0.025;
    const du = sub3(brimPoint(u + e, t), brimPoint(u - e, t));
    const dt = sub3(brimPoint(u, Math.min(1, t + e)), brimPoint(u, Math.max(0, t - e)));
    let n = cross3(du, dt);
    const L = len3(n);
    if (L < 1e-6) return [0, 1, 0];
    n = [n[0] / L, n[1] / L, n[2] / L];
    if (n[1] < 0) n = [-n[0], -n[1], -n[2]];
    return n;
  }

  const BRIM_TH = 0.022;
  function brimUnder(u, t) {
    const p = brimPoint(u, t);
    const n = brimNormal(u, t);
    return [p[0] - n[0] * BRIM_TH, p[1] - n[1] * BRIM_TH, p[2] - n[2] * BRIM_TH];
  }

  function brimEdge(u, v) {
    const a = brimPoint(u, 1);
    const b = brimUnder(u, 1);
    const mid = lerp3(a, b, 0.5);
    const out = [Math.sin(u), 0, Math.cos(u)];
    const bevel = [mid[0] + out[0] * 0.016, mid[1], mid[2] + out[2] * 0.016];
    if (v < 0.5) return lerp3(a, bevel, v / 0.5);
    return lerp3(bevel, b, (v - 0.5) / 0.5);
  }

  function bandWall(u, v) {
    const bulge = Math.sin(v * Math.PI) * 0.012;
    return [
      Math.sin(u) * (BAND_RX + bulge),
      mix(BAND_Y0, BAND_Y1, v),
      Math.cos(u) * (BAND_RZ + bulge)
    ];
  }
  function bandFlange(u, v, top) {
    const y = top ? BAND_Y1 : BAND_Y0;
    const rx = mix(0.44, BAND_RX + 0.016, v);
    const rz = mix(0.48, BAND_RZ + 0.016, v);
    return [Math.sin(u) * rx, y, Math.cos(u) * rz];
  }

  const pos = [];
  const idx = [];
  const matA = [];
  const aoA = [];
  const welds = [];
  const ranges = [];

  function addGrid(nu, nv, sample, material, aoFn) {
    const base = pos.length / 3;
    const cols = nu + 1;
    for (let j = 0; j <= nv; j++) {
      for (let i = 0; i <= nu; i++) {
        const u = (i / nu) * TAU;
        const v = j / nv;
        const p = sample(u, v, i, j);
        pos.push(p[0], p[1], p[2]);
        matA.push(material);
        aoA.push(aoFn(u, v, p));
      }
    }
    for (let j = 0; j < nv; j++) {
      for (let i = 0; i < nu; i++) {
        const a = base + j * cols + i;
        const b = a + 1;
        const c = a + cols;
        const d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
    }
    welds.push({ base, cols, rows: nv });
    ranges.push({ base, count: (nu + 1) * (nv + 1) });
    return ranges.length - 1;
  }

  const crownId = addGrid(120, 56, (u, v) => crownPoint(u, v), 0, (u, v, p) => {
    let ao = 0.72 + 0.28 * Math.min(1, v * 1.3);
    ao *= 0.82 + 0.18 * clamp(v * 2.2, 0, 1);
    const crease = Math.exp(-(p[0] * p[0]) / 0.06);
    ao *= 1 - 0.16 * crease * clamp((v - 0.45) / 0.4, 0, 1);
    return ao;
  });
  const brimTopId = addGrid(120, 16, (u, v) => brimPoint(u, v), 0, (u, v) => mix(0.78, 0.98, v));
  const brimBotId = addGrid(120, 12, (u, v) => brimUnder(u, v), 0, () => 0.42);
  const brimEdgeId = addGrid(120, 4, (u, v) => brimEdge(u, v), 0, () => 0.9);
  const bandId = addGrid(96, 8, (u, v) => bandWall(u, v), 1, () => 0.9);
  const bandTopId = addGrid(96, 2, (u, v) => bandFlange(u, v, true), 1, () => 0.95);
  const bandBotId = addGrid(96, 2, (u, v) => bandFlange(u, v, false), 1, () => 0.7);

  const normals = new Float32Array(pos.length);
  for (let t = 0; t < idx.length; t += 3) {
    const ia = idx[t], ib = idx[t + 1], ic = idx[t + 2];
    const ax = pos[ia * 3], ay = pos[ia * 3 + 1], az = pos[ia * 3 + 2];
    const ab = [pos[ib * 3] - ax, pos[ib * 3 + 1] - ay, pos[ib * 3 + 2] - az];
    const ac = [pos[ic * 3] - ax, pos[ic * 3 + 1] - ay, pos[ic * 3 + 2] - az];
    const n = cross3(ab, ac);
    if (len3(n) < 1e-10) continue;
    for (const k of [ia, ib, ic]) {
      normals[k * 3] += n[0];
      normals[k * 3 + 1] += n[1];
      normals[k * 3 + 2] += n[2];
    }
  }
  for (const w of welds) {
    for (let j = 0; j <= w.rows; j++) {
      const i0 = (w.base + j * w.cols) * 3;
      const i1 = (w.base + j * w.cols + (w.cols - 1)) * 3;
      const nx = normals[i0] + normals[i1];
      const ny = normals[i0 + 1] + normals[i1 + 1];
      const nz = normals[i0 + 2] + normals[i1 + 2];
      normals[i0] = normals[i1] = nx;
      normals[i0 + 1] = normals[i1 + 1] = ny;
      normals[i0 + 2] = normals[i1 + 2] = nz;
    }
  }
  function flipRange(range) {
    const end = (range.base + range.count) * 3;
    for (let i = range.base * 3; i < end; i++) normals[i] = -normals[i];
  }
  function meanRadial(range) {
    let s = 0, c = 0;
    const end = range.base + range.count;
    for (let i = range.base; i < end; i++) {
      const x = pos[i * 3], z = pos[i * 3 + 2];
      const rl = Math.hypot(x, z) || 1;
      s += normals[i * 3] * (x / rl) + normals[i * 3 + 2] * (z / rl);
      c++;
    }
    return s / c;
  }
  function meanY(range) {
    let s = 0;
    const end = range.base + range.count;
    for (let i = range.base; i < end; i++) s += normals[i * 3 + 1];
    return s / range.count;
  }
  if (meanRadial(ranges[crownId]) < 0) flipRange(ranges[crownId]);
  if (meanY(ranges[brimTopId]) < 0) flipRange(ranges[brimTopId]);
  if (meanY(ranges[brimBotId]) > 0) flipRange(ranges[brimBotId]);
  if (meanRadial(ranges[brimEdgeId]) < 0) flipRange(ranges[brimEdgeId]);
  if (meanRadial(ranges[bandId]) < 0) flipRange(ranges[bandId]);
  if (meanY(ranges[bandTopId]) < 0) flipRange(ranges[bandTopId]);
  if (meanY(ranges[bandBotId]) > 0) flipRange(ranges[bandBotId]);

  for (let i = 0; i < normals.length; i += 3) {
    const L = Math.hypot(normals[i], normals[i + 1], normals[i + 2]);
    if (L < 1e-8) { normals[i + 1] = 1; continue; }
    normals[i] /= L; normals[i + 1] /= L; normals[i + 2] /= L;
  }

  let minY = Infinity, maxY = -Infinity;
  for (let i = 1; i < pos.length; i += 3) {
    if (pos[i] < minY) minY = pos[i];
    if (pos[i] > maxY) maxY = pos[i];
  }

  const meshStride = 8;
  const meshData = new Float32Array((pos.length / 3) * meshStride);
  for (let i = 0; i < pos.length / 3; i++) {
    const o = i * meshStride;
    meshData[o] = pos[i * 3];
    meshData[o + 1] = pos[i * 3 + 1];
    meshData[o + 2] = pos[i * 3 + 2];
    meshData[o + 3] = normals[i * 3];
    meshData[o + 4] = normals[i * 3 + 1];
    meshData[o + 5] = normals[i * 3 + 2];
    meshData[o + 6] = matA[i];
    meshData[o + 7] = aoA[i];
  }
  const meshIndex = new Uint16Array(idx);

  function vertAt(i) {
    return [pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]];
  }
  function nrmAt(i) {
    return [normals[i * 3], normals[i * 3 + 1], normals[i * 3 + 2]];
  }

  const triCount = idx.length / 3;
  const cdf = new Float32Array(triCount);
  let areaSum = 0;
  for (let i = 0; i < triCount; i++) {
    const a = vertAt(idx[i * 3]);
    const b = vertAt(idx[i * 3 + 1]);
    const c = vertAt(idx[i * 3 + 2]);
    const area = len3(cross3(sub3(b, a), sub3(c, a))) * 0.5;
    areaSum += area;
    cdf[i] = areaSum;
  }
  function pickTri(r) {
    let lo = 0, hi = triCount - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cdf[mid] < r) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  const homes = new Float32Array(PARTICLE_COUNT * 3);
  const nrms = new Float32Array(PARTICLE_COUNT * 3);
  const seeds = new Float32Array(PARTICLE_COUNT * 4);
  const keepers = new Float32Array(PARTICLE_COUNT);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const ti = pickTri(rand() * areaSum);
    const ia = idx[ti * 3], ib = idx[ti * 3 + 1], ic = idx[ti * 3 + 2];
    let u = rand(), v = rand();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const w = 1 - u - v;
    const A = vertAt(ia), B = vertAt(ib), C = vertAt(ic);
    const nA = nrmAt(ia), nB = nrmAt(ib), nC = nrmAt(ic);
    const p = [
      A[0] * w + B[0] * u + C[0] * v,
      A[1] * w + B[1] * u + C[1] * v,
      A[2] * w + B[2] * u + C[2] * v
    ];
    let n = [
      nA[0] * w + nB[0] * u + nC[0] * v,
      nA[1] * w + nB[1] * u + nC[1] * v,
      nA[2] * w + nB[2] * u + nC[2] * v
    ];
    if (len3(n) < 1e-5) n = norm3(cross3(sub3(B, A), sub3(C, A)));
    else n = norm3(n);
    homes[i * 3] = p[0]; homes[i * 3 + 1] = p[1]; homes[i * 3 + 2] = p[2];
    nrms[i * 3] = n[0]; nrms[i * 3 + 1] = n[1]; nrms[i * 3 + 2] = n[2];
    seeds[i * 4] = rand();
    seeds[i * 4 + 1] = rand();
    seeds[i * 4 + 2] = rand();
    seeds[i * 4 + 3] = rand();
  }
  const keeperPick = new Set();
  while (keeperPick.size < KEEPERS) keeperPick.add(Math.floor(rand() * PARTICLE_COUNT));
  for (const k of keeperPick) keepers[k] = 1;

  const pStride = 11;
  const particleData = new Float32Array(PARTICLE_COUNT * pStride);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const o = i * pStride;
    particleData[o] = homes[i * 3];
    particleData[o + 1] = homes[i * 3 + 1];
    particleData[o + 2] = homes[i * 3 + 2];
    particleData[o + 3] = nrms[i * 3];
    particleData[o + 4] = nrms[i * 3 + 1];
    particleData[o + 5] = nrms[i * 3 + 2];
    particleData[o + 6] = seeds[i * 4];
    particleData[o + 7] = seeds[i * 4 + 1];
    particleData[o + 8] = seeds[i * 4 + 2];
    particleData[o + 9] = seeds[i * 4 + 3];
    particleData[o + 10] = keepers[i];
  }

  function discMesh(radius, y, segments) {
    const p = [0, y, 0];
    const ix = [];
    for (let i = 0; i <= segments; i++) {
      const a = (i / segments) * TAU;
      p.push(Math.cos(a) * radius, y, Math.sin(a) * radius);
    }
    for (let i = 1; i <= segments; i++) ix.push(0, i, i + 1);
    return { pos: new Float32Array(p), idx: new Uint16Array(ix) };
  }
  const stage = discMesh(3.6, 0, 72);
  const shadow = discMesh(1, 0.001, 64);

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(log || "shader");
    }
    return shader;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p) || "link");
    }
    return p;
  }

  let bgProg, hatProg, floorProg, partProg;
  try {
    bgProg = program(`
      attribute vec2 aClip;
      varying vec2 vUv;
      void main() {
        vUv = aClip * 0.5 + 0.5;
        gl_Position = vec4(aClip, 0.0, 1.0);
      }
    `, `
      precision highp float;
      varying vec2 vUv;
      void main() {
        vec2 p = vUv - vec2(0.5, 0.47);
        float r = length(p * vec2(0.92, 1.08));
        vec3 warm = vec3(0.16, 0.045, 0.038);
        vec3 edge = vec3(0.027, 0.024, 0.026);
        vec3 col = mix(warm, edge, smoothstep(0.0, 0.78, r));
        float floorGlow = smoothstep(0.62, 0.18, vUv.y);
        col = mix(col, vec3(0.05, 0.032, 0.032), floorGlow * 0.45);
        float vig = smoothstep(0.95, 0.28, length((vUv - vec2(0.5)) * vec2(1.18, 1.08)));
        col *= mix(0.42, 1.0, vig);
        float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        col += (dither - 0.5) * (1.5 / 255.0);
        gl_FragColor = vec4(col, 1.0);
      }
    `);

    hatProg = program(`
      attribute vec3 aPos;
      attribute vec3 aNrm;
      attribute float aMat;
      attribute float aAO;
      uniform mat4 uVP;
      uniform mat4 uModel;
      uniform float uMirror;
      uniform float uFloor;
      varying vec3 vPos;

    gl.uniform2f(flCenter, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, stageBuf);
    gl.vertexAttribPointer(flPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, stageIdx);
    gl.uniform1f(flScale, 1);
    gl.uniform3f(flColor, 0.02, 0.016, 0.018);
    gl.uniform1f(flAlpha, 0.55);
    gl.uniform1f(flInner, 0.15);
    gl.uniform1f(flWarm, (1 - spread) * 0.55);
    gl.drawElements(gl.TRIANGLES, stage.idx.length, gl.UNSIGNED_SHORT, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, shadowBuf);
    gl.vertexAttribPointer(flPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, shadowIdx);
    gl.uniform3f(flColor, 0.0, 0.0, 0.0);
    gl.uniform1f(flWarm, 0);
    gl.uniform1f(flInner, 0.05);
    gl.uniform1f(flScale, (0.62 + spread * 0.55) * hatScale);
    gl.uniform1f(flAlpha, 0.28 * presence);
    gl.drawElements(gl.TRIANGLES, shadow.idx.length, gl.UNSIGNED_SHORT, 0);
    gl.uniform1f(flScale, (1.05 + spread * 0.7) * hatScale);
    gl.uniform1f(flAlpha, 0.22 * presence);
    gl.uniform1f(flInner, 0.0);
    gl.drawElements(gl.TRIANGLES, shadow.idx.length, gl.UNSIGNED_SHORT, 0);

    gl.useProgram(hatProg);
    disableAttribs();
    gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
    const stride = meshStride * 4;
    gl.enableVertexAttribArray(hatPos);
    gl.enableVertexAttribArray(hatNrm);
    gl.enableVertexAttribArray(hatMat);
    gl.enableVertexAttribArray(hatAO);
    gl.vertexAttribPointer(hatPos, 3, gl.FLOAT, false, stride, 0);
    gl.vertexAttribPointer(hatNrm, 3, gl.FLOAT, false, stride, 12);
    gl.vertexAttribPointer(hatMat, 1, gl.FLOAT, false, stride, 24);
    gl.vertexAttribPointer(hatAO, 1, gl.FLOAT, false, stride, 28);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIdx);
    gl.uniformMatrix4fv(hatVP, false, vp);
    gl.uniformMatrix4fv(hatModel, false, model);
    gl.uniform1f(hatFloor, floor);
    gl.uniform3f(hatCam, eye[0], eye[1], eye[2]);
    gl.uniform1f(hatDissolve, reduceMotion ? 0 : anim.dissolve);

    const reflect = (reduceMotion ? 0.06 : 0.07) * (1 - spread * 0.9);
    gl.uniform1f(hatMirror, 1);
    gl.uniform1f(hatAlpha, reflect);
    gl.drawElements(gl.TRIANGLES, meshIndex.length, gl.UNSIGNED_SHORT, 0);

    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.uniform1f(hatMirror, 0);
    gl.uniform1f(hatAlpha, 1);
    gl.drawElements(gl.TRIANGLES, meshIndex.length, gl.UNSIGNED_SHORT, 0);

    if (!reduceMotion && (anim.bulk > 0.004 || anim.orbit > 0.004)) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.depthMask(false);
      gl.useProgram(partProg);
      disableAttribs();
      gl.bindBuffer(gl.ARRAY_BUFFER, partBuf);
      const ps = pStride * 4;
      gl.enableVertexAttribArray(pHome);
      gl.enableVertexAttribArray(pNrm);
      gl.enableVertexAttribArray(pSeed);
      gl.enableVertexAttribArray(pKeep);
      gl.vertexAttribPointer(pHome, 3, gl.FLOAT, false, ps, 0);
      gl.vertexAttribPointer(pNrm, 3, gl.FLOAT, false, ps, 12);
      gl.vertexAttribPointer(pSeed, 4, gl.FLOAT, false, ps, 24);
      gl.vertexAttribPointer(pKeep, 1, gl.FLOAT, false, ps, 40);
      gl.uniformMatrix4fv(pVP, false, vp);
      gl.uniform1f(pAngle, angle);
      gl.uniform1f(pRelease, releaseAngle);
      gl.uniform1f(pScale, hatScale);
      gl.uniform1f(pTime, time);
      gl.uniform1f(pDisp, anim.disp);
      gl.uniform1f(pSwirl, anim.swirl);
      gl.uniform1f(pReform, anim.reform);
      gl.uniform1f(pOrbit, anim.orbit);
      gl.uniform1f(pViewH, height);

      if (anim.orbit > 0.03) {
        gl.uniform1f(pPass, 1);
        gl.uniform1f(pBulk, 0);
        const steps = 12;
        for (let i = steps; i >= 1; i--) {
          const f = i / steps;
          gl.uniform1f(pLag, f * 0.62);
          gl.uniform1f(pTrail, anim.orbit * (1 - f) * (1 - f) * 0.28);
          gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
        }
      }
      gl.uniform1f(pPass, 0);
      gl.uniform1f(pLag, 0);
      gl.uniform1f(pTrail, 0);
      gl.uniform1f(pBulk, anim.bulk);
      gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
    }

    gl.depthMask(true);
  }

  function frame(now) {
    if (!loopOn) return;
    let dt = (now - last) / 1000;
    last = now;
    if (dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;
    if (document.hidden) {
      loopOn = false;
      return;
    }
    draw(reduceMotion ? 0 : dt);
    if (reduceMotion) {
      loopOn = false;
      return;
    }
    requestAnimationFrame(frame);
  }
  function startLoop() {
    if (loopOn) return;
    loopOn = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !reduceMotion) startLoop();
  });
  window.addEventListener("resize", () => {
    resize();
    if (reduceMotion) draw(0);
  });

  if (reduceMotion) {
    angle = 0.78;
    omega = 0;
    canvas.setAttribute("aria-label", "A red fedora with a black band.");
    draw(0);
  } else {
    startLoop();
  }
})();
</script>
</body>
</html>
