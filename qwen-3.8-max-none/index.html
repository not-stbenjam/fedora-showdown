<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: min(80vw, 400px);
    height: min(80vw, 400px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 900px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .caption {
    margin-top: 1.5rem;
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(200, 200, 220, 0.6);
    text-align: center;
    user-select: none;
    transition: opacity 0.6s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .caption { opacity: 0.8; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <canvas id="c"></canvas>
</div>
<p class="caption">Fedora Project</p>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const scene = document.getElementById("scene");

  /* ── Configuration ─────────────────────────────────── */
  const PARTICLE_COUNT   = 2400;
  const ORBIT_COUNT      = 60;
  const REFORM_DURATION  = 1800;   // ms to reassemble
  const DISSOLVE_DURATION = 900;   // ms to fully dissolve
  const BASE_ROTATION_SPEED = 0.008;
  const HOVER_ROTATION_SPEED = 0.001;

  /* ── State ─────────────────────────────────────────── */
  let width, height, dpr;
  let rotationY = 0;
  let isHovering = false;
  let dissolveT = 0;          // 0 → 1  (0 = hat, 1 = dissolved)
  let reformStart = null;     // timestamp when reform began
  let dissolveStart = null;   // timestamp when dissolve began
  let particles = [];
  let orbitParticles = [];
  let reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  window.matchMedia("(prefers-reduced-motion: reduce)")
    .addEventListener("change", e => { reducedMotion = e.matches; });

  /* ── Resize ────────────────────────────────────────── */
  function resize() {
    const rect = scene.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (particles.length === 0) initParticles();
  }
  window.addEventListener("resize", resize);

  /* ── Fedora Hat Geometry ───────────────────────────── */
  // Generate points on a fedora silhouette in 3D
  function generateHatPoints(count) {
    const pts = [];

    // Brim: wide ellipse
    const brimCount = Math.floor(count * 0.35);
    for (let i = 0; i < brimCount; i++) {
      const angle = (i / brimCount) * Math.PI * 2;
      const rx = 1.0;
      const ry = 0.32;
      const x = Math.cos(angle) * rx;
      const z = Math.sin(angle) * ry;
      const y = -0.18 + Math.sin(angle) * 0.02; // slight wave
      pts.push({ x, y, z, nx: 0, ny: -1, nz: 0, region: "brim" });
    }

    // Crown: cylinder with tapered top + pinch
    const crownCount = Math.floor(count * 0.45);
    const crownRows = 18;
    const crownCols = Math.ceil(crownCount / crownRows);
    for (let r = 0; r < crownRows; r++) {
      const t = r / (crownRows - 1);           // 0 = base, 1 = top
      const yPos = -0.18 + t * 0.72;
      const radius = 0.52 - t * 0.12;          // taper inward
      for (let c = 0; c < crownCols; c++) {
        const angle = (c / crownCols) * Math.PI * 2;
        // Pinch at front and back near the top
        let pinch = 1;
        if (t > 0.5) {
          const pf = (t - 0.5) * 2;            // 0→1 over upper half
          pinch = 1 - pf * 0.25 * (Math.abs(Math.cos(angle)));
        }
        const x = Math.cos(angle) * radius * pinch;
        const z = Math.sin(angle) * radius * pinch * 0.85;
        const nx = Math.cos(angle);
        const nz = Math.sin(angle);
        pts.push({ x, y: yPos, z, nx, ny: 0, nz, region: "crown" });
      }
    }

    // Crease / dent on top
    const creaseCount = count - pts.length;
    for (let i = 0; i < creaseCount; i++) {
      const angle = (i / creaseCount) * Math.PI * 2;
      const r = 0.28 * Math.random();
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r * 0.7;
      const dentDepth = 0.06 * (1 - r / 0.28);
      pts.push({ x, y: 0.54 - dentDepth, z, nx: 0, ny: 1, nz: 0, region: "top" });
    }

    return pts;
  }

  /* ── Particle Init ─────────────────────────────────── */
  function initParticles() {
    const hatPts = generateHatPoints(PARTICLE_COUNT);
    particles = hatPts.map(p => ({
      hx: p.x, hy: p.y, hz: p.z,       // home position (hat space)
      nx: p.nx, ny: p.ny, nz: p.nz,
      region: p.region,
      // current offset from home (dissolved state)
      dx: (Math.random() - 0.5) * 3.5,
      dy: (Math.random() - 0.5) * 3.5,
      dz: (Math.random() - 0.5) * 3.5,
      // velocity for drift
      vx: (Math.random() - 0.5) * 0.003,
      vy: (Math.random() - 0.5) * 0.003 - 0.001,
      vz: (Math.random() - 0.5) * 0.003,
      size: 0.8 + Math.random() * 1.2,
      hue: p.region === "brim" ? 0 : (p.region === "crown" ? 10 : 20),
      seed: Math.random() * Math.PI * 2
    }));

    // Orbiting particles (always visible after reform)
    orbitParticles = [];
    for (let i = 0; i < ORBIT_COUNT; i++) {
      orbitParticles.push({
        angle: Math.random() * Math.PI * 2,
        radius: 1.1 + Math.random() * 0.5,
        speed: 0.003 + Math.random() * 0.006,
        yOff: (Math.random() - 0.5) * 0.6,
        tilt: (Math.random() - 0.5) * 0.8,
        size: 0.5 + Math.random() * 0.8,
        alpha: 0.15 + Math.random() * 0.25,
        trail: []
      });
    }
  }

  /* ── 3D Projection ─────────────────────────────────── */
  function project(x, y, z, rotY) {
    // Rotate around Y axis
    const cosR = Math.cos(rotY);
    const sinR = Math.sin(rotY);
    const rx = x * cosR - z * sinR;
    const rz = x * sinR + z * cosR;

    // Slight X tilt for dramatic angle
    const tiltX = 0.3;
    const cosT = Math.cos(tiltX);
    const sinT = Math.sin(tiltX);
    const ry = y * cosT - rz * sinT;
    const fz = y * sinT + rz * cosT;

    const fov = 2.8;
    const dist = 3.2;
    const scale = fov / (dist + fz);
    const sx = width / 2 + rx * scale * Math.min(width, height) * 0.42;
    const sy = height / 2 + ry * scale * Math.min(width, height) * 0.42;
    return { x: sx, y: sy, z: fz, scale };
  }

  /* ── Easing ────────────────────────────────────────── */
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

  /* ── Color helpers ─────────────────────────────────── */
  function fedoraColor(hue, lightness, alpha) {
    // Red Hat inspired: warm reds / crimsons
    return `hsla(${350 + hue}, 72%, ${lightness}%, ${alpha})`;
  }

  /* ── Render ─────────────────────────────────────────── */
  let lastTime = 0;

  function render(time) {
    const dt = time - lastTime;
    lastTime = time;

    ctx.clearRect(0, 0, width, height);

    // Update dissolve / reform
    if (isHovering && dissolveT < 1 && !reducedMotion) {
      if (!dissolveStart) dissolveStart = time;
      const elapsed = time - dissolveStart;
      dissolveT = Math.min(1, elapsed / DISSOLVE_DURATION);
      reformStart = null;
    } else if (!isHovering && dissolveT > 0 && !reducedMotion) {
      if (!reformStart) reformStart = time;
      const elapsed = time - reformStart;
      const progress = Math.min(1, elapsed / REFORM_DURATION);
      dissolveT = 1 - easeInOutCubic(progress);
      dissolveStart = null;
      if (progress >= 1) { dissolveT = 0; reformStart = null; }
    }

    // Rotation
    const targetSpeed = isHovering ? HOVER_ROTATION_SPEED : BASE_ROTATION_SPEED;
    if (!reducedMotion) {
      rotationY += targetSpeed * (dt || 16);
    }

    // Ambient glow behind hat
    const glowAlpha = 0.08 + dissolveT * 0.12;
    const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.min(width,height)*0.55);
    grad.addColorStop(0, `rgba(180, 30, 40, ${glowAlpha})`);
    grad.addColorStop(1, "rgba(180, 30, 40, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Sort & draw particles
    const easedDissolve = easeOutQuad(dissolveT);

    // Build projected list
    const projected = [];
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // Drift when dissolved
      let ox = 0, oy = 0, oz = 0;
      if (dissolveT > 0) {
        // Swirl
        const swirl = easedDissolve * 1.5;
        const st = time * 0.001 + p.seed;
        ox = p.dx * easedDissolve + Math.sin(st) * swirl * 0.3;
        oy = p.dy * easedDissolve + Math.cos(st * 0.7) * swirl * 0.2;
        oz = p.dz * easedDissolve + Math.sin(st * 1.3) * swirl * 0.3;
      }

      const wx = p.hx + ox;
      const wy = p.hy + oy;
      const wz = p.hz + oz;

      const proj = project(wx, wy, wz, rotationY);

      // Lighting: simple directional
      const cosR = Math.cos(rotationY);
      const sinR = Math.sin(rotationY);
      const rnx = p.nx * cosR - p.nz * sinR;
      const rnz = p.nx * sinR + p.nz * cosR;
      const lightDir = { x: 0.4, y: 0.7, z: -0.6 };
      const len = Math.sqrt(lightDir.x**2 + lightDir.y**2 + lightDir.z**2);
      const dot = Math.max(0, (rnx * lightDir.x + p.ny * lightDir.y + rnz * lightDir.z) / len);
      const lighting = 0.35 + dot * 0.65;

      projected.push({ ...proj, p, lighting });
    }

    // Depth sort (painter's algorithm)
    projected.sort((a, b) => b.z - a.z);

    // Draw hat particles
    for (const item of projected) {
      const { x, y, scale, p, lighting } = item;
      const sz = p.size * scale * (1 + easedDissolve * 0.5);
      if (sz < 0.2) continue;

      const lightness = 30 + lighting * 30;
      const alpha = (1 - easedDissolve * 0.3) * lighting;

      ctx.beginPath();
      ctx.arc(x, y, sz, 0, Math.PI * 2);
      ctx.fillStyle = fedoraColor(p.hue, lightness, alpha);
      ctx.fill();

      // Glow when dissolving
      if (dissolveT > 0.1) {
        const glowSz = sz * (2 + easedDissolve * 3);
        const gAlpha = easedDissolve * 0.15 * lighting;
        ctx.beginPath();
        ctx.arc(x, y, glowSz, 0, Math.PI * 2);
        ctx.fillStyle = fedoraColor(p.hue, 55, gAlpha);
        ctx.fill();
      }
    }

    // Orbit particles (visible always, more prominent after reform)
    if (!reducedMotion) {
      for (const op of orbitParticles) {
        op.angle += op.speed * (dt || 16) * 0.06;
        const ox = Math.cos(op.angle) * op.radius;
        const oz = Math.sin(op.angle) * op.radius;
        const oy = op.yOff + Math.sin(op.angle * 2 + op.tilt) * 0.15;
        const proj = project(ox, oy, oz, rotationY);

        // Trail
        op.trail.push({ x: proj.x, y: proj.y, a: op.alpha });
        if (op.trail.length > 12) op.trail.shift();

        // Draw trail
        for (let t = 0; t < op.trail.length - 1; t++) {
          const tr = op.trail[t];
          const ta = tr.a * (t / op.trail.length) * 0.4;
          ctx.beginPath();
          ctx.arc(tr.x, tr.y, op.size * proj.scale * 0.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(220, 120, 130, ${ta})`;
          ctx.fill();
        }

        // Draw orbit particle
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, op.size * proj.scale, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(240, 160, 160, ${op.alpha * 0.7})`;
        ctx.fill();

        // Faint glow
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, op.size * proj.scale * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 80, 80, ${op.alpha * 0.1})`;
        ctx.fill();
      }
    }

    // Shadow beneath
    const shadowGrad = ctx.createRadialGradient(width/2, height*0.72, 0, width/2, height*0.72, Math.min(width,height)*0.3);
    shadowGrad.addColorStop(0, `rgba(0,0,0,${0.25 * (1 - easedDissolve * 0.5)})`);
    shadowGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadowGrad;
    ctx.fillRect(0, height * 0.5, width, height * 0.5);

    requestAnimationFrame(render);
  }

  /* ── Interaction ───────────────────────────────────── */
  scene.addEventListener("mouseenter", () => { isHovering = true; });
  scene.addEventListener("mouseleave", () => { isHovering = false; dissolveStart = null; });
  scene.addEventListener("touchstart", (e) => {
    e.preventDefault();
    isHovering = !isHovering;
    if (!isHovering) dissolveStart = null;
  }, { passive: false });

  /* ── Boot ──────────────────────────────────────────── */
  resize();
  requestAnimationFrame(render);

})();
</script>
</body>
</html>
