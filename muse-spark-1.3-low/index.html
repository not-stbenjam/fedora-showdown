<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Hat — Fedora Hero</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#07080c;
    color:#e8e6e1;
    font-family:Georgia,"Times New Roman",serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{position:fixed;inset:0;display:block;cursor:pointer;touch-action:manipulation}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 70% at 50% 42%,transparent 40%,rgba(0,0,0,.55) 100%);}
  .hero{position:relative;text-align:center;pointer-events:none;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:0}
  .spacer{height:min(46vh,380px);height:min(46vmin,380px)}
  h1{font-size:clamp(15px,2.4vmin,22px);letter-spacing:.42em;text-transform:uppercase;
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:300;color:#b9b4aa}
  h1 span{color:#e23d28;letter-spacing:.42em}
  p{margin-top:12px;font-size:clamp(12px,2vmin,15px);font-style:italic;color:#6f6b64;letter-spacing:.06em}
  .hint{margin-top:14px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#4a473f}
  @media (prefers-reduced-motion:reduce){
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Red fedora logo spinning in 3D, dissolving into embers on hover"></canvas>
<div class="vignette"></div>
<div class="hero" aria-hidden="true">
  <div class="spacer"></div>
  <h1><span>Red</span>&nbsp;Hat&nbsp;Fedora</h1>
  <p>hover or tap &mdash; embers scatter, then return</p>
  <div class="hint">open source &middot; est. 1993</div>
</div>
<script>
(function(){
  "use strict";
  var canvas=document.getElementById("stage");
  var ctx=canvas.getContext("2d");
  var DPR=1, W=0, H=0, CX=0, CY=0, S=200;
  var reduced=false;
  try{reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  var T0=performance.now();
  var spin=0.6, spinSpeed=reduced?0:0.55, targetSpeed=reduced?0:0.55;
  var N=2200, parts=[], orbiters=[];
  var seq=-1; // sequence clock, -1 idle
  var hatAlpha=1, glowPulse=0;
  var mouseX=0.5, mouseY=0.42;

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX=W/2;CY=H*0.40;
    S=Math.min(W,H)*(window.innerWidth<600?0.42:0.34);
    S=Math.max(120,Math.min(S,340));
    buildParticles();
  }

  // ---- hat silhouette sampling ----
  var mask=document.createElement("canvas");
  function hatPoint(t){ // not needed
  }
  function sampleHomes(count){
    var ms=240, m=mask, mw=300, mh=220;
    m.width=mw;m.height=mh;
    var c=m.getContext("2d");
    c.clearRect(0,0,mw,mh);
    c.fillStyle="#fff";
    drawFedoraShape(c, mw/2, mh/2+8, 104, 1, 0, true);
    var pts=[];
    var data=null;
    try{data=c.getImageData(0,0,mw,mh).data;}catch(e){data=null;}
    if(!data){
      for(var i=0;i<count;i++){
        var a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random());
        pts.push({nx:Math.cos(a)*r*1.0, ny:Math.sin(a)*r*0.62-0.05});
      }
      return pts;
    }
    var tries=0;
    while(pts.length<count&&tries<count*30){
      tries++;
      var x=(Math.random()*mw)|0, y=(Math.random()*mh)|0;
      if(data[(y*mw+x)*4+3]>120){
        pts.push({nx:(x-mw/2)/(104), ny:(y-mh/2-8)/(104)});
      }
    }
    return pts;
  }

  function buildParticles(){
    var isSmall=W<600;
    N=isSmall?1300:(W*H>1200000?2800:2200);
    parts=[];orbiters=[];
    var homes=sampleHomes(N);
    for(var i=0;i<N;i++){
      var h=homes[i%Math.max(1,homes.length)]||{nx:0,ny:0};
      var ang=Math.random()*Math.PI*2, rad=Math.pow(Math.random(),0.6);
      var dist=(0.9+Math.random()*2.2)*S;
      var ember=Math.random();
      var col=ember<0.62?"255,61,40":(ember<0.85?"255,122,74":"255,190,130");
      var p={
        hx:h.nx, hy:h.ny,
        dx:Math.cos(ang)*dist*(0.7+Math.random()*0.7),
        dy:Math.sin(ang)*dist*0.75 - S*0.25*Math.random(),
        sw:0.5+Math.random()*1.6,      // swirl radius factor
        ph:Math.random()*Math.PI*2,    // phase
        sp:0.6+Math.random()*1.4,      // swirl speed
        sz:0.6+Math.random()*1.9,
        col:col, a:0.35+Math.random()*0.6,
        tw:Math.random()*Math.PI*2,
        orb:i%110===0
      };
      parts.push(p);
      if(p.orb&&orbiters.length<26)orbiters.push(p);
    }
  }

  // ---- fedora vector shape ----
  // squeeze: horizontal 3D squeeze (cos rotation), shade: -1..1 light dir, flat: silhouette only
  function drawFedoraShape(c,cx,cy,s,squeeze,shade,flat){
    c.save();
    c.translate(cx,cy);
    c.scale(Math.max(0.18,Math.abs(squeeze)),1);
    var flip=squeeze<0?-1:1;
    // brim (back)
    if(!flat){
      c.fillStyle="rgba(0,0,0,0.45)";
      c.beginPath();c.ellipse(0,s*0.52,s*1.28,s*0.20,0,0,Math.PI*2);c.fill();
    }
    // crown
    var g=c.createLinearGradient(-s*0.7*flip,0,s*0.7*flip,0);
    if(flat){g="#fff";}
    else{
      var l=0.5+shade*0.28;
      g.addColorStop(0,shade2("#8f1308",l-0.25));
      g.addColorStop(0.35,"#c81e12");
      g.addColorStop(0.55,"#ee2d1b");
      g.addColorStop(0.8,"#a3150a");
      g.addColorStop(1,"#5f0b05");
    }
    c.fillStyle=g;
    c.beginPath();
    c.moveTo(-s*0.62,s*0.28);
    c.bezierCurveTo(-s*0.66,-s*0.28,-s*0.52,-s*0.72,s*0.0,-s*0.74);
    c.bezierCurveTo(s*0.52,-s*0.72,s*0.66,-s*0.28,s*0.62,s*0.28);
    c.bezierCurveTo(s*0.30,s*0.44,-s*0.30,s*0.44,-s*0.62,s*0.28);
    c.closePath();c.fill();
    // pinch / dent shading
    if(!flat){
      c.fillStyle="rgba(0,0,0,0.28)";
      c.beginPath();
      c.moveTo(-s*0.18,-s*0.72);
      c.bezierCurveTo(-s*0.10,-s*0.30,-s*0.10,s*0.10,-s*0.05,s*0.34);
      c.bezierCurveTo(0,s*0.36,s*0.02,s*0.36,s*0.07,s*0.33);
      c.bezierCurveTo(s*0.02,-s*0.05,s*0.05,-s*0.4,s*0.16,-s*0.70);
      c.closePath();c.fill();
      c.fillStyle="rgba(255,255,255,0.10)";
      c.beginPath();
      c.ellipse(-s*0.34*flip,-s*0.18,s*0.10,s*0.30,-0.25,0,Math.PI*2);c.fill();
      // band
      c.fillStyle="#1a0a08";
      c.beginPath();
      c.moveTo(-s*0.60,s*0.10);c.bezierCurveTo(-s*0.2,s*0.26,s*0.2,s*0.26,s*0.60,s*0.10);
      c.lineTo(s*0.62,s*0.28);c.bezierCurveTo(s*0.3,s*0.44,-s*0.3,s*0.44,-s*0.62,s*0.28);
      c.closePath();c.fill();
      c.fillStyle="rgba(255,90,70,0.25)";
      c.fillRect(-s*0.60,s*0.10,s*1.2,s*0.035);
      // brim front
      var bg=c.createLinearGradient(0,s*0.28,0,s*0.72);
      bg.addColorStop(0,"#e52717");bg.addColorStop(0.5,"#b01509");bg.addColorStop(1,"#4d0803");
      c.fillStyle=bg;
      c.beginPath();c.ellipse(0,s*0.42,s*1.22,s*0.30,0,0.08*Math.PI,0.92*Math.PI);c.fill();
      c.beginPath();c.ellipse(0,s*0.38,s*1.22,s*0.28,0,Math.PI,Math.PI*2);c.fill();
      // rim light
      c.strokeStyle="rgba(255,120,90,0.35)";c.lineWidth=Math.max(1,s*0.012);
      c.beginPath();c.ellipse(0,s*0.42,s*1.22,s*0.30,0,0.15*Math.PI,0.85*Math.PI);c.stroke();
    }
    c.restore();
  }
  function shade2(hex,f){
    var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.max(0,Math.min(255,Math.round(r*f*2)));
    g=Math.max(0,Math.min(255,Math.round(g*f*2)));
    b=Math.max(0,Math.min(255,Math.round(b*f*2)));
    return "rgb("+r+","+g+","+b+")";
  }

  function rotXY(nx,ny,S,ang){
    var ca=Math.cos(ang),sa=Math.sin(ang);
    return {x:nx*ca*S, y:ny*S + Math.abs(nx*sa)*S*0.18};
  }

  function trigger(){
    if(reduced)return;
    if(seq<0||seq>3.4)seq=0;
  }

  canvas.addEventListener("pointerenter",function(e){setM(e);targetSpeed=0.08;trigger();});
  canvas.addEventListener("pointermove",function(e){setM(e);});
  canvas.addEventListener("pointerleave",function(){targetSpeed=reduced?0:0.55;});
  canvas.addEventListener("pointerdown",function(e){setM(e);targetSpeed=0.08;trigger();});
  window.addEventListener("pointerup",function(){targetSpeed=reduced?0:0.55;});
  function setM(e){mouseX=e.clientX/W;mouseY=e.clientY/H;}

  window.addEventListener("resize",resize);

  var stars=[];
  for(var i=0;i<130;i++)stars.push({x:Math.random(),y:Math.random()*0.8,r:Math.random()*1.3+0.2,o:Math.random()*0.5+0.1});

  function frame(now){
    var t=(now-T0)/1000;
    spinSpeed+=(targetSpeed-spinSpeed)*0.03;
    spin+=spinSpeed*0.016*3.2;
    var sq=Math.cos(spin), shade=Math.sin(spin);

    // sequence
    var dissolve=0, swirl=0;
    if(seq>=0){
      seq+=0.016;
      var D=1.15, SW=2.6, R=3.4; // phase durations (s)
      if(seq<D){var k=easeIO(seq/D);dissolve=k;swirl=0;hatAlpha=1-k;}
      else if(seq<D+SW){dissolve=1;swirl=(seq-D)/SW;hatAlpha=0;}
      else if(seq<D+SW+R){var rk=easeIO((seq-D-SW)/R);dissolve=1-rk;swirl=1-rk;hatAlpha=rk;}
      else{seq=-1;dissolve=0;swirl=0;hatAlpha=1;}
    } else {hatAlpha+=(1-hatAlpha)*0.05;}

    // bg
    var bg=ctx.createRadialGradient(CX+ (mouseX-0.5)*30,CY-40,10,CX,CY,S*3.2);
    bg.addColorStop(0,"#141821");bg.addColorStop(0.45,"#0b0d13");bg.addColorStop(1,"#05060a");
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle="#fff";
    for(var s2=0;s2<stars.length;s2++){var st=stars[s2];
      ctx.globalAlpha=st.o*(0.6+0.4*Math.sin(t*0.8+s2));
      ctx.fillRect(st.x*W,st.y*H,st.r,st.r);}
    ctx.globalAlpha=1;
    // floor glow + shadow
    var sh=ctx.createRadialGradient(CX,CY+S*0.95,5,CX,CY+S*0.95,S*1.5);
    sh.addColorStop(0,"rgba(226,45,20,0.20)");sh.addColorStop(0.5,"rgba(0,0,0,0.35)");sh.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=sh;
    ctx.beginPath();ctx.ellipse(CX,CY+S*0.95,S*1.5,S*0.30,0,0,Math.PI*2);ctx.fill();
    // soft key light
    var key=ctx.createRadialGradient(CX-S*0.5,CY-S*0.9,10,CX-S*0.5,CY-S*0.9,S*2.2);
    key.addColorStop(0,"rgba(120,140,190,0.10)");key.addColorStop(1,"rgba(120,140,190,0)");
    ctx.fillStyle=key;ctx.fillRect(0,0,W,H);

    // hat (vector) with shadow
    if(hatAlpha>0.01){
      ctx.save();
      ctx.globalAlpha=hatAlpha;
      ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=40;ctx.shadowOffsetY=24;
      drawFedoraShape(ctx,CX,CY,S,sq,shade,false);
      ctx.restore();
      // rim glow
      ctx.save();ctx.globalAlpha=hatAlpha*0.5;
      ctx.strokeStyle="rgba(255,80,50,0.20)";ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(CX,CY+S*0.42,S*1.24*Math.max(0.18,Math.abs(sq)),S*0.32,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }

    // particles
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    var pCount=parts.length;
    for(var i2=0;i2<pCount;i2++){
      var p=parts[i2];
      var home=rotXY(p.hx,p.hy,S,spin);
      var hx=CX+home.x, hy=CY+home.y;
      var px,py,alpha;
      if(dissolve<0.01&&!(p.orb&&seq<0)){
        // parked: invisible (hat covers)
        continue;
      }
      if(dissolve>=0.01||swirl>0){
        var e=dissolve;
        // dispersed target with swirl vortex
        var ang2=p.ph + swirl*3.2*p.sp + t*0.25*p.sp*swirl;
        var rad2=(S*0.35+p.sw*S*1.1)*(0.35+0.65*e);
        var vx=CX+Math.cos(ang2)*rad2+p.dx*e*0.55;
        var vy=CY+Math.sin(ang2)*rad2*0.7+p.dy*e*0.55+Math.sin(t*1.3+p.tw)*10*e;
        px=hx+(vx-hx)*e; py=hy+(vy-hy)*e;
        alpha=p.a*Math.sin(Math.PI*Math.min(1,e*1.1))*(1-e*0.25);
        if(seq>2.6)alpha=p.a*(1-e)+0.05;
      } else { px=hx;py=hy;alpha=0; }
      // lingering orbiters after reform
      if(seq<0&&p.orb){
        var oa=t*0.7+p.ph;
        var orx=S*(1.25+0.25*Math.sin(p.ph*3));
        px=CX+Math.cos(oa)*orx*Math.max(0.3,Math.abs(sq)*0.7+0.3);
        py=CY+Math.sin(oa)*S*0.55-20;
        alpha=0.5+0.3*Math.sin(t*2+p.tw);
        // faint trail
        ctx.strokeStyle="rgba("+p.col+",0.18)";ctx.lineWidth=p.sz*0.7;
        ctx.beginPath();
        ctx.moveTo(px-Math.cos(oa)*22,py+Math.sin(oa)*12);
        ctx.lineTo(px,py);ctx.stroke();
        glowPulse=1;
      }
      if(alpha<=0.01)continue;
      var twk=0.7+0.3*Math.sin(t*4+p.tw);
      ctx.fillStyle="rgba("+p.col+","+(alpha*twk).toFixed(3)+")";
      ctx.beginPath();ctx.arc(px,py,p.sz*(1+e*0.6),0,Math.PI*2);ctx.fill();
    }
    // few ambient sparks even idle
    ctx.restore();

    if(!reduced)requestAnimationFrame(frame);
  }

  function easeIO(k){return k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}

  resize();
  if(reduced){
    // single elegant static frame
    spin=0.6;frame(performance.now());
    // re-render once on resize only (resize already drew? draw again)
  }else{
    requestAnimationFrame(frame);
  }
  // expose for smoke harness
  window.__fedora={resize:resize,frame:frame,trigger:trigger};
})();
</script>
</body>
</html>
