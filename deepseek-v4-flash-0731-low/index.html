<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fedora</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0c10;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: default;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* soft ambient backdrop + a gentle light source from the upper left */
  .scene::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(30,28,40,0.0) 0%, rgba(12,12,18,0.55) 60%, #07070b 100%),
      radial-gradient(60% 45% at 46% 36%, rgba(255,168,90,0.10) 0%, rgba(255,168,90,0.0) 70%),
      radial-gradient(60% 45% at 60% 55%, rgba(120,150,255,0.06) 0%, rgba(120,150,255,0.0) 70%),
      linear-gradient(180deg, #0e0f16 0%, #090a0e 100%);
  }
  /* subtle vignette on top for depth */
  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(90% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: block;
  }
  .caption {
    position: relative;
    padding: 22px 20px 34px;
    text-align: center;
    color: #e8e4da;
    z-index: 2;
  }
  .caption h1 {
    margin: 0 0 6px;
    font-size: clamp(18px, 2.6vmin, 30px);
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    text-shadow: 0 2px 22px rgba(255,170,90,0.28);
  }
  .caption p {
    margin: 0;
    font-size: clamp(11px, 1.5vmin, 14px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9a958b;
  }
  .hint {
    position: absolute;
    bottom: 96px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #6f6a62;
    opacity: 0.7;
    z-index: 2;
    transition: opacity .6s ease;
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <canvas id="stage"></canvas>
    <div class="caption">
      <h1>The Fedora</h1>
      <p>a red&ndash;hat tribute</p>
    </div>
    <div class="hint" id="hint">hover or tap to dissolve</div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var scene = document.getElementById("scene");
  var hint = document.getElementById("hint");

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 0, H = 0, CX = 0, CY = 0, unit = 1, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2 - H * 0.03;
    unit = Math.min(W, H) * 0.15;
  }
  window.addEventListener("resize", resize);
  resize();

  var FOV = 1500;

  // Pre-rendered glow sprites (warm ember tones + a cool accent)
  function makeSprite(h, s, l) {
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, "hsla(" + h + "," + s + "%," + l + "%,0.95)");
    grad.addColorStop(0.35, "hsla(" + h + "," + s + "%," + l + "%,0.32)");
    grad.addColorStop(0.7, "hsla(" + h + "," + s + "%," + l + "%,0.08)");
    grad.addColorStop(1, "hsla(" + h + "," + s + "%," + l + "%,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  var SPRITES = [
    makeSprite(18, 100, 60),   // deep ember orange
    makeSprite(30, 96, 62),    // warm amber
    makeSprite(42, 90, 64),    // golden
    makeSprite(190, 45, 68)    // cool accent
  ];

  // ------- Hat geometry (a point-cloud fedora) -------
  var particles = [];
  var EMBER_N = 90;
  var P = 0; // index pointer for ember selection

  function mk(x, y, z, hue, sat, lig) {
    var sp = hue < 90 ? (hue < 25 ? 0 : hue < 36 ? 1 : 2) : 3;
    return {
      x: x, y: y, z: z,          // home position (y up, z depth toward viewer)
      ox: 0, oy: 0, oz: 0,       // burst / orbit offset
      hue: hue, sat: sat, lig: lig,
      sp: sp,
      size: 3.4 + Math.random() * 2.6,
      dir: Math.random() * Math.PI * 2,
      r: 0.35 + Math.random(),   // radial burst magnitude
      vr: 0.4 + Math.random() * 0.8, // per-particle swirl speed
      yoff: (Math.random() - 0.5) * 1.2,
      ember: false,
      t0: Math.random() * Math.PI * 2, // ember orbit phase
      oR: 1.5 + Math.random() * 1.1,   // ember orbit radius
      oY: Math.random() * 1.2 + 0.2,
      oSp: 0.5 + Math.random() * 0.8,
      trail: [],
      tr0: 0
    };
  }

  (function buildHat() {
    var i, th, y, r, ph, rx, rz, t, cosph;
    // Crown cylinder
    for (i = 0; i < 1500; i++) {
      th = Math.random() * Math.PI * 2;
      y = Math.random() * 1.5;
      r = 1.05 * (1 - 0.09 * (y / 1.5));
      particles.push(mk(r * Math.cos(th), y, r * Math.sin(th),
        24 + Math.random() * 14, 22, 58));
    }
    // Dome (uniform cap on sphere, centre (0,1.5,0), R 0.95)
    for (i = 0; i < 720; i++) {
      th = Math.random() * Math.PI * 2;
      cosph = 0.9 + 0.1 * Math.random();
      ph = Math.acos(cosph);
      particles.push(mk(
        0.95 * Math.sin(ph) * Math.cos(th),
        1.5 + 0.95 * cosph,
        0.95 * Math.sin(ph) * Math.sin(th),
        28 + Math.random() * 14, 24, 62));
    }
    // Band (a subtle darker copper ring near the base of the crown)
    for (i = 0; i < 260; i++) {
      th = Math.random() * Math.PI * 2;
      y = 0.42 + Math.random() * 0.12;
      r = 1.05;
      particles.push(mk(r * Math.cos(th), y, r * Math.sin(th),
        16 + Math.random() * 10, 40, 44));
    }
    // Brim: an oval brim with a gentle edge curve
    for (i = 0; i < 1350; i++) {
      th = Math.random() * Math.PI * 2;
      t = Math.sqrt(Math.random());          // area-uniform
      rx = 1.05 + t * (2.35 - 1.05);
      rz = 1.05 + t * (1.98 - 1.05);
      var edge = t;
      var yEdge = -0.10 * edge - 0.03 + 0.04 * Math.sin(th);
      particles.push(mk(rx * Math.cos(th), yEdge, rz * Math.sin(th),
        22 + Math.random() * 12, 20, 56));
    }
    // Flag a handful as persistent "ember" particles
    var step = Math.max(1, Math.floor(particles.length / EMBER_N));
    for (i = 0; i < EMBER_N; i++) {
      var idx = (i * step + Math.floor(Math.random() * step)) % particles.length;
      var q = particles[idx];
      q.ember = true;
      q.oSp = 0.45 + Math.random() * 0.9;
      q.oR = 1.6 + Math.random() * 1.3;
      q.oY = Math.random() * 1.4 + 0.1;
    }
  })();

  // ------- Animation state -------
  var spinAngle = 0;
  var spinSpeed = reduceMotion ? 0 : 0.5;
  var hover = false;
  var burstStart = 0;
  var burstComplete = false;
  var emberTime = 0;
  var hoverStart = 0;
  var pulse = 0;          // reduced-motion breathing glow
  var last = 0;

  function smoothstep(a, b, t) {
    if (t <= a) return 0;
    if (t >= b) return 1;
    var x = (t - a) / (b - a);
    return x * x * (3 - 2 * x);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function onEnter(e) {
    hover = true;
    hint.style.opacity = 0;
    if (!reduceMotion) {
      if (burstComplete) emberTime = 0;
      burstStart = performance.now();
      burstComplete = false;
    }
  }
  function onLeave() {
    hover = false;
    burstComplete = false;
    emberTime = 0;
    hint.style.opacity = 0.7;
  }
  scene.addEventListener("pointerenter", onEnter);
  scene.addEventListener("pointerleave", onLeave);
  // tap / touch toggle
  scene.addEventListener("click", function () {
    if (hover) { onLeave(); } else { onEnter(); }
  });

  function rotY(x, y, z, a) {
    var c = Math.cos(a), s = Math.sin(a);
    return { x: x * c + z * s, y: y, z: -x * s + z * c };
  }

  function project(px, py, pz) {
    var scale = FOV / (FOV - pz);
    return { sx: CX + px * scale, sy: CY - py * scale, s: scale, z: pz };
  }

  function update(dt, now) {
    var targetSpeed = (hover && !reduceMotion) ? 0.06 : (reduceMotion ? 0 : 0.5);
    spinSpeed += (targetSpeed - spinSpeed) * Math.min(1, dt * 3);
    spinAngle += spinSpeed * dt;

    // Reduced-motion: no particle motion, only a soft breathing glow on hover.
    if (reduceMotion) {
      var tp = hover ? 1 : 0;
      pulse += (tp - pulse) * Math.min(1, dt * 2.5);
      return;
    }

    var i, p;

    if (hover) {
      var total = 3.3;
      var t = clamp((now - burstStart) / total, 0, 1);
      var explode = smoothstep(0, 0.20, t);
      var ret = 1 - smoothstep(0.48, 0.96, t);
      var mag = explode * ret;

      if (t >= 1 && !burstComplete) {
        burstComplete = true;
        emberTime = 0;
      }
      if (burstComplete) emberTime += dt;

      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        if (p.ember && burstComplete) {
          // persistent orbiting embers with fading trails
          var ang = p.t0 + emberTime * p.oSp;
          var wob = Math.sin(emberTime * 0.6 + p.t0) * 0.4;
          p.ox = p.oR * Math.cos(ang);
          p.oz = p.oR * Math.sin(ang);
          p.oy = p.oY - p.y + wob;
        } else {
          // swirling dissolution envelope
          var sw = ang = mag * 6 + p.dir;
          p.ox = Math.cos(sw) * p.r * mag * 2.6;
          p.oz = Math.sin(sw) * p.r * mag * 2.6;
          p.oy = (Math.sin(now * 0.001 + p.dir) * 0.6 + p.yoff) * mag * 1.4;
        }
      }
    } else {
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        p.ox = p.oy = p.oz = 0;
        p.trail.length = 0;
      }
    }
  }

  function render(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    var i, p, r, proj, baseMul, isEmber, size, alpha;

    var reduced = reduceMotion;

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      isEmber = reduced ? false : (p.ember && burstComplete && hover);

      var ox = p.ox, oy = p.oy, oz = p.oz;

      // ember trails
      if (isEmber) {
        p.trail.push(project(
          (p.x + ox) * unit, (p.y + oy) * unit, (p.z + oz) * unit));
        if (p.trail.length > 10) p.trail.shift();
      }

      r = rotY(p.x + ox, p.y + oy, p.z + oz, spinAngle);
      proj = project(r.x * unit, r.y * unit, r.z * unit);
      if (proj.z > FOV - 30) continue;

      // ember trail drawing
      if (isEmber && p.trail.length > 2) {
        var fade = clamp((p.trail.length - 2) / 6, 0, 1);
        ctx.globalAlpha = 0.14 * fade;
        ctx.strokeStyle = "hsla(" + p.hue + "," + p.sat + "%," + p.lig + "%,1)";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(p.trail[0].sx, p.trail[0].sy);
        for (var k = 1; k < p.trail.length; k++) {
          ctx.lineTo(p.trail[k].sx, p.trail[k].sy);
        }
        ctx.stroke();
      }

      // brightness / size modulation
      if (reduced) {
        baseMul = 0.7 + pulse * 0.5;
        alpha = 0.5 + pulse * 0.3;
      } else if (isEmber) {
        baseMul = 1.6 + Math.sin(now * 0.004 + p.t0) * 0.3;
        alpha = 0.95;
      } else if (hover && !burstComplete) {
        var t = clamp((performance.now() - burstStart) / 3.3, 0, 1);
        var mag = smoothstep(0, 0.2, t) * (1 - smoothstep(0.48, 0.96, t));
        baseMul = 1 + mag * 2.2;
        alpha = 0.55 + mag * 0.4;
      } else {
        baseMul = 1;
        alpha = 0.6;
      }

      size = p.size * proj.s * baseMul;
      var gr = clamp((FOV - proj.z) / FOV, 0.4, 1); // mild depth fade
      ctx.globalAlpha = alpha * gr;
      ctx.drawImage(SPRITES[p.sp],
        proj.sx - size / 2, proj.sy - size / 2, size, size);
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0.016;
    if (dt > 0.05) dt = 0.05;
    last = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
