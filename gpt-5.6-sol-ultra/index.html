<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070a">
  <title>Fedora in Motion</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4efe9;
      --muted: rgba(244, 239, 233, .56);
      --line: rgba(255, 255, 255, .13);
      --red: #e12632;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-width: 280px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(77, 16, 23, .16) 0%, rgba(10, 11, 15, 0) 44%),
        radial-gradient(circle at 13% 16%, rgba(255, 255, 255, .028), transparent 24%),
        linear-gradient(145deg, #0a0b0f 0%, #050609 52%, #09090d 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.009) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: .18;
      -webkit-mask-image: radial-gradient(circle at 50% 48%, black, transparent 72%);
      mask-image: radial-gradient(circle at 50% 48%, black, transparent 72%);
    }

    body::after {
      box-shadow: inset 0 0 180px rgba(0, 0, 0, .68);
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
    }

    .scene {
      position: relative;
      width: min(100vw, 960px);
      height: min(100vh, 780px);
      height: min(100svh, 780px);
      min-height: min(100svh, 360px);
      margin: 0;
      padding: 0;
      overflow: visible;
      border: 0;
      outline: 0;
      appearance: none;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: pan-y pinch-zoom;
      -webkit-tap-highlight-color: transparent;
    }

    .scene:disabled {
      cursor: default;
      opacity: 1;
    }

    .scene::before {
      content: "";
      position: absolute;
      z-index: -2;
      left: 50%;
      top: 44%;
      width: min(74vw, 650px);
      aspect-ratio: 1.5;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(190, 22, 34, .075), rgba(98, 16, 26, .025) 45%, transparent 70%);
      filter: blur(18px);
      opacity: .84;
      transition: opacity 900ms ease, transform 1800ms cubic-bezier(.2,.75,.2,1);
    }

    .scene.is-active::before {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.14);
    }

    .scene:focus-visible::after {
      content: "";
      position: absolute;
      inset: 10% 12% 9%;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 32px;
      box-shadow: 0 0 0 4px rgba(225, 38, 50, .11);
    }

    canvas {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .webgl-ready canvas { opacity: 1; }

    .fallback {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 44%;
      width: min(76vw, 570px);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 28px 24px rgba(0,0,0,.48));
      opacity: 1;
      animation: fallback-turn 18s linear infinite;
      transform-origin: 50% 58%;
    }

    .webgl-ready .fallback {
      opacity: 0;
      animation-play-state: paused;
    }

    @keyframes fallback-turn {
      0%, 100% { transform: translate(-50%, -50%) perspective(700px) rotateY(-18deg); }
      50% { transform: translate(-50%, -50%) perspective(700px) rotateY(18deg); }
    }

    .ground-shadow {
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 61%;
      width: min(49vw, 410px);
      height: clamp(28px, 5.2vw, 54px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(0,0,0,.82), rgba(0,0,0,.36) 42%, transparent 72%);
      filter: blur(8px);
      opacity: .9;
      transition: opacity 700ms ease, transform 1300ms cubic-bezier(.2,.7,.2,1);
    }

    .scene.is-active .ground-shadow {
      opacity: .26;
      transform: translate(-50%, -50%) scale(.72);
    }

    .caption {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: clamp(27px, 9.5%, 76px);
      display: grid;
      justify-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 40px);
      transform: translateX(-50%);
      pointer-events: none;
      text-align: center;
    }

    .caption::before {
      content: "";
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.27), transparent);
    }

    .caption-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--muted);
      font-size: clamp(9px, 1.1vw, 11px);
      font-weight: 520;
      line-height: 1.4;
      letter-spacing: .19em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .signal {
      position: relative;
      width: 4px;
      height: 4px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #e63842;
      box-shadow: 0 0 9px rgba(230, 56, 66, .62);
    }

    .signal::after {
      content: "";
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(230, 56, 66, .32);
      border-radius: inherit;
      opacity: 0;
    }

    .is-active .signal::after { animation: signal-pulse 1.35s ease-out infinite; }

    @keyframes signal-pulse {
      0% { transform: scale(.55); opacity: 0; }
      28% { opacity: 1; }
      100% { transform: scale(1.75); opacity: 0; }
    }

    @media (max-height: 520px) {
      .caption { bottom: 18px; gap: 7px; }
      .scene:focus-visible::after { inset: 4% 10%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <button class="scene" id="scene" type="button" aria-label="Scatter and reform the red fedora">
      <span class="ground-shadow" aria-hidden="true"></span>

      <svg class="fallback" viewBox="0 0 520 310" role="img" aria-label="A sculpted red fedora">
        <defs>
          <linearGradient id="brim-red" x1=".08" y1=".15" x2=".9" y2=".85">
            <stop offset="0" stop-color="#f13b43"/>
            <stop offset=".42" stop-color="#c71f2a"/>
            <stop offset="1" stop-color="#6f0d18"/>
          </linearGradient>
          <linearGradient id="crown-red" x1=".13" y1=".1" x2=".86" y2=".92">
            <stop offset="0" stop-color="#ed3941"/>
            <stop offset=".48" stop-color="#c51b27"/>
            <stop offset="1" stop-color="#730d18"/>
          </linearGradient>
          <radialGradient id="top-red" cx="34%" cy="25%" r="82%">
            <stop offset="0" stop-color="#f34a50"/>
            <stop offset=".58" stop-color="#c71d28"/>
            <stop offset="1" stop-color="#7a0d18"/>
          </radialGradient>
          <linearGradient id="band-black" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#251216"/>
            <stop offset=".5" stop-color="#08090b"/>
            <stop offset="1" stop-color="#351014"/>
          </linearGradient>
        </defs>
        <ellipse cx="266" cy="255" rx="174" ry="23" fill="#000" opacity=".3"/>
        <path d="M65 190C97 163 158 151 230 153c88 1 173 23 222 57-25 30-110 43-211 38C140 243 75 222 65 190Z" fill="#470a12"/>
        <path d="M61 177c38-30 113-47 198-39 91 8 168 38 201 70-62 22-144 25-234 11C139 206 82 194 61 177Z" fill="url(#brim-red)"/>
        <path d="M156 160c8-53 11-91 29-121 20-19 115-20 148 1 23 36 28 78 27 139-49 17-155 8-204-19Z" fill="url(#crown-red)"/>
        <path d="M183 43c25-24 119-26 151-2-17 29-46 42-80 38-34-4-57-15-71-36Z" fill="url(#top-red)"/>
        <path d="M155 142c53 25 151 33 205 15l1 30c-61 21-159 12-208-17Z" fill="url(#band-black)"/>
        <path d="M185 42c29 15 51 16 70 3 22 17 50 16 77-3-15 31-45 43-79 39-32-3-56-15-68-39Z" fill="#8e111c" opacity=".58"/>
        <path d="M77 176c58 21 136 33 214 34 61 1 116-6 158-19" fill="none" stroke="#ff5b61" stroke-width="2" opacity=".2"/>
      </svg>

      <canvas id="canvas" aria-hidden="true"></canvas>

      <span class="caption" aria-hidden="true">
        <span class="caption-row"><span class="signal"></span><span id="captionText">Hover or tap to set the form free</span></span>
      </span>
    </button>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const scene = document.getElementById('scene');
      const caption = document.getElementById('captionText');
      const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
      const hoverQuery = matchMedia('(hover: hover) and (pointer: fine)');
      const gl = canvas.getContext('webgl2', {
        alpha: true,
        antialias: true,
        depth: true,
        powerPreference: 'high-performance',
        premultipliedAlpha: false
      });

      let reducedMotion = motionQuery.matches;
      let raf = 0;
      let lastTime = 0;
      let effectStart = 0;
      let pausedAt = 0;
      let active = false;
      let orbitEnabled = false;
      let hoverArmed = true;
      let yaw = -.58;
      let effect = 0;
      let cssWidth = 0;
      let cssHeight = 0;
      let pixelRatio = 1;
      let modelScale = 1;
      let centerX = 0;
      let centerY = 0;
      let pointerDown = null;
      const EFFECT_SECONDS = 5.15;

      const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
      const smooth = (a, b, x) => {
        const t = clamp((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
      const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
      const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
      const normalize = (v) => {
        const l = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0]/l, v[1]/l, v[2]/l];
      };

      if (!gl) {
        document.documentElement.classList.add('no-webgl');
        caption.textContent = reducedMotion ? 'A quiet study in depth and light' : 'A red fedora, sculpted in light';
        scene.disabled = true;
        scene.setAttribute('aria-label', 'A sculpted red fedora');
        return;
      }

      const vertexMesh = `#version 300 es
        precision highp float;
        layout(location=0) in vec3 aPosition;
        layout(location=1) in vec3 aNormal;
        layout(location=2) in vec3 aColor;

        uniform vec2 uViewport;
        uniform vec2 uCenter;
        uniform float uScale;
        uniform float uYaw;
        uniform float uPitch;

        out vec3 vLocal;
        out vec3 vWorld;
        out vec3 vNormal;
        out vec3 vColor;

        vec3 model(vec3 p) {
          float cy = cos(uYaw), sy = sin(uYaw);
          p = vec3(cy*p.x + sy*p.z, p.y, -sy*p.x + cy*p.z);
          float cp = cos(uPitch), sp = sin(uPitch);
          return vec3(p.x, cp*p.y - sp*p.z, sp*p.y + cp*p.z);
        }

        vec4 projectPoint(vec3 p) {
          float camera = 4.8;
          float w = max(.2, camera - p.z);
          float zoom = camera / w;
          vec2 origin = vec2(uCenter.x/uViewport.x*2.0-1.0, 1.0-uCenter.y/uViewport.y*2.0);
          vec2 offset = vec2(2.0*uScale*p.x/uViewport.x, 2.0*uScale*(p.y-.55)/uViewport.y) * zoom;
          float depth = .38 - p.z*.075;
          return vec4((origin + offset)*w, depth*w, w);
        }

        void main() {
          vLocal = aPosition;
          vWorld = model(aPosition);
          vNormal = normalize(model(aNormal));
          vColor = aColor;
          gl_Position = projectPoint(vWorld);
        }
      `;

      const fragmentMesh = `#version 300 es
        precision highp float;
        in vec3 vLocal;
        in vec3 vWorld;
        in vec3 vNormal;
        in vec3 vColor;
        uniform float uEffect;
        out vec4 outColor;

        float hash31(vec3 p) {
          p = fract(p*.1031);
          p += dot(p, p.yzx + 33.33);
          return fract((p.x+p.y)*p.z);
        }

        float noise3(vec3 p) {
          vec3 i = floor(p), f = fract(p);
          f = f*f*(3.0-2.0*f);
          return mix(
            mix(mix(hash31(i+vec3(0,0,0)),hash31(i+vec3(1,0,0)),f.x),
                mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),
                mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y), f.z);
        }

        float fbm(vec3 p) {
          float n = noise3(p)*.58;
          n += noise3(p*2.03+4.7)*.28;
          n += noise3(p*4.11+9.2)*.14;
          return n;
        }

        void main() {
          float leaving = smoothstep(.035, .285, uEffect);
          float returning = smoothstep(.705, .945, uEffect);
          float keep = max(1.0-leaving, returning);
          float grain = fbm(vLocal*3.75 + vec3(1.7, .3, 2.1));
          if (keep < .002 || grain > keep) discard;

          vec3 N = normalize(vNormal);
          vec3 V = normalize(vec3(0.0,.3,4.8)-vWorld);
          vec3 key = normalize(vec3(-.56,.78,.52));
          vec3 fill = normalize(vec3(.72,.22,-.58));
          float diffuse = max(dot(N,key),0.0);
          float cool = max(dot(N,fill),0.0);
          float hemi = N.y*.5+.5;
          vec3 H = normalize(key+V);
          float spec = pow(max(dot(N,H),0.0),34.0);
          float rim = pow(1.0-abs(dot(N,V)),3.0);
          float boundary = (1.0-smoothstep(0.0,.065,abs(grain-keep))) * step(.004,keep) * step(keep,.996);

          vec3 color = vColor*(.25 + .57*diffuse + .14*hemi + .1*cool);
          color += vec3(.68,.11,.075)*rim*.15 + vec3(1.0,.35,.17)*spec*.22;
          color += vec3(1.0,.085,.028)*boundary*.28;
          outColor = vec4(color,1.0);
        }
      `;

      const vertexParticle = `#version 300 es
        precision highp float;
        layout(location=0) in vec3 aPosition;
        layout(location=1) in vec3 aNormal;
        layout(location=2) in vec3 aColor;
        layout(location=3) in vec4 aSeed;
        layout(location=4) in float aSize;

        uniform vec2 uViewport;
        uniform vec2 uCenter;
        uniform float uScale;
        uniform float uYaw;
        uniform float uPitch;
        uniform float uEffect;
        uniform float uDpr;

        out vec3 vColor;
        out float vAlpha;
        out float vHeat;

        float smoother(float a, float b, float x) {
          float t = clamp((x-a)/(b-a),0.0,1.0);
          return t*t*t*(t*(t*6.0-15.0)+10.0);
        }

        vec3 rotateY(vec3 p, float a) {
          float c=cos(a), s=sin(a);
          return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);
        }

        vec3 model(vec3 p) {
          p = rotateY(p,uYaw);
          float cp=cos(uPitch), sp=sin(uPitch);
          return vec3(p.x,cp*p.y-sp*p.z,sp*p.y+cp*p.z);
        }

        vec4 projectPoint(vec3 p) {
          float camera=4.8;
          float w=max(.2,camera-p.z);
          float zoom=camera/w;
          vec2 origin=vec2(uCenter.x/uViewport.x*2.0-1.0,1.0-uCenter.y/uViewport.y*2.0);
          vec2 offset=vec2(2.0*uScale*p.x/uViewport.x,2.0*uScale*(p.y-.55)/uViewport.y)*zoom;
          float depth=.38-p.z*.075;
          return vec4((origin+offset)*w,depth*w,w);
        }

        void main() {
          float p=uEffect;
          float delay=aSeed.w;
          float outward=smoother(.045+.075*delay,.27+.035*delay,p);
          float homeward=1.0-smoother(.59+.065*delay,.96,p);
          float envelope=outward*homeward;

          float theta=6.2831853*aSeed.x;
          float rz=aSeed.y*2.0-1.0;
          float rr=sqrt(max(0.0,1.0-rz*rz));
          vec3 randomDir=vec3(cos(theta)*rr,rz,sin(theta)*rr);
          vec3 radial=normalize(vec3(aPosition.x,.36*(aPosition.y-.5),aPosition.z)+vec3(0,.001,0));
          vec3 direction=normalize(radial*.76+randomDir*.57);
          float distance=.62+1.72*pow(aSeed.z,.72);
          vec3 cloud=aPosition+direction*distance;
          cloud.y+=(.18+.58*aSeed.y*aSeed.y)*smoother(.08,.5,p);

          float handed=aSeed.y>.5?1.0:-1.0;
          float turn=handed*(2.15+2.35*aSeed.x)*smoother(.11,.72,p);
          cloud=rotateY(cloud,turn);
          float flutter=sin(3.1415926*smoother(.04,.92,p));
          cloud.x+=sin(aSeed.x*31.0+p*17.0)*.105*flutter;
          cloud.y+=cos(aSeed.z*27.0+p*13.0)*.105*flutter;
          cloud.z+=sin(aSeed.y*29.0-p*15.0)*.105*flutter;

          vec3 local=mix(aPosition,cloud,envelope);
          vec3 world=model(local);
          vec3 worldNormal=normalize(model(aNormal));
          float camera=4.8;
          float perspective=camera/max(.2,camera-world.z);
          gl_Position=projectPoint(world);
          gl_PointSize=(6.4+aSize*5.2)*uDpr*perspective;

          float appear=smoothstep(.035+.025*delay,.20+.025*delay,p);
          float fade=1.0-smoothstep(.81+.045*(1.0-delay),.985,p);
          float facing=.7+.3*max(worldNormal.z,0.0);
          vAlpha=appear*fade*(.52+.46*aSeed.z)*facing;
          float light=.43+.5*max(dot(worldNormal,normalize(vec3(-.56,.78,.52))),0.0);
          vColor=mix(aColor*light,vec3(1.0,.18,.055),.38+.18*aSeed.x);
          vHeat=aSeed.y;
        }
      `;

      const fragmentParticle = `#version 300 es
        precision highp float;
        in vec3 vColor;
        in float vAlpha;
        in float vHeat;
        out vec4 outColor;
        void main() {
          vec2 q=gl_PointCoord-.5;
          float d=length(q)*2.0;
          if (d>1.0) discard;
          float halo=pow(max(0.0,1.0-d),2.45);
          float core=1.0-smoothstep(.0,.22,d);
          vec3 hot=mix(vColor,vec3(1.0,.72,.38),core*(.38+.26*vHeat));
          float alpha=vAlpha*(halo*.48+core*.94);
          outColor=vec4(hot,alpha);
        }
      `;

      const vertexOrbit = `#version 300 es
        precision highp float;
        layout(location=0) in vec4 aOrbit;
        layout(location=1) in vec3 aMeta;
        layout(location=2) in vec3 aColor;

        uniform vec2 uViewport;
        uniform vec2 uCenter;
        uniform float uScale;
        uniform float uYaw;
        uniform float uPitch;
        uniform float uTime;
        uniform float uDpr;
        uniform float uOrbitAlpha;

        out vec3 vColor;
        out float vAlpha;

        vec3 model(vec3 p) {
          float cy=cos(uYaw), sy=sin(uYaw);
          p=vec3(cy*p.x+sy*p.z,p.y,-sy*p.x+cy*p.z);
          float cp=cos(uPitch), sp=sin(uPitch);
          return vec3(p.x,cp*p.y-sp*p.z,sp*p.y+cp*p.z);
        }

        vec4 projectPoint(vec3 p) {
          float camera=4.8;
          float w=max(.2,camera-p.z);
          float zoom=camera/w;
          vec2 origin=vec2(uCenter.x/uViewport.x*2.0-1.0,1.0-uCenter.y/uViewport.y*2.0);
          vec2 offset=vec2(2.0*uScale*p.x/uViewport.x,2.0*uScale*(p.y-.55)/uViewport.y)*zoom;
          float depth=.38-p.z*.075;
          return vec4((origin+offset)*w,depth*w,w);
        }

        void main() {
          float trail=aMeta.x;
          float angle=aOrbit.x+uTime*aOrbit.w-trail*(.105+.035*aMeta.z);
          vec3 local=vec3(
            aOrbit.y*cos(angle),
            aOrbit.z+.24*sin(angle*1.65+aOrbit.x),
            aOrbit.y*.61*sin(angle)
          );
          vec3 world=model(local);
          float perspective=4.8/max(.2,4.8-world.z);
          gl_Position=projectPoint(world);
          gl_PointSize=mix(8.4,2.7,trail)*uDpr*perspective*aMeta.y;
          vAlpha=uOrbitAlpha*pow(1.0-trail,2.25)*(.78+.2*aMeta.z);
          vColor=mix(aColor,vec3(1.0,.55,.24),(1.0-trail)*.23);
        }
      `;

      const fragmentOrbit = `#version 300 es
        precision highp float;
        in vec3 vColor;
        in float vAlpha;
        out vec4 outColor;
        void main() {
          float d=length(gl_PointCoord-.5)*2.0;
          if (d>1.0) discard;
          float glow=pow(max(0.0,1.0-d),2.2);
          float core=1.0-smoothstep(.0,.27,d);
          outColor=vec4(mix(vColor,vec3(1.0,.82,.55),core*.45),vAlpha*(glow*.64+core*.84));
        }
      `;

      function shader(type, source) {
        const s=gl.createShader(type);
        gl.shaderSource(s,source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }

      function program(vs,fs) {
        const p=gl.createProgram();
        gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));
        gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
        return p;
      }

      let meshProgram, particleProgram, orbitProgram;
      try {
        meshProgram=program(vertexMesh,fragmentMesh);
        particleProgram=program(vertexParticle,fragmentParticle);
        orbitProgram=program(vertexOrbit,fragmentOrbit);
      } catch (error) {
        console.warn('The 3D scene could not be initialized.',error);
        caption.textContent='A red fedora, sculpted in light';
        scene.disabled=true;
        return;
      }

      const meshData=[];
      const triangles=[];

      const crown=(u,v,expand=1) => {
        const a=v*Math.PI*2;
        const y=-.015+1.16*u;
        const rx=.79-.145*u;
        const rz=.585-.078*u;
        const high=Math.exp(-Math.pow((u-.75)/.225,2));
        const angleDiff=(x,y) => Math.atan2(Math.sin(x-y),Math.cos(x-y));
        const pinchA=Math.exp(-Math.pow(angleDiff(a,Math.PI/2-.43)/.19,2));
        const pinchB=Math.exp(-Math.pow(angleDiff(a,Math.PI/2+.43)/.19,2));
        const pinch=1-.17*high*(pinchA+pinchB);
        const front=Math.exp(-Math.pow(angleDiff(a,Math.PI/2)/.28,2))*Math.exp(-Math.pow((u-.88)/.17,2));
        return [rx*Math.cos(a)*pinch*expand,y,(rz*Math.sin(a)*pinch-.045*u-.05*front)*expand];
      };

      const crownTop=(u,v) => {
        const a=v*Math.PI*2;
        const r=Math.sqrt(Math.max(0,u));
        const edge=smooth(.63,1,r);
        const side=crown(1,v);
        const x=(.648*r*Math.cos(a))*(1-edge)+side[0]*edge;
        const z=(.508*r*Math.sin(a)-.045)*(1-edge)+side[2]*edge;
        const inside=Math.max(0,1-r*r);
        const cap=.16*Math.pow(inside,.56);
        const crease=Math.exp(-Math.pow(x/.155,2))*Math.exp(-Math.pow((z+.03)/.52,4));
        const frontDent=.035*Math.exp(-Math.pow((z-.25)/.16,2))*Math.exp(-Math.pow(x/.42,4));
        return [x,1.145+cap-.13*crease*Math.pow(inside,.34)-frontDent,z];
      };

      const brim=(u,v,drop=0) => {
        const a=v*Math.PI*2;
        const r=Math.sqrt(Math.max(0,u));
        const edge=smooth(.54,1,r);
        const y=-.026*Math.max(0,(r-.47)/.53)+edge*(.052*Math.cos(2*a)-.067*Math.sin(a)+.012*Math.sin(3*a))-drop;
        return [1.48*r*Math.cos(a),y,.92*r*Math.sin(a),];
      };

      const rim=(u,v) => {
        const top=brim(1,v,0);
        return [top[0],top[1]-.052*u,top[2]];
      };

      const creaseFill=(u,v) => {
        const z=-.41+.78*u;
        const halfWidth=.105+.03*Math.sin(Math.PI*u);
        const x=(v*2-1)*halfWidth;
        const y=1.202+.018*Math.sin(Math.PI*u)-.012*Math.abs(v*2-1);
        return [x,y,z];
      };

      function normalAt(fn,u,v,mode) {
        const e=.0015;
        const ua=clamp(u-e), ub=clamp(u+e);
        const va=(v-e+1)%1, vb=(v+e)%1;
        const tu=sub(fn(ub,v),fn(ua,v));
        const tv=sub(fn(u,vb),fn(u,va));
        let n=normalize(cross(tu,tv));
        const p=fn(u,v);
        if (mode==='up' && n[1]<0) n=n.map(x=>-x);
        if (mode==='down' && n[1]>0) n=n.map(x=>-x);
        if ((mode==='out'||mode==='rim') && dot(n,[p[0],0,p[2]])<0) n=n.map(x=>-x);
        return n;
      }

      function makeVertex(fn,u,v,mode) {
        return {p:fn(u,v),n:normalAt(fn,u,v,mode)};
      }

      function addTriangle(a,b,c,color) {
        for (const q of [a,b,c]) meshData.push(...q.p,...q.n,...color);
        const area=Math.hypot(...cross(sub(b.p,a.p),sub(c.p,a.p)))*.5;
        if (area>1e-7) triangles.push({a,b,c,color,area});
      }

      function surface(fn,us,vs,mode,color,u0=0,u1=1) {
        for (let j=0;j<vs;j++) {
          const v0=j/vs, v1=(j+1)/vs;
          for (let i=0;i<us;i++) {
            const q0=i/us, q1=(i+1)/us;
            const ua=u0+(u1-u0)*q0, ub=u0+(u1-u0)*q1;
            const a=makeVertex(fn,ua,v0,mode);
            const b=makeVertex(fn,ub,v0,mode);
            const c=makeVertex(fn,ub,v1,mode);
            const d=makeVertex(fn,ua,v1,mode);
            addTriangle(a,b,c,color);
            addTriangle(a,c,d,color);
          }
        }
      }

      surface(brim,14,88,'up',[.71,.018,.033]);
      surface((u,v)=>brim(u,v,.052),13,88,'down',[.255,.006,.021]);
      surface(rim,2,88,'rim',[.43,.009,.025]);
      surface(crown,17,88,'out',[.77,.022,.038]);
      surface(crownTop,12,88,'up',[.86,.032,.042]);
      surface(creaseFill,12,3,'up',[.38,.008,.016]);
      surface((u,v)=>crown(.12+.22*u,v,1.012),5,88,'out',[.025,.012,.016]);

      let totalArea=0;
      const cumulative=[];
      for (const t of triangles) {
        totalArea+=t.area;
        cumulative.push(totalArea);
      }

      function mulberry32(seed) {
        return () => {
          seed|=0; seed=seed+0x6D2B79F5|0;
          let t=Math.imul(seed^seed>>>15,1|seed);
          t=t+Math.imul(t^t>>>7,61|t)^t;
          return ((t^t>>>14)>>>0)/4294967296;
        };
      }
      const random=mulberry32(0xC0FFEE);

      function findTriangle(value) {
        let lo=0, hi=cumulative.length-1;
        while (lo<hi) {
          const mid=(lo+hi)>>1;
          if (cumulative[mid]<value) lo=mid+1; else hi=mid;
        }
        return triangles[lo];
      }

      const particleCount=innerWidth<560?4400:6800;
      const particleData=[];
      for (let i=0;i<particleCount;i++) {
        const t=findTriangle(random()*totalArea);
        const root=Math.sqrt(random());
        const s=random();
        const w0=1-root, w1=root*(1-s), w2=root*s;
        const p=[0,1,2].map(k=>t.a.p[k]*w0+t.b.p[k]*w1+t.c.p[k]*w2);
        const n=normalize([0,1,2].map(k=>t.a.n[k]*w0+t.b.n[k]*w1+t.c.n[k]*w2));
        particleData.push(...p,...n,...t.color,random(),random(),random(),random(),.35+.65*random());
      }

      const orbitData=[];
      const orbiters=14;
      const trailSteps=8;
      for (let i=0;i<orbiters;i++) {
        const phase=random()*Math.PI*2;
        const radius=1.02+random()*.76;
        const height=.33+random()*.42;
        const speed=(.24+random()*.19)*(random()>.5?1:-1);
        const size=.72+random()*.46;
        const hue=random();
        const color=random()>.24?[.9,.04,.035]:[1,.23,.08];
        for (let j=0;j<trailSteps;j++) {
          const trail=j/(trailSteps-1);
          orbitData.push(phase,radius,height,speed,trail,size,hue,...color);
        }
      }

      function makeVao(data,layout) {
        const vao=gl.createVertexArray();
        const buffer=gl.createBuffer();
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
        gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
        const stride=layout.reduce((sum,x)=>sum+x,0)*4;
        let offset=0;
        layout.forEach((size,index)=>{
          gl.enableVertexAttribArray(index);
          gl.vertexAttribPointer(index,size,gl.FLOAT,false,stride,offset*4);
          offset+=size;
        });
        gl.bindVertexArray(null);
        return vao;
      }

      const meshVao=makeVao(meshData,[3,3,3]);
      const particleVao=makeVao(particleData,[3,3,3,4,1]);
      const orbitVao=makeVao(orbitData,[4,3,3]);
      const meshCount=meshData.length/9;
      const orbitCount=orbitData.length/10;

      const locations=new WeakMap();
      function uniform(program,name) {
        let programLocations=locations.get(program);
        if (!programLocations) {
          programLocations=new Map();
          locations.set(program,programLocations);
        }
        if (!programLocations.has(name)) programLocations.set(name,gl.getUniformLocation(program,name));
        return programLocations.get(name);
      }

      function commonUniforms(program) {
        gl.uniform2f(uniform(program,'uViewport'),canvas.width,canvas.height);
        gl.uniform2f(uniform(program,'uCenter'),centerX,centerY);
        gl.uniform1f(uniform(program,'uScale'),modelScale);
        gl.uniform1f(uniform(program,'uYaw'),yaw);
        gl.uniform1f(uniform(program,'uPitch'),.225);
      }

      function draw(now=performance.now()) {
        gl.viewport(0,0,canvas.width,canvas.height);
        gl.clearColor(0,0,0,0);
        gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.disable(gl.BLEND);
        gl.depthMask(true);

        gl.useProgram(meshProgram);
        commonUniforms(meshProgram);
        gl.uniform1f(uniform(meshProgram,'uEffect'),effect);
        gl.bindVertexArray(meshVao);
        gl.drawArrays(gl.TRIANGLES,0,meshCount);

        if (effect>0 && effect<1) {
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
          gl.depthMask(false);
          gl.useProgram(particleProgram);
          commonUniforms(particleProgram);
          gl.uniform1f(uniform(particleProgram,'uEffect'),effect);
          gl.uniform1f(uniform(particleProgram,'uDpr'),pixelRatio);
          gl.bindVertexArray(particleVao);
          gl.drawArrays(gl.POINTS,0,particleCount);
        }

        const orbitAlpha=active?smooth(.84,.995,effect):(orbitEnabled?1:0);
        if (orbitAlpha>.001 && !reducedMotion) {
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
          gl.depthMask(false);
          gl.useProgram(orbitProgram);
          commonUniforms(orbitProgram);
          gl.uniform1f(uniform(orbitProgram,'uTime'),now*.001);
          gl.uniform1f(uniform(orbitProgram,'uDpr'),pixelRatio);
          gl.uniform1f(uniform(orbitProgram,'uOrbitAlpha'),orbitAlpha);
          gl.bindVertexArray(orbitVao);
          gl.drawArrays(gl.POINTS,0,orbitCount);
        }

        gl.bindVertexArray(null);
        gl.depthMask(true);
      }

      function resize() {
        const rect=canvas.getBoundingClientRect();
        cssWidth=Math.max(1,rect.width);
        cssHeight=Math.max(1,rect.height);
        pixelRatio=Math.min(devicePixelRatio||1,1.8);
        const w=Math.round(cssWidth*pixelRatio);
        const h=Math.round(cssHeight*pixelRatio);
        if (canvas.width!==w||canvas.height!==h) {
          canvas.width=w;
          canvas.height=h;
        }
        modelScale=Math.min(cssWidth*.26,cssHeight*.255,194)*pixelRatio;
        centerX=cssWidth*.5*pixelRatio;
        centerY=cssHeight*(cssHeight<520?.405:.43)*pixelRatio;
        draw();
      }

      function setCaption(text) { caption.textContent=text; }

      function trigger() {
        if (active||reducedMotion) return;
        active=true;
        effect=0.001;
        effectStart=performance.now();
        scene.classList.add('is-active');
        setCaption('Embers remembering their shape');
        if (!raf) {
          lastTime=performance.now();
          raf=requestAnimationFrame(frame);
        }
      }

      function frame(now) {
        raf=0;
        if (reducedMotion||document.hidden) return;
        const dt=Math.min(.04,Math.max(0,(now-lastTime)/1000||0));
        lastTime=now;

        let speed=.325;
        if (active) {
          effect=clamp((now-effectStart)/(EFFECT_SECONDS*1000));
          const slow=smooth(0,.12,effect)*(1-smooth(.76,.98,effect));
          speed=.325*(1-slow)+.038*slow;
          if (effect>=1) {
            active=false;
            effect=0;
            orbitEnabled=true;
            scene.classList.remove('is-active');
            setCaption('Hover or tap to scatter it again');
          }
        }
        yaw=(yaw+speed*dt)%(Math.PI*2);
        draw(now);
        raf=requestAnimationFrame(frame);
      }

      function applyMotionPreference() {
        reducedMotion=motionQuery.matches;
        if (reducedMotion) {
          active=false;
          orbitEnabled=false;
          effect=0;
          yaw=-.58;
          scene.classList.remove('is-active');
          scene.disabled=true;
          scene.setAttribute('aria-label','A sculpted red fedora');
          setCaption('A quiet study in depth and light');
          if (raf) cancelAnimationFrame(raf);
          raf=0;
          draw();
        } else {
          scene.disabled=false;
          scene.setAttribute('aria-label','Scatter and reform the red fedora');
          setCaption('Hover or tap to set the form free');
          lastTime=performance.now();
          if (!raf) raf=requestAnimationFrame(frame);
        }
      }

      scene.addEventListener('pointerenter',e=>{
        if (hoverQuery.matches&&e.pointerType!=='touch'&&hoverArmed) {
          hoverArmed=false;
          trigger();
        }
      });
      scene.addEventListener('pointerleave',()=>{ hoverArmed=true; });
      scene.addEventListener('pointerdown',e=>{
        if (e.isPrimary&&(e.pointerType==='touch'||e.pointerType==='pen')) pointerDown={x:e.clientX,y:e.clientY,id:e.pointerId};
      });
      scene.addEventListener('pointerup',e=>{
        if (!pointerDown||pointerDown.id!==e.pointerId) return;
        const moved=Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y);
        pointerDown=null;
        if (moved<12) trigger();
      });
      scene.addEventListener('pointercancel',()=>{ pointerDown=null; });
      scene.addEventListener('click',e=>{
        if (e.detail===0) trigger();
        else if (!hoverQuery.matches&&e.pointerType!=='touch') trigger();
      });

      document.addEventListener('visibilitychange',()=>{
        if (document.hidden) {
          pausedAt=performance.now();
          if (raf) cancelAnimationFrame(raf);
          raf=0;
        } else if (!reducedMotion) {
          const now=performance.now();
          if (active&&pausedAt) effectStart+=now-pausedAt;
          lastTime=now;
          pausedAt=0;
          if (!raf) raf=requestAnimationFrame(frame);
        }
      });

      if (motionQuery.addEventListener) motionQuery.addEventListener('change',applyMotionPreference);
      else if (motionQuery.addListener) motionQuery.addListener(applyMotionPreference);
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(scene);
      window.addEventListener('resize',resize,{passive:true});
      canvas.addEventListener('webglcontextlost',e=>{
        e.preventDefault();
        if (raf) cancelAnimationFrame(raf);
        raf=0;
        active=false;
        effect=0;
        scene.classList.remove('is-active');
        scene.disabled=true;
        setCaption('Restoring the light');
        document.documentElement.classList.remove('webgl-ready');
      });
      canvas.addEventListener('webglcontextrestored',()=>location.reload());

      resize();
      document.documentElement.classList.add('webgl-ready');
      applyMotionPreference();
    })();
  </script>
</body>
</html>
