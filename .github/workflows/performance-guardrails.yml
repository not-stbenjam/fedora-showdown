name: Performance Guardrails

on:
  pull_request:
    paths:
      - '*/index.html'
      - 'index.html'
      - '.github/scripts/performance_guardrails.py'
      - '.github/scripts/test_performance_guardrails.py'
      - '.github/workflows/performance-guardrails.yml'

permissions:
  contents: read

jobs:
  audit-model-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run guardrail tests
        run: python3 .github/scripts/test_performance_guardrails.py

      - name: Require warnings for high-risk pages
        run: python3 .github/scripts/performance_guardrails.py --index index.html */index.html
