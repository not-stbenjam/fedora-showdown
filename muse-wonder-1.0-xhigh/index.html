<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fedora — Hero</title>
<style>
  :root{
    --bg:#07070b;
    --red:#ee0000;
    --red-soft:rgba(238,0,0,.55);
    --text:#f2f0eb;
    --muted:#9a96a3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 600px at 50% 38%, rgba(238,0,0,.14), transparent 62%),
      radial-gradient(1200px 800px at 50% 40%, #15151f 0%, #0a0a10 48%, var(--bg) 100%);
    color:var(--text);
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* subtle vignette + grain via gradients (no assets) */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.55) 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:4px 4px;
  }

  .hero{
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:clamp(20px,4vw,48px);
    position:relative; isolation:isolate;
  }

  /* soft floor glow */
  .floor{
    position:absolute; left:50%; top:58%; width:min(620px,88vw); height:180px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(238,0,0,.18), rgba(238,0,0,.05) 42%, transparent 70%);
    filter:blur(10px); pointer-events:none; z-index:0;
  }

  .stage{
    position:relative;
    width:min(420px,82vw);
    aspect-ratio:1 / .82;
    display:grid; place-items:center;
    z-index:1;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .stage:focus-visible{ border-radius:24px; box-shadow:0 0 0 2px rgba(255,255,255,.35), 0 0 0 6px rgba(238,0,0,.25); }

  /* shadow under hat */
  .shadow{
    position:absolute; left:50%; bottom:16%;
    width:58%; height:26px; transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.65), transparent 68%);
    filter:blur(6px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .stage.is-dissolving .shadow{ opacity:.15; transform:translateX(-50%) scaleX(.7); }

  .perspective{
    width:78%;
    perspective:1100px;
    perspective-origin:50% 42%;
  }
  .hat{
    transform-style:preserve-3d;
    animation:spin 9s linear infinite;
    will-change:transform;
    transition:opacity .45s ease, filter .45s ease;
    filter:drop-shadow(0 18px 28px rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(238,0,0,.14));
  }
  /* slow-down state applied on hover / tap */
  .stage.is-slowing .hat{ animation-duration:22s; }
  .stage.is-dissolving .hat{ opacity:0; filter:blur(2px) drop-shadow(0 0 24px rgba(255,80,60,.22)); }

  @keyframes spin{
    from{ transform:rotateX(-6deg) rotateY(0deg); }
    to  { transform:rotateX(-6deg) rotateY(360deg); }
  }
  /* gentle float, separate element so it doesn't fight the spin */
  .float{ animation:float 5.2s ease-in-out infinite; }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .hat svg{ display:block; width:100%; height:auto; overflow:visible; }

  #fx{
    position:absolute; inset:-18% -22%;
    width:144%; height:136%;
    pointer-events:none;
    z-index:3;
  }

  .caption{
    margin-top:clamp(10px,2.2vh,22px);
    z-index:1;
  }
  .caption h1{
    font-size:clamp(22px,3.4vw,34px);
    font-weight:650; letter-spacing:.14em; text-transform:uppercase; line-height:1;
  }
  .caption h1 span{ color:var(--red); }
  .caption p{
    margin-top:10px;
    font-size:clamp(13px,1.6vw,15px);
    line-height:1.6; color:var(--muted); letter-spacing:.02em;
  }
  .hint{
    margin-top:14px;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#6f6b7a;
    transition:opacity .4s;
  }
  .stage:hover + .caption .hint,
  .stage:focus-visible + .caption .hint{ opacity:.9; color:#a49fb2; }

  @media (max-width:520px){
    .perspective{ width:86%; }
    .floor{ top:56%; }
  }

  @media (prefers-reduced-motion: reduce){
    .hat,.float{ animation:none !important; }
    .hat{ transform:rotateX(-6deg) rotateY(-18deg); }
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<main class="hero">
  <div class="floor" aria-hidden="true"></div>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Fedora logo. Activate to dissolve into particles.">
    <div class="shadow" aria-hidden="true"></div>

    <div class="perspective">
      <div class="float">
        <div class="hat" id="hat" aria-hidden="true">
          <!-- Stylised fedora: brim + pinched crown + red band -->
          <svg viewBox="0 0 320 240" role="img" aria-label="Red fedora">
            <defs>
              <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2b2b33"/>
                <stop offset="45%" stop-color="#17171e"/>
                <stop offset="100%" stop-color="#0c0c11"/>
              </linearGradient>
              <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#23232c"/>
                <stop offset="100%" stop-color="#0b0b10"/>
              </linearGradient>
              <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#8f0000"/>
                <stop offset="38%" stop-color="#ee0000"/>
                <stop offset="62%" stop-color="#ff2a1a"/>
                <stop offset="100%" stop-color="#7a0000"/>
              </linearGradient>
              <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fff" stop-opacity=".20"/>
                <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- brim (back) -->
            <ellipse cx="160" cy="168" rx="148" ry="34" fill="#050508"/>
            <!-- crown -->
            <path d="M78 168 C78 96 104 52 138 44 L182 44 C216 52 242 96 242 168 L226 168 C222 118 206 92 188 84 L172 108 L148 108 L132 84 C114 92 98 118 94 168 Z" fill="url(#crown)"/>
            <!-- crown pinch shading -->
            <path d="M132 84 L148 108 L160 92 L148 62 C140 66 134 74 132 84Z" fill="#000" opacity=".28"/>
            <path d="M188 84 L172 108 L160 92 L172 62 C180 66 186 74 188 84Z" fill="#000" opacity=".28"/>
            <path d="M78 168 C78 96 104 52 138 44 L182 44 C216 52 242 96 242 168 L226 168 C222 118 206 92 188 84 L172 108 L148 108 L132 84 C114 92 98 118 94 168 Z" fill="url(#sheen)"/>
            <!-- band -->
            <path d="M84 138 L236 138 L242 168 L78 168 Z" fill="url(#band)"/>
            <path d="M84 138 L236 138 L238 150 L82 150 Z" fill="#fff" opacity=".10"/>
            <!-- brim (front) -->
            <path d="M12 168 A148 34 0 0 0 308 168 A148 22 0 0 1 12 168Z" fill="url(#brim)"/>
            <ellipse cx="160" cy="168" rx="148" ry="34" fill="none" stroke="#3a3a46" stroke-opacity=".55"/>
            <ellipse cx="160" cy="165" rx="112" ry="20" fill="none" stroke="#fff" stroke-opacity=".05"/>
          </svg>
        </div>
      </div>
    </div>

    <canvas id="fx" width="900" height="700" aria-hidden="true"></canvas>
  </div>

  <div class="caption">
    <h1>Fedora<span>.</span></h1>
    <p>An icon, in light — hover or tap the hat.</p>
    <div class="hint" id="hint">Hover / tap to dissolve</div>
  </div>
</main>

<script>
(() => {
  const stage = document.getElementById('stage');
  const hat   = document.getElementById('hat');
  const hint  = document.getElementById('hint');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  const W = canvas.width, H = canvas.height;
  const CX = W * 0.5, CY = H * 0.46;

  // --- Sample target points inside a fedora silhouette (canvas coords) ---
  // Brim: wide ellipse. Crown: narrower, taller shape above it.
  function sampleTarget(){
    const r = Math.random();
    if (r < 0.52){
      // brim
      const a = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random());
      return { x: CX + Math.cos(a) * rad * 300, y: CY + 62 + Math.sin(a) * rad * 58 };
    }
    // crown (tapered)
    const t = Math.random();               // 0 bottom -> 1 top
    const y = CY + 58 - t * 168;
    const half = 168 * (1 - t * 0.34) * (0.72 + Math.random() * 0.28);
    return { x: CX + (Math.random() * 2 - 1) * half, y: y + (Math.random() * 8 - 4) };
  }

  const COUNT = 2100;        // "thousands"
  const ORBITERS = 26;
  const particles = [];
  const orbiters = [];

  function makeParticle(){
    const t = sampleTarget();
    return {
      tx: t.x, ty: t.y,                 // home (hat) position
      x: t.x, y: t.y,
      vx: 0, vy: 0,
      size: 0.7 + Math.random() * 1.7,
      hue: Math.random(),               // 0 red, .5 amber, 1 pale
      phase: Math.random() * Math.PI * 2,
      drift: 18 + Math.random() * 52,   // how far it wanders
    };
  }
  for (let i = 0; i < COUNT; i++) particles.push(makeParticle());

  function makeOrbiters(){
    orbiters.length = 0;
    for (let i = 0; i < ORBITERS; i++){
      orbiters.push({
        a: Math.random() * Math.PI * 2,
        r: 120 + Math.random() * 150,
        ry: 0.32 + Math.random() * 0.22,      // vertical squash -> elliptical orbit
        speed: (0.12 + Math.random() * 0.28) * (Math.random() < 0.5 ? 1 : -1),
        size: 0.8 + Math.random() * 1.3,
        hue: Math.random(),
        trail: [],
      });
    }
  }

  function color(p, alpha){
    if (p.hue < 0.55) return `rgba(255,${52 + (p.hue*70)|0},38,${alpha})`;       // ember red
    if (p.hue < 0.85) return `rgba(255,${150 + ((p.hue-.55)*180)|0},64,${alpha})`; // amber
    return `rgba(255,232,205,${alpha})`;                                          // pale spark
  }

  // Timeline: 0 idle, 1 explode/drift, 2 swirl, 3 reform, 4 settle(+orbiters)
  let mode = 'idle';   // idle | dissolving | reforming | orbiting
  let start = 0;
  let raf = null;
  let last = 0;

  function explode(){
    for (const p of particles){
      p.x = p.tx; p.y = p.ty;
      const a = Math.random() * Math.PI * 2;
      const sp = 0.4 + Math.random() * 2.4;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp - (0.4 + Math.random() * 1.1); // embers rise
    }
  }

  function drawParticles(now, dt){
    ctx.clearRect(0, 0, W, H);
    const t = (now - start) / 1000;

    // phase weights
    let scatter = 0, swirl = 0;
    if (mode === 'dissolving'){
      scatter = Math.min(1, t / 1.1);                    // drift apart
      swirl   = t < 1.1 ? 0 : Math.min(1, (t - 1.1) / 1.2); // then swirl
      if (t > 2.5){ mode = 'reforming'; start = now; requestReform(); return; }
    }

    for (const p of particles){
      if (mode === 'idle'){ continue; }

      if (mode === 'dissolving'){
        // physics-ish drift + gentle curl
        p.vy -= 0.006;                                   // buoyant embers
        p.vx += Math.sin(now * 0.0011 + p.phase) * 0.008;
        p.vy += Math.cos(now * 0.0009 + p.phase) * 0.006;
        p.x += p.vx * (0.6 + scatter);
        p.y += p.vy * (0.6 + scatter);

        if (swirl > 0){
          const dx = p.x - CX, dy = (p.y - CY) * 1.6;
          const ang = 0.018 * swirl;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          p.x = CX + dx * ca - dy * sa;
          p.y = CY + (dx * sa + dy * ca) / 1.6;
        }
        // soft pull so they don't fly off-canvas
        p.x += (CX - p.x) * 0.0012;
        p.y += (CY - p.y) * 0.0012;

        const flicker = 0.65 + 0.35 * Math.sin(now * 0.012 + p.phase * 7);
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255,70,30,.55)';
        ctx.fillStyle = color(p, 0.9 * flicker);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      else if (mode === 'reforming' || mode === 'orbiting'){
        const k = mode === 'reforming' ? 0.055 : 0.22;   // ease home, then lock
        p.x += (p.tx - p.x) * k;
        p.y += (p.ty - p.y) * k;
        const d = Math.hypot(p.tx - p.x, p.ty - p.y);
        const a = mode === 'orbiting' ? Math.max(0, 1 - (now - start) / 700) : 0.95;
        if (a > 0.01){
          ctx.globalCompositeOperation = 'lighter';
          ctx.shadowBlur = 6;
          ctx.shadowColor = 'rgba(255,70,30,.45)';
          ctx.fillStyle = color(p, a * Math.min(1, 0.25 + d * 0.04));
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    // --- lingering orbiters (after reform) ---
    if (mode === 'orbiting'){
      for (const o of orbiters){
        o.a += o.speed * dt * 0.55;
        const x = CX + Math.cos(o.a) * o.r;
        const y = CY + 30 + Math.sin(o.a) * o.r * o.ry;
        o.trail.push({ x, y });
        if (o.trail.length > 18) o.trail.shift();

        // faint trailing light
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < o.trail.length; i++){
          const pt = o.trail[i], f = i / o.trail.length;
          ctx.fillStyle = color(o, 0.05 + f * 0.16);
          ctx.beginPath(); ctx.arc(pt.x, pt.y, o.size * (0.4 + f * 0.7), 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 9; ctx.shadowColor = 'rgba(255,90,40,.5)';
        ctx.fillStyle = color(o, 0.9);
        ctx.beginPath(); ctx.arc(x, y, o.size, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  function requestReform(){
    // show hat again underneath as particles converge, then crossfade
    setTimeout(() => { hat.style.opacity = ''; stage.classList.remove('is-dissolving'); }, 420);
    setTimeout(() => {
      if (mode === 'reforming'){
        mode = 'orbiting'; start = performance.now(); makeOrbiters();
        stage.classList.remove('is-slowing');
        hint.textContent = 'Hover / tap to dissolve again';
        // let orbiters run ~14s, then stop the loop and clear
        setTimeout(() => {
          if (mode === 'orbiting'){ mode = 'idle'; ctx.clearRect(0,0,W,H); cancelAnimationFrame(raf); raf = null; }
        }, 14000);
      }
    }, 900);
  }

  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    drawParticles(now, dt);
    if (mode !== 'idle') raf = requestAnimationFrame(loop);
  }

  let busy = false;
  function dissolve(){
    if (reduced.matches || busy) return;
    busy = true;
    stage.classList.add('is-slowing');
    hint.textContent = 'Dissolving…';

    // brief slow-down beat before the burst
    setTimeout(() => {
      stage.classList.add('is-dissolving');
      mode = 'dissolving';
      start = performance.now(); last = start;
      explode();
      if (!raf) raf = requestAnimationFrame(loop);
      setTimeout(() => { busy = false; }, 3600);
    }, 650);
  }

  // hover (fine pointers) + tap / click / keyboard for touch & a11y
  stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dissolve(); });
  stage.addEventListener('click', dissolve);
  stage.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dissolve(); }
  });

  // keep canvas crisp on resize (fixed internal res is fine; CSS scales it)
  if (reduced.matches) hint.textContent = 'Reduced motion is on — animation paused';
  reduced.addEventListener?.('change', () => {
    if (reduced.matches){
      mode = 'idle'; busy = false;
      stage.classList.remove('is-dissolving','is-slowing');
      hat.style.opacity = '';
      ctx.clearRect(0,0,W,H);
      if (raf) cancelAnimationFrame(raf), raf = null;
      hint.textContent = 'Reduced motion is on — animation paused';
    } else {
      hint.textContent = 'Hover / tap to dissolve';
    }
  });
})();
</script>
</body>
</html>
