<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Hat — Fedora</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #040406;
    overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: fixed;
    inset: 0;
    cursor: pointer;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .caption {
    position: absolute;
    left: 50%;
    bottom: max(6.5vh, env(safe-area-inset-bottom, 0px) + 5.5vh);
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  .caption h1 {
    font-size: clamp(14px, 2.1vw, 21px);
    letter-spacing: .62em;
    text-indent: .62em;
    font-weight: 600;
    color: #f4f4f7;
    text-shadow: 0 0 26px rgba(238, 0, 0, .5);
  }
  .caption p {
    margin-top: .95em;
    font-size: clamp(9.5px, 1.15vw, 12.5px);
    letter-spacing: .34em;
    text-indent: .34em;
    text-transform: uppercase;
    color: rgba(212, 214, 222, .48);
    font-weight: 400;
  }
  .hint {
    position: absolute;
    left: 50%;
    bottom: max(2.4vh, env(safe-area-inset-bottom, 0px) + 1.6vh);
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: .28em;
    text-indent: .28em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .22);
    pointer-events: none;
    user-select: none;
    transition: opacity 1s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .hint { display: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="caption">
      <h1>RED HAT</h1>
      <p>The open source way</p>
    </div>
    <div class="hint" id="hint">hover or tap</div>
  </div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Helpers
   * ------------------------------------------------------------------ */
  var TAU = Math.PI * 2;
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var smoothstep = function (a, b, x) {
    x = clamp((x - a) / (b - a), 0, 1);
    return x * x * (3 - 2 * x);
  };
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var easeOutCubic = function (t) { return 1 - Math.pow(1 - t, 3); };
  var easeInOutCubic = function (t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };

  function scatterAmount(p) {
    if (p < 0) return 0;
    if (p < 0.20) return easeOutCubic(p / 0.20);
    if (p < 0.58) return 1;
    if (p < 1) return 1 - easeInOutCubic((p - 0.58) / 0.42);
    return 0;
  }

  /* ------------------------------------------------------------------ *
   *  Setup
   * ------------------------------------------------------------------ */
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d', { alpha: false });
  var hint = document.getElementById('hint');

  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceMQ.matches;
  if (reduceMQ.addEventListener) {
    reduceMQ.addEventListener('change', function (e) { reduced = e.matches; });
  } else if (reduceMQ.addListener) {
    reduceMQ.addListener(function (e) { reduced = e.matches; });
  }

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0;
  var SCALE = 1, MIN = 1, SPRITE_SCALE = 8;

  var PIVOT_Y = 0.42;
  var TILT = 0.40;
  var CAM = 6.0;

  var BG = null, AMBIENT = null, SHADOW = null;
  var SHADOW_Y = 0, SHADOW_R = 100;

  /* ------------------------------------------------------------------ *
   *  Glow sprites (pre-rendered)
   * ------------------------------------------------------------------ */
  function makeGlow(r, g, b, cr, cg, cb) {
    var S = 64;
    var cv = document.createElement('canvas');
    cv.width = cv.height = S;
    var c = cv.getContext('2d');
    var grd = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grd.addColorStop(0.00, 'rgba(' + cr + ',' + cg + ',' + cb + ',1)');
    grd.addColorStop(0.13, 'rgba(' + r + ',' + g + ',' + b + ',0.92)');
    grd.addColorStop(0.34, 'rgba(' + r + ',' + g + ',' + b + ',0.32)');
    grd.addColorStop(0.66, 'rgba(' + r + ',' + g + ',' + b + ',0.075)');
    grd.addColorStop(1.00, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    c.fillStyle = grd;
    c.fillRect(0, 0, S, S);
    return cv;
  }

  var SPRITES = [
    makeGlow(238, 22, 10, 255, 152, 122),  // bright red
    makeGlow(176, 14, 18, 255, 96, 72),    // deep red
    makeGlow(255, 96, 40, 255, 238, 220)   // hot ember
  ];

  /* ------------------------------------------------------------------ *
   *  Build the fedora as a particle cloud
   * ------------------------------------------------------------------ */
  var particles = [];
  var orbiters = [];

  function buildHat(density) {
    var P = [];

    function push(x, y, z) {
      var sp;
      var r = Math.random();
      if (r > 0.935) sp = 2;
      else if (r > 0.72) sp = 1;
      else sp = 0;

      var a = Math.random() * TAU;
      var el = Math.random();
      var ex = Math.cos(a) * (0.5 + 0.95 * el);
      var ez = Math.sin(a) * (0.5 + 0.95 * el);
      var ey = rnd(0.10, 1.0);

      P.push({
        x: x, y: y, z: z,
        sp: sp,
        size: rnd(0.7, 1.6),
        ex: ex, ey: ey, ez: ez,
        spread: rnd(0.5, 2.7),
        ph: Math.random() * TAU,
        fq: rnd(0.6, 2.2),
        base: rnd(0.55, 1.0)
      });
    }

    // ---- crown ----
    var crown = Math.round(2200 * density);
    for (var i = 0; i < crown; i++) {
      var v = Math.random();
      var r, y;
      if (v < 0.86) {
        y = 0.10 + 0.80 * v;
        r = 0.60 * (1 - 0.10 * v);
      } else {
        var t = (v - 0.86) / 0.14;
        y = 0.90 + 0.135 * Math.sin(t * Math.PI * 0.5);
        r = 0.54 * Math.cos(t * Math.PI * 0.5);
      }
      var th = Math.random() * TAU;
      var x = Math.cos(th) * r;
      var z = Math.sin(th) * r;

      // classic longitudinal crease near the top
      var topness = smoothstep(0.50, 0.95, v);
      y -= 0.26 * Math.exp(-Math.pow(z / 0.17, 2)) * topness;

      // gentle side pinches
      var side = Math.exp(-Math.pow((Math.abs(x) - 0.52) / 0.20, 2));
      z *= 1 - 0.10 * topness * side;

      push(x + rnd(-0.006, 0.006),
           y + rnd(-0.006, 0.006),
           z + rnd(-0.006, 0.006));
    }

    // ---- brim ----
    var brim = Math.round(2400 * density);
    for (var j = 0; j < brim; j++) {
      var ang = Math.random() * TAU;
      var rad = Math.sqrt(Math.random());
      var rr = 0.60 + rad * 0.80;
      var yy = 0.055 - 0.085 * rad + 0.055 * rad * rad +
               0.045 * smoothstep(0.82, 1, rad);
      yy += rnd(-0.012, 0.012);
      push(Math.cos(ang) * rr, yy, Math.sin(ang) * rr);
    }

    return P;
  }

  function buildOrbiters(n) {
    var arr = [];
    for (var i = 0; i < n; i++) {
      arr.push({
        r: rnd(1.35, 2.35),
        incl: rnd(-0.78, 0.78),
        y0: rnd(-0.12, 0.55),
        phase: Math.random() * TAU,
        speed: rnd(0.35, 0.95) * (Math.random() < 0.5 ? -1 : 1),
        size: rnd(0.7, 1.35),
        sp: Math.random() < 0.28 ? 2 : (Math.random() < 0.5 ? 1 : 0),
        trail: []
      });
    }
    return arr;
  }

  function densityFor(w, h) {
    var area = w * h;
    if (area < 380000) return 0.60;
    if (area < 800000) return 0.82;
    return 1.0;
  }

  /* ------------------------------------------------------------------ *
   *  State
   * ------------------------------------------------------------------ */
  var NORMAL_SPIN = 0.62;
  var SLOW_SPIN = 0.10;
  var SEQ_DUR = 3.2;

  var spin = 0.6;
  var spinSpeed = NORMAL_SPIN;
  var seq = -1;
  var active = false;
  var cooldown = 0;
  var swirl = 0;
  var time = 0;
  var glowPulse = 0;
  var orbiterGlow = 0;
  var orbiterTarget = 0;
  var last = performance.now();

  var _cs = 1, _sn = 0, _ct = Math.cos(TILT), _st = Math.sin(TILT);
  var TMP = { x: 0, y: 0, z: 0, sc: 1 };

  function projectXYZ(x, y, z) {
    var x1 = x * _cs - z * _sn;
    var z1 = x * _sn + z * _cs;
    var y1 = y - PIVOT_Y;
    var y2 = y1 * _ct - z1 * _st;
    var z2 = y1 * _st + z1 * _ct;
    var sc = CAM / (CAM - z2);
    TMP.x = CX + x1 * sc * SCALE;
    TMP.y = CY - y2 * sc * SCALE;
    TMP.z = z2;
    TMP.sc = sc;
    return TMP;
  }

  /* ------------------------------------------------------------------ *
   *  Resize / gradients
   * ------------------------------------------------------------------ */
  function buildGradients() {
    BG = ctx.createRadialGradient(CX, CY * 0.92, 0, CX, CY * 0.92,
                                  Math.max(W, H) * 0.82);
    BG.addColorStop(0.00, '#161a24');
    BG.addColorStop(0.45, '#0b0d13');
    BG.addColorStop(1.00, '#040406');

    AMBIENT = ctx.createRadialGradient(CX, CY, 0, CX, CY, MIN * 0.62);
    AMBIENT.addColorStop(0.00, 'rgba(190,16,16,0.16)');
    AMBIENT.addColorStop(0.40, 'rgba(140,10,10,0.06)');
    AMBIENT.addColorStop(1.00, 'rgba(0,0,0,0)');

    SHADOW_Y = CY + SCALE * 0.70;
    SHADOW_R = SCALE * 1.65;
    SHADOW = ctx.createRadialGradient(0, 0, 0, 0, 0, SHADOW_R);
    SHADOW.addColorStop(0.00, 'rgba(0,0,0,0.85)');
    SHADOW.addColorStop(0.55, 'rgba(0,0,0,0.34)');
    SHADOW.addColorStop(1.00, 'rgba(0,0,0,0)');
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    MIN = Math.min(W, H);
    CX = W / 2;
    CY = H * 0.455;
    SCALE = MIN * 0.30;
    SPRITE_SCALE = Math.max(4.0, MIN * 0.0105);

    buildGradients();
  }

  /* ------------------------------------------------------------------ *
   *  Update
   * ------------------------------------------------------------------ */
  function update(dt) {
    time += dt;
    if (glowPulse > 0) glowPulse = Math.max(0, glowPulse - dt * 0.85);

    if (seq >= 0) {
      seq += dt / SEQ_DUR;
      if (seq >= 1) {
        seq = -1;
        active = false;
        cooldown = 0.8;
        orbiterTarget = 1;
      }
    } else if (cooldown > 0) {
      cooldown -= dt;
    }

    var target = reduced ? 0 : (seq >= 0 ? SLOW_SPIN : NORMAL_SPIN);
    spinSpeed += (target - spinSpeed) * Math.min(1, dt * 3.2);
    spin += spinSpeed * dt;

    if (seq >= 0) swirl += dt * (1.6 + 1.4 * scatterAmount(seq));

    orbiterGlow += (orbiterTarget - orbiterGlow) * Math.min(1, dt * 1.1);
  }

  /* ------------------------------------------------------------------ *
   *  Render
   * ------------------------------------------------------------------ */
  function render() {
    _cs = Math.cos(spin);
    _sn = Math.sin(spin);
    _ct = Math.cos(TILT);
    _st = Math.sin(TILT);

    // background
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // ambient red wash
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = AMBIENT;
    ctx.fillRect(0, 0, W, H);

    // soft contact shadow
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.translate(CX, SHADOW_Y);
    ctx.scale(1, 0.30);
    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.arc(0, 0, SHADOW_R, 0, TAU);
    ctx.fill();
    ctx.restore();

    // ---- particles ----
    var s = scatterAmount(seq);
    var swirlCos = Math.cos(swirl);
    var swirlSin = Math.sin(swirl);
    var blown = 1 + 0.55 * s;
    var pulse = 1 + glowPulse * 1.4;
    var i, p, pt;

    ctx.globalCompositeOperation = 'lighter';

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      var x = p.x, y = p.y, z = p.z;

      if (s > 0.0005) {
        var spread = p.spread * s;
        var ox = p.ex * spread + p.x * s * 0.85;
        var oy = p.ey * spread * 0.85 + s * s * 0.35;
        var oz = p.ez * spread + p.z * s * 0.85;

        var w = Math.sin(time * p.fq * 2.0 + p.ph) * 0.16 * s;
        ox += w;
        oy += Math.cos(time * p.fq * 1.7 + p.ph) * 0.14 * s;
        oz += w * 0.7;

        x += ox * swirlCos - oz * swirlSin;
        y += oy;
        z += ox * swirlSin + oz * swirlCos;
      }

      pt = projectXYZ(x, y, z);
      var sx = pt.x, sy = pt.y, sc = pt.sc;
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;

      var depth = (pt.z + 1.5) / 3.0;
      var emberPulse = 0.85 + 0.35 * Math.sin(time * 3.0 + p.ph);
      var alpha = (0.16 + 0.34 * depth) * p.base * (1 + 0.4 * s) *
                  emberPulse * pulse;
      if (alpha <= 0.012) continue;

      var ds = p.size * SPRITE_SCALE * sc * blown * (1 + 0.55 * s);
      ctx.globalAlpha = alpha > 1 ? 1 : alpha;
      ctx.drawImage(SPRITES[p.sp], sx - ds * 0.5, sy - ds * 0.5, ds, ds);
    }

    // ---- faint reflection under the hat (only when assembled) ----
    var refAlpha = (1 - s / 0.20) * 0.11;
    if (refAlpha > 0.012) {
      for (i = 0; i < particles.length; i += 5) {
        p = particles[i];
        pt = projectXYZ(p.x, p.y, p.z);
        var ry = 2 * SHADOW_Y - pt.y;
        if (ry > H + 30) continue;
        var fall = 1 - (ry - SHADOW_Y) / (SCALE * 1.5);
        if (fall <= 0) continue;
        var rds = p.size * SPRITE_SCALE * pt.sc * 0.9;
        ctx.globalAlpha = refAlpha * fall * p.base;
        ctx.drawImage(SPRITES[p.sp], pt.x - rds * 0.5, ry - rds * 0.5,
                      rds, rds);
      }
    }

    // ---- orbiting embers ----
    if (orbiterGlow > 0.002 && !reduced) {
      for (i = 0; i < orbiters.length; i++) {
        var o = orbiters[i];
        var a = time * o.speed + o.phase;
        var x0 = Math.cos(a) * o.r;
        var z0 = Math.sin(a) * o.r;
        var oy2 = z0 * Math.sin(o.incl) + o.y0;
        var oz2 = z0 * Math.cos(o.incl);

        pt = projectXYZ(x0, oy2, oz2);
        var osx = pt.x, osy = pt.y, osc = pt.sc;

        o.trail.push(osx, osy);
        if (o.trail.length > 22) o.trail.splice(0, 2);

        var len = o.trail.length;
        for (var k = 0; k < len; k += 2) {
          var f = k / len;
          var ta = f * f * orbiterGlow * 0.42;
          if (ta <= 0.008) continue;
          var ts = (1.6 + f * 4.2) * osc;
          ctx.globalAlpha = ta;
          ctx.drawImage(SPRITES[o.sp],
                        o.trail[k] - ts * 0.5,
                        o.trail[k + 1] - ts * 0.5, ts, ts);
        }

        var ods = o.size * SPRITE_SCALE * osc * 1.15;
        ctx.globalAlpha = Math.min(1, orbiterGlow);
        ctx.drawImage(SPRITES[o.sp], osx - ods * 0.5, osy - ods * 0.5,
                      ods, ods);
      }
    }
  }

  /* ------------------------------------------------------------------ *
   *  Loop
   * ------------------------------------------------------------------ */
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   *  Interaction
   * ------------------------------------------------------------------ */
  function activate() {
    if (reduced) {
      glowPulse = 1;
      return;
    }
    if (active || cooldown > 0) return;
    active = true;
    seq = 0;
    hint.style.opacity = '0';
  }

  stage.addEventListener('pointerenter', activate);
  stage.addEventListener('pointerdown', activate, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') activate();
  });
  window.addEventListener('resize', resize);

  /* ------------------------------------------------------------------ *
   *  Init
   * ------------------------------------------------------------------ */
  resize();
  particles = buildHat(densityFor(W, H));
  orbiters = buildOrbiters(18);
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
