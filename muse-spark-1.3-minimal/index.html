<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora — Ember</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0b10;color:#e8e4de;font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
background:radial-gradient(1200px 700px at 50% 30%,#1a1620 0%,#0d0c12 45%,#060709 100%)}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:min(78vmin,560px);height:min(58vmin,420px);cursor:pointer;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
h1{font-weight:400;font-size:clamp(15px,2.4vmin,20px);letter-spacing:.45em;text-transform:uppercase;color:#cfc8bd;text-indent:.45em}
p{font-size:clamp(11px,1.8vmin,13px);letter-spacing:.18em;text-transform:uppercase;color:#6d6a75;text-indent:.18em}
p span{color:#b03434}
@media(prefers-reduced-motion:reduce){canvas{cursor:default}}
</style>
</head>
<body>
<div class="stage">
<canvas id="c" aria-label="Spinning fedora that dissolves into embers on hover"></canvas>
<h1>Fedora</h1>
<p>Hover or tap to <span>scatter</span> &amp; reform</p>
</div>
<script>
(()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;function rs(){DPR=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',rs);rs();
const N=RM?0:2600;
// sample fedora points in unit space (-1..1)
function insideHat(x,y){ // brim
 const b=((x)/0.95)**2+((y-0.32)/0.20)**2<=1;
 // crown dome
 const cx=Math.abs(x)<0.52*(1-(y+0.75)*0.18)&&y<0.32&&y>-0.78;
 // hat band
 return b||cx;}
function sampleHat(){for(let i=0;i<50;i++){const x=Math.random()*2-1,y=Math.random()*2-1;if(insideHat(x,y)){const band=Math.abs(y-0.18)<0.09&&Math.abs(x)<0.55;return{x,y,band,pinch:Math.abs(x)<0.14&&y<-0.1}}}return{x:0,y:0.3,band:false}}
const P=[];for(let i=0;i<N;i++){const s=sampleHat();P.push({...s,ox:s.x,oy:s.y,px:0,py:0,vx:0,vy:0,a:Math.random()*Math.PI*2,r:70+Math.random()*90,sp:.5+Math.random(),sz:.6+Math.random()*1.7,hue:8+Math.random()*28,orbit:i>=N-14})}
// project: 3D spin around Y + gentle tilt
let spin=0,state='hat',t0=0,cool=0;
function proj(x,y,ang){const c=Math.cos(ang),s=Math.sin(ang);const X=x*c;const depth=(x*s+1)/2;const S=Math.min(W,H)/2.15*(0.82+0.18*Math.cos(ang*0.5));return{X:W/2+X*S,Y:H/2+y*S*0.9-10,depth,S}}
function burst(){if(state!=='hat'||cool>0||RM)return;state='go';t0=performance.now()}
cv.addEventListener('pointerenter',burst);cv.addEventListener('pointerdown',burst);cv.addEventListener('click',burst);
setInterval(()=>{if(document.hidden)return;if(state==='hat'&&!RM&&Math.random()<0.002)burst()},500);
function frame(now){requestAnimationFrame(frame);const dt=0.016;
if(!RM&&state==='hat')spin+=dt*0.9;
const el=(now-t0)/1000;let k=0,swirl=0;
if(state==='go'){if(el<1.4){k=el/1.4;swirl=el/1.4}else if(el<3.0){k=1;swirl=1-(el-1.4)/1.6}else if(el<4.4){k=1-(el-3.0)/1.4;swirl=0}else{state='hat';cool=3;k=0}}
cool=Math.max(0,cool-dt);
if(state==='hat'&&!RM)spin+=0; // spin already advanced
const ang=spin+(state==='go'?el*0.6:0);
ctx.clearRect(0,0,W,H);
// soft floor glow
let g=ctx.createRadialGradient(W/2,H*0.78,10,W/2,H*0.78,W*0.4);g.addColorStop(0,'rgba(200,40,40,0.14)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='lighter';
for(const p of P){
const pr=proj(p.ox,p.oy,ang);
// ember target during scatter
const sa=p.a+el*(1.2+p.sp)+swirl*2;
const R=p.r*(0.4+k*1.0)*(1+0.25*Math.sin(el*2+p.sp*6));
let tx=W/2+Math.cos(sa)*R*1.4,ty=H/2+Math.sin(sa)*R*0.9-20+Math.sin(sa*2+el)*14;
let bx=pr.X+(tx-pr.X)*k,by=pr.Y+(ty-pr.Y)*k;
if(state==='hat'){bx=pr.X;by=pr.Y;
 if(p.orbit){const oa=now/1000*p.sp+ p.a*3;bx+=Math.cos(oa)*pr.S*1.15;by+=Math.sin(oa)*pr.S*0.55-14;}}
// smooth
p.px=p.px||bx;p.py=p.py||by;p.px+=(bx-p.px)*0.12;p.py+=(by-p.py)*0.12;
const tw=0.55+0.45*Math.sin(now/300*p.sp+p.a*5);
const alpha=state==='hat'?(p.orbit?0.9:0.55+pr.depth*0.45)* (RM?1:tw*0.5+0.6):(0.4+0.6*tw);
const sz=p.sz*(1+pr.depth*0.8)*(1+k*0.6);
const col=p.band?`rgba(255,120,90,${alpha})`:`rgba(255,${60+((p.hue*3)|0)},${40+((p.hue)|0)},${alpha})`;
ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.px,p.py,sz,0,7);ctx.fill();
if(p.orbit&&state==='hat'&&!RM){ctx.strokeStyle='rgba(255,90,60,0.10)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.px,p.py,sz*3.2,0,7);ctx.stroke();}}
// solid hat core when assembled
if((state==='hat')||k<0.35){const a=state==='hat'?1:1-k/0.35;ctx.globalCompositeOperation='source-over';ctx.save();ctx.globalAlpha=a*0.92;ctx.translate(W/2,H/2-10);const S=Math.min(W,H)/2.15;const sq=Math.abs(Math.cos(ang));ctx.scale(Math.max(0.18,sq),1);
// crown
let gr=ctx.createLinearGradient(0,-S*0.8,0,S*0.35);gr.addColorStop(0,'#e23b3b');gr.addColorStop(0.55,'#a81e22');gr.addColorStop(1,'#5e0f14');
ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-S*0.52,S*0.28);ctx.bezierCurveTo(-S*0.56,-S*0.5,-S*0.2,-S*0.78,S*0.2,-S*0.78);ctx.bezierCurveTo(S*0.56,-S*0.5,S*0.52,S*0.28);ctx.closePath();ctx.fill();
// pinch shadow
ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.moveTo(-S*0.13,S*0.26);ctx.quadraticCurveTo(-S*0.1,-S*0.3,S*0.02,-S*0.72);ctx.quadraticCurveTo(S*0.12,-S*0.3,S*0.13,S*0.26);ctx.closePath();ctx.fill();
// band
ctx.fillStyle='#141114';ctx.fillRect(-S*0.53,S*0.1,S*1.06,S*0.18);
// brim
let bg=ctx.createLinearGradient(0,S*0.2,0,S*0.5);bg.addColorStop(0,'#c22a2e');bg.addColorStop(1,'#6d1216');
ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,S*0.32,S*0.95,S*0.20,0,0,7);ctx.fill();
ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(0,S*0.35,S*0.55,S*0.12,0,0,7);ctx.fill();
ctx.restore();}
ctx.globalCompositeOperation='source-over';
// RM static render handled by same loop first frame; freeze
if(RM&&spin===0){/*drawn once, keep redrawing cheap static*/}
if(RM)return;}
if(RM){// static hat single draw
rs();spin=0.6;requestAnimationFrame(frame);setTimeout(()=>{},0);
}else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
