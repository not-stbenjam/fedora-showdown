<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fedora</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #05050a;
  }
  body {
    font-family: Georgia, "Times New Roman", Cambria, serif;
    /* Deep, warm dark hero scene */
    background:
      radial-gradient(ellipse at 50% 40%, #1b0d08 0%, #0d0706 46%, #04040a 100%);
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    touch-action: manipulation;
  }

  .caption {
    position: fixed;
    left: 0;
    right: 0;
    bottom: clamp(22px, 5vh, 52px);
    text-align: center;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .caption .title {
    display: block;
    color: #ecdecb;
    font-size: clamp(14px, 2.6vmin, 22px);
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    font-weight: 100;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(255, 150, 80, 0.25);
  }
  .caption .sub {
    display: block;
    margin-top: 6px;
    color: rgba(225, 205, 185, 0.5);
    font-size: clamp(10px, 1.5vmin, 13px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
  }

  @media (prefers-reduced-motion: reduce) {
    .caption { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="caption">
  <span class="title">Fedora</span>
  <span class="sub">Red Hat · timeless form</span>
</div>
<script>
(function(){
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, cx = 0, cy = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Fedora geometry (particle cloud) ---------- */
  function makeFedora() {
    var pts = [];
    var brimOuter = 1.0, brimInner = 0.36;

    // brim top surface
    for (var i = 0; i < 850; i++) {
      var a = Math.random() * Math.PI * 2;
      var r2 = brimInner * brimInner + Math.random() * (brimOuter * brimOuter - brimInner * brimInner);
      var r = Math.sqrt(r2);
      pts.push([Math.cos(a) * r, (Math.random() - 0.5) * 0.014, Math.sin(a) * r]);
    }
    // brim outer rim edge (definition)
    for (var i = 0; i < 320; i++) {
      var a = Math.random() * Math.PI * 2;
      var r = brimOuter + (Math.random() - 0.5) * 0.015;
      pts.push([Math.cos(a) * r, (Math.random() - 0.5) * 0.02, Math.sin(a) * r]);
    }
    // tapered crown wall
    var Hc = 0.72, R0 = 0.33, R1 = 0.26;
    for (var i = 0; i < 1500; i++) {
      var a = Math.random() * Math.PI * 2;
      var t = Math.random();
      var y = t * Hc;
      var r = R0 - (R0 - R1) * t + (Math.random() - 0.5) * 0.022;
      pts.push([Math.cos(a) * r, y, Math.sin(a) * r]);
    }
    // crown top
    for (var i = 0; i < 640; i++) {
      var a = Math.random() * Math.PI * 2;
      var r = Math.sqrt(Math.random()) * R1 * 0.95;
      var y = Hc + (Math.random() - 0.5) * 0.014;
      pts.push([Math.cos(a) * r, y, Math.sin(a) * r]);
    }
    // ribbon band (denser ring at base of crown)
    for (var i = 0; i < 360; i++) {
      var a = Math.random() * Math.PI * 2;
      var y = 0.02 + Math.random() * 0.11;
      var r = R0 + 0.05 + (Math.random() - 0.5) * 0.02;
      pts.push([Math.cos(a) * r, y, Math.sin(a) * r]);
    }
    return pts;
  }

  var P = makeFedora().map(function (b) {
    return {
      base: [b[0], b[1], b[2]],
      pos: [b[0], b[1], b[2]],
      vel: [0, 0, 0],
      ember: Math.random(),
      sp: Math.random() < 0.5 ? 0 : 1,
      orbit: false
    };
  });

  /* ---------- Glow sprites ---------- */
  function makeSprite(warm) {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    if (warm) {
      gr.addColorStop(0, 'rgba(255,246,222,1)');
      gr.addColorStop(0.2, 'rgba(255,205,145,0.85)');
      gr.addColorStop(0.5, 'rgba(255,120,50,0.32)');
      gr.addColorStop(1, 'rgba(255,80,30,0)');
    } else {
      gr.addColorStop(0, 'rgba(255,240,225,1)');
      gr.addColorStop(0.2, 'rgba(255,170,120,0.85)');
      gr.addColorStop(0.5, 'rgba(225,70,45,0.34)');
      gr.addColorStop(1, 'rgba(180,40,30,0)');
    }
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  var sprite1 = makeSprite(true);
  var sprite2 = makeSprite(false);

  /* ---------- View ---------- */
  var TILT = -0.42;   // look slightly from above
  var CAMZ = 3.0;
  function proj(p) {
    var x = p[0], y = p[1], z = p[2];
    var c = Math.cos(TILT), s = Math.sin(TILT);
    var y2 = y * c - z * s;
    var z2 = y * s + z * c;
    var d = CAMZ - z2;
    var inv = SCALE / Math.max(d, 0.5);
    return [cx + x * inv, cy - y2 * inv, inv];
  }

  function rotateY(p, th) {
    var c = Math.cos(th), s = Math.sin(th);
    return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c];
  }

  /* ---------- State ---------- */
  var state = 'spin';   // spin | stall | dissolve | swirl | reform | orbit
  var stateT = 0;
  var rotAngle = 0.55;
  var spinSpeed = 0.5;
  var time = 0;
  var hovering = false;

  function enterState(s) {
    state = s;
    stateT = 0;
    if (s === 'dissolve') {
      var th = rotAngle;
      for (var i = 0; i < P.length; i++) {
        var prt = P[i];
        var b = rotateY(prt.base, th);
        prt.pos = b;
        var len = Math.hypot(b[0], b[1], b[2]) || 0.0001;
        var ox = b[0] / len, oy = b[1] / len, oz = b[2] / len;
        var sp = 1.6 + Math.random() * 1.4;
        prt.vel = [
          ox * sp + (Math.random() - 0.5) * 0.7,
          oy * sp + 0.3 + Math.random() * 0.35,
          oz * sp + (Math.random() - 0.5) * 0.7
        ];
        prt.orbit = false;
      }
    } else if (s === 'swirl') {
      for (var i = 0; i < P.length; i++) {
        var prt = P[i];
        var r = Math.hypot(prt.pos[0], prt.pos[2]) || 0.0001;
        var tx = -prt.pos[2] / r, tz = prt.pos[0] / r;
        var sp = 1.0 + Math.random() * 1.2;
        prt.vel = [tx * sp, 0.2 + Math.random() * 0.55, tz * sp];
      }
    } else if (s === 'orbit') {
      for (var i = 0; i < P.length; i++) {
        P[i].orbit = Math.random() < 0.18;
      }
    }
  }

  function resumeSpin() {
    for (var i = 0; i < P.length; i++) {
      var prt = P[i];
      prt.pos = [prt.base[0], prt.base[1], prt.base[2]];
      prt.vel = [0, 0, 0];
      prt.orbit = false;
    }
    spinSpeed = 0.5;
    state = 'spin';
    stateT = 0;
  }

  function ensureHover() {
    if (reduced || hovering) return;
    hovering = true;
    if (state === 'spin') { state = 'stall'; stateT = 0; }
  }
  function releaseHover() {
    if (!hovering) return;
    hovering = false;
    if (state !== 'spin') resumeSpin();
  }
  canvas.addEventListener('pointerenter', ensureHover);
  canvas.addEventListener('pointerleave', releaseHover);
  canvas.addEventListener('pointerdown', ensureHover);
  canvas.addEventListener('pointerup', function(){ setTimeout(releaseHover, 350); });
  canvas.addEventListener('touchstart', ensureHover, { passive: true });
  canvas.addEventListener('touchend', function(){ setTimeout(releaseHover, 350); }, { passive: true });

  /* ---------- Update ---------- */
  function updateParticles(dt) {
    if (state === 'spin' || state === 'stall') {
      for (var i = 0; i < P.length; i++) {
        P[i].pos = rotateY(P[i].base, rotAngle);
      }
      return;
    }
    for (var i = 0; i < P.length; i++) {
      var prt = P[i];
      var p = prt.pos;
      if (state === 'dissolve') {
        prt.vel[1] += 0.15 * dt;
        prt.vel[0] *= (1 - 1.6 * dt);
        prt.vel[1] *= (1 - 1.2 * dt);
        prt.vel[2] *= (1 - 1.6 * dt);
        p[0] += prt.vel[0] * dt;
        p[1] += prt.vel[1] * dt;
        p[2] += prt.vel[2] * dt;
      } else if (state === 'swirl') {
        var r = Math.hypot(p[0], p[2]) || 0.0001;
        var tx = -p[2] / r, tz = p[0] / r;
        var sp = 0.85 + 0.5 * Math.sin(time * 2 + prt.ember * 6.28);
        prt.vel[0] += tx * sp * dt * 1.5;
        prt.vel[2] += tz * sp * dt * 1.5;
        prt.vel[1] += (0.1 + 0.15 * Math.sin(time * 1.3 + prt.ember * 9)) * dt;
        prt.vel[0] *= (1 - 0.9 * dt);
        prt.vel[1] *= (1 - 0.9 * dt);
        prt.vel[2] *= (1 - 0.9 * dt);
        p[0] += prt.vel[0] * dt;
        p[1] += prt.vel[1] * dt;
        p[2] += prt.vel[2] * dt;
      } else if (state === 'reform') {
        var b = rotateY(prt.base, rotAngle);
        prt.vel[0] += (b[0] - p[0]) * 8 * dt;
        prt.vel[1] += (b[1] - p[1]) * 8 * dt;
        prt.vel[2] += (b[2] - p[2]) * 8 * dt;
        prt.vel[0] *= (1 - 4 * dt);
        prt.vel[1] *= (1 - 4 * dt);
        prt.vel[2] *= (1 - 4 * dt);
        p[0] += prt.vel[0] * dt;
        p[1] += prt.vel[1] * dt;
        p[2] += prt.vel[2] * dt;
      } else if (state === 'orbit') {
        if (prt.orbit) {
          var r2 = Math.hypot(p[0], p[2]) || 0.0001;
          var tx2 = -p[2] / r2, tz2 = p[0] / r2;
          var sp2 = 0.7 + prt.ember * 0.6;
          prt.vel[0] += tx2 * sp2 * dt * 1.2;
          prt.vel[2] += tz2 * sp2 * dt * 1.2;
          prt.vel[0] += (p[0] / r2) * 0.05 * dt;   // gentle outward drift -> halo
          prt.vel[2] += (p[2] / r2) * 0.05 * dt;
          prt.vel[0] *= (1 - 0.55 * dt);
          prt.vel[1] *= (1 - 0.55 * dt);
          prt.vel[2] *= (1 - 0.55 * dt);
          p[0] += prt.vel[0] * dt;
          p[1] += prt.vel[1] * dt + 0.05 * dt;
          p[2] += prt.vel[2] * dt;
        } else {
          var b2 = rotateY(prt.base, rotAngle);
          p[0] += (b2[0] - p[0]) * 6 * dt;
          p[1] += (b2[1] - p[1]) * 6 * dt;
          p[2] += (b2[2] - p[2]) * 6 * dt;
        }
      }
    }
  }

  /* ---------- Draw ---------- */
  var SCALE = Math.min(W, H) / 3.2;

  function drawParticle(prt, scr) {
    var px = scr[0], py = scr[1], inv = scr[2];
    var size = 0.075 * inv * (0.45 + 0.55 * prt.ember);
    var sp = prt.sp ? sprite2 : sprite1;
    ctx.drawImage(sp, px - size, py - size, size * 2, size * 2);
    var cs = Math.max(0.4, size * 0.4);
    ctx.fillStyle = 'rgba(255,238,214,0.9)';
    ctx.beginPath();
    ctx.arc(px, py, cs, 0, Math.PI * 2);
    ctx.fill();
    if (state === 'orbit' && prt.orbit) {
      var vx = prt.vel[0] * inv, vy = -prt.vel[1] * inv;
      ctx.strokeStyle = 'rgba(255,160,90,0.35)';
      ctx.lineWidth = cs * 1.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - vx * 0.05, py - vy * 0.05);
      ctx.stroke();
    }
  }

  function draw() {
    SCALE = Math.min(W, H) / 3.2;
    ctx.clearRect(0, 0, W, H);

    // soft ambient glow behind the hat
    var g = ctx.createRadialGradient(cx, cy - 10, 0, cx, cy - 10, Math.max(W, H) * 0.42);
    g.addColorStop(0, 'rgba(214,95,40,0.10)');
    g.addColorStop(0.5, 'rgba(120,40,25,0.05)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft ground shadow
    var shY = cy + SCALE * 0.46;
    ctx.save();
    ctx.translate(cx, shY);
    ctx.scale(1, 0.26);
    var sh = ctx.createRadialGradient(0, 0, 0, 0, 0, SCALE * 1.05);
    sh.addColorStop(0, 'rgba(0,0,0,0.55)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.arc(0, 0, SCALE * 1.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // particles (additive glow)
    ctx.globalCompositeOperation = 'lighter';
    if (state === 'spin' || state === 'stall') {
      for (var i = 0; i < P.length; i++) {
        drawParticle(P[i], proj(rotateY(P[i].base, rotAngle)));
      }
    } else {
      for (var i = 0; i < P.length; i++) {
        drawParticle(P[i], proj(P[i].pos));
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- Main loop ---------- */
  var last = performance.now();

  function frame(ts) {
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    time += dt;

    if (state === 'spin') {
      rotAngle += spinSpeed * dt;
    } else if (state === 'stall') {
      spinSpeed += (0 - spinSpeed) * Math.min(1, dt * 5);
      rotAngle += spinSpeed * dt;
      stateT += dt;
      if (stateT > 0.9) enterState('dissolve');
    }

    if (state === 'dissolve') {
      stateT += dt;
      if (stateT > 1.15) enterState('swirl');
    } else if (state === 'swirl') {
      stateT += dt;
      if (stateT > 1.7) enterState('reform');
    } else if (state === 'reform') {
      stateT += dt;
      if (stateT > 1.45) enterState('orbit');
    }

    updateParticles(dt);
    draw();
    requestAnimationFrame(frame);
  }

  if (reduced) {
    // Respect reduced motion: render a single elegant, static frame.
    rotAngle = 0.6;
    for (var i = 0; i < P.length; i++) {
      P[i].pos = [P[i].base[0], P[i].base[1], P[i].base[2]];
    }
    state = 'spin';
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
