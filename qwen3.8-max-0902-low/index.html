<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fedora — embers</title>
<style>
  :root{
    --bg0:#0b0d12;
    --bg1:#141821;
    --ink:#e8e6e3;
    --muted:#8a8f9c;
    --red:#c8202f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% 38%, #1a1f2b 0%, var(--bg1) 42%, var(--bg0) 100%);
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .hero{
    position:relative;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(.6rem,2vh,1.4rem);
    touch-action:manipulation;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  /* soft vignette + faint top light for depth */
  .hero::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(60% 42% at 50% 22%, rgba(255,240,225,.05), transparent 70%),
      radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  #stage{
    position:relative;
    width:min(92vw, 860px);
    height:min(72vh, 620px);
    display:block;
  }
  .caption{
    position:relative;
    text-align:center;
    user-select:none;
    pointer-events:none;
    animation:rise 1.4s .3s cubic-bezier(.2,.7,.2,1) both;
  }
  .caption h1{
    font-size:clamp(1.05rem,2.4vw,1.5rem);
    font-weight:600;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .caption h1 span{color:var(--red)}
  .caption p{
    margin-top:.45rem;
    font-size:clamp(.72rem,1.6vw,.85rem);
    letter-spacing:.14em;
    color:var(--muted);
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media (prefers-reduced-motion: reduce){
    .caption{animation:none}
  }
</style>
</head>
<body>
<div class="hero" id="hero">
  <canvas id="stage" aria-label="A red fedora hat rendered from glowing particles, spinning in 3D" role="img"></canvas>
  <div class="caption">
    <h1>fed<span>o</span>ra</h1>
    <p>hover or tap &mdash; let it burn apart, watch it return</p>
  </div>
</div>

<script>
(function(){
"use strict";

var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- canvas setup ---------- */
var canvas = document.getElementById("stage");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1, SCALE = 1, CX = 0, CY = 0;

/* ---------- glow sprites (pre-rendered, additive) ---------- */
function makeSprite(rgb){
  var s = 34, c = document.createElement("canvas");
  c.width = c.height = s;
  var g = c.getContext("2d");
  var grd = g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
  grd.addColorStop(0,   "rgba("+rgb+",1)");
  grd.addColorStop(0.25,"rgba("+rgb+",0.55)");
  grd.addColorStop(0.6, "rgba("+rgb+",0.14)");
  grd.addColorStop(1,   "rgba("+rgb+",0)");
  g.fillStyle = grd;
  g.fillRect(0,0,s,s);
  return c;
}
var SPR_RED   = makeSprite("235,70,80");    // hat body
var SPR_DARK  = makeSprite("140,28,40");    // hat band
var SPR_EMBER = makeSprite("255,140,60");   // dissolving
var SPR_HOT   = makeSprite("255,214,140");  // peak heat

/* ---------- sample the fedora silhouette into 3D points ---------- */
var BW = 440, BH = 330;              // sample space
var BRIM_Y = 250;                    // brim ellipse center y
function sampleHat(){
  var off = document.createElement("canvas");
  off.width = BW; off.height = BH;
  var g = off.getContext("2d");
  g.fillStyle = "#fff";

  // brim — wide soft ellipse
  g.beginPath();
  g.ellipse(220, BRIM_Y, 196, 42, 0, 0, Math.PI*2);
  g.fill();

  // crown — tapered, with a pinched top
  g.beginPath();
  g.moveTo(138, BRIM_Y + 4);
  g.bezierCurveTo(134, 190, 146, 140, 152, 112);
  g.quadraticCurveTo(220, 142, 288, 112);   // dent across the top
  g.bezierCurveTo(294, 140, 306, 190, 302, BRIM_Y + 4);
  g.closePath();
  g.fill();

  var img = g.getImageData(0,0,BW,BH).data;
  var pts = [];
  var step = 3;
  for(var y=0; y<BH; y+=step){
    for(var x=0; x<BW; x+=step){
      if(img[(y*BW+x)*4+3] > 110 && Math.random() < 0.82){
        var jx = x + (Math.random()-0.5)*step;
        var jy = y + (Math.random()-0.5)*step;
        pts.push(point3D(jx, jy));
      }
    }
  }
  // shuffle & cap
  for(var i=pts.length-1;i>0;i--){
    var j=(Math.random()*(i+1))|0, t=pts[i]; pts[i]=pts[j]; pts[j]=t;
  }
  return pts.slice(0, 3200);
}

function point3D(x, y){
  var lx = x - 220, ly = y - 170;      // center in local space
  var z, band = false;
  if(y < BRIM_Y - 6){
    // crown: give it an elliptical tube cross-section for real 3D volume
    var hw = 82 - (BRIM_Y - y) * 0.06; // crown narrows toward the top
    var u = Math.max(-1, Math.min(1, lx / hw));
    z = (Math.random() < 0.5 ? -1 : 1) * 30 * Math.sqrt(1 - u*u) * (0.4 + 0.6*Math.random());
    band = (y > BRIM_Y - 26);
  }else{
    // brim: shallow dish — edges tilt slightly, tiny z noise
    var d = Math.abs(lx) / 196;
    z = (Math.random()-0.5)*8 + d*d*10*(Math.random()<0.5?-1:1)*0.4;
  }
  return {
    tx: lx, ty: ly, tz: z,
    x: lx, y: ly, z: z,
    vx:0, vy:0, vz:0,
    sx:0, sy:0, sz:0,               // reform start pos
    band: band,
    heat: 0,
    size: 1.7 + Math.random()*1.3,
    seed: Math.random()*Math.PI*2,
    orbiter: false,
    orbit: null,
    trail: null
  };
}

var particles = sampleHat();

/* ---------- orbiters (chosen after the first reform) ---------- */
var ORBITER_COUNT = 34;
function promoteOrbiters(){
  var n = 0;
  for(var i=0;i<particles.length && n<ORBITER_COUNT;i++){
    var p = particles[(Math.random()*particles.length)|0];
    if(p.orbiter) continue;
    p.orbiter = true;
    p.orbit = {
      r: 130 + Math.random()*90,
      a: Math.random()*Math.PI*2,
      spd: (0.5 + Math.random()*0.7) * (Math.random()<0.5?-1:1),
      yBase: -60 + Math.random()*160,
      yAmp: 14 + Math.random()*34,
      ph: Math.random()*Math.PI*2
    };
    p.trail = [];
    n++;
  }
}

/* ---------- state machine ---------- */
var STATE_FORMED = 0, STATE_DISSOLVE = 1, STATE_SWIRL = 2, STATE_REFORM = 3;
var state = STATE_FORMED;
var stateT = 0;
var cyclesDone = 0;
var angle = -0.45;             // current spin (Y axis)
var spin = 0.55;               // rad/s
var spinTarget = 0.55;

var DUR_DISSOLVE = 1.35, DUR_SWIRL = 0.95, DUR_REFORM = 1.6;

function trigger(){
  if(state === STATE_FORMED){
    state = STATE_DISSOLVE; stateT = 0;
    spinTarget = 0.10;                       // slow the spin
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      // kick outward + upward, like embers catching a draft
      var dx = p.x, dy = p.y - 20, dz = p.z;
      var len = Math.sqrt(dx*dx+dy*dy+dz*dz) || 1;
      var power = 70 + Math.random()*160;
      p.vx = dx/len*power + (Math.random()-0.5)*70;
      p.vy = dy/len*power*0.5 - (30 + Math.random()*90);   // rise
      p.vz = dz/len*power + (Math.random()-0.5)*70;
      p.emberMix = Math.random();
    }
  }
}
function beginReform(){
  state = STATE_REFORM; stateT = 0;
  spinTarget = 0.30;
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    p.sx = p.x; p.sy = p.y; p.sz = p.z;
  }
}

/* ---------- interaction ---------- */
var hero = document.getElementById("hero");
if(!reduceMotion){
  hero.addEventListener("pointerenter", function(e){
    if(e.pointerType === "mouse") trigger();
  });
  hero.addEventListener("pointerleave", function(e){
    if(e.pointerType !== "mouse") return;
    if(state === STATE_DISSOLVE || state === STATE_SWIRL) beginReform();
  });
  hero.addEventListener("pointerdown", function(e){
    if(e.pointerType !== "mouse") trigger();          // tap: full cycle
  });
}

/* ---------- projection helpers ---------- */
var FOV = 760, TILT = -0.14;
function project(x, y, z){
  // spin around Y
  var ca = Math.cos(angle), sa = Math.sin(angle);
  var xr = x*ca - z*sa;
  var zr = x*sa + z*ca;
  // gentle fixed tilt around X
  var ct = Math.cos(TILT), st = Math.sin(TILT);
  var yr = y*ct - zr*st;
  zr = y*st + zr*ct;
  var s = FOV / (FOV + zr) * SCALE;
  return { sx: CX + xr*s, sy: CY + yr*s, s: s, depth: zr };
}

function resize(){
  var rect = canvas.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width; H = rect.height;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SCALE = Math.min(W/560, H/460);
  CX = W/2; CY = H/2 - 10*SCALE;
}
window.addEventListener("resize", function(){ resize(); if(reduceMotion) renderStatic(); });

/* ---------- easing ---------- */
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

/* ---------- simulation step ---------- */
function step(dt){
  // spin eases toward its target speed
  spin += (spinTarget - spin) * Math.min(1, dt*2.2);
  angle += spin * dt;

  stateT += dt;

  if(state === STATE_DISSOLVE){
    if(stateT > DUR_DISSOLVE){ state = STATE_SWIRL; stateT = 0; }
  }else if(state === STATE_SWIRL){
    if(stateT > DUR_SWIRL) beginReform();
  }else if(state === STATE_REFORM){
    if(stateT >= DUR_REFORM){
      state = STATE_FORMED; stateT = 0;
      spinTarget = 0.55;
      cyclesDone++;
      if(cyclesDone === 1) promoteOrbiters();
      for(var q=0;q<particles.length;q++) particles[q].heat = 0;
    }
  }

  var i, p;
  if(state === STATE_DISSOLVE || state === STATE_SWIRL){
    var swirlK = (state === STATE_SWIRL) ? 150 : 90;
    var drag = Math.exp(-1.05*dt);
    var heatTarget = 1;
    for(i=0;i<particles.length;i++){
      p = particles[i];
      // tangential swirl around the vertical axis + buoyancy + turbulence
      var rl = Math.sqrt(p.x*p.x + p.z*p.z) || 1;
      var tx = -p.z/rl, tz = p.x/rl;
      var wob = Math.sin(stateT*3.1 + p.seed*2.0);
      p.vx += (tx*swirlK + wob*22) * dt;
      p.vz += (tz*swirlK + Math.cos(stateT*2.7 + p.seed)*22) * dt;
      p.vy += (-26 - 18*p.emberMix + wob*10) * dt;          // embers drift up
      p.vx *= drag; p.vy *= drag; p.vz *= drag;
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      p.heat += (heatTarget*(0.45+0.55*p.emberMix) - p.heat) * Math.min(1, dt*3.4);
    }
  }else if(state === STATE_REFORM){
    var e = easeInOut(Math.min(1, stateT/DUR_REFORM));
    for(i=0;i<particles.length;i++){
      p = particles[i];
      var gx, gy, gz;
      if(p.orbiter){ orbitPos(p); gx=p._ox; gy=p._oy; gz=p._oz; }
      else { gx=p.tx; gy=p.ty; gz=p.tz; }
      p.x = p.sx + (gx - p.sx)*e;
      p.y = p.sy + (gy - p.sy)*e;
      p.z = p.sz + (gz - p.sz)*e;
      p.heat += (0 - p.heat) * Math.min(1, dt*2.6);
    }
  }else{ // formed
    for(i=0;i<particles.length;i++){
      p = particles[i];
      if(p.orbiter){ orbitPos(p); p.x=p._ox; p.y=p._oy; p.z=p._oz; }
      else { p.x=p.tx; p.y=p.ty; p.z=p.tz; }
      p.heat += (0 - p.heat) * Math.min(1, dt*4);
    }
  }

  // advance orbiter angles
  for(i=0;i<particles.length;i++){
    p = particles[i];
    if(p.orbiter) p.orbit.a += p.orbit.spd * dt;
  }
}
function orbitPos(p){
  var o = p.orbit;
  p._ox = Math.cos(o.a)*o.r;
  p._oz = Math.sin(o.a)*o.r;
  p._oy = o.yBase + Math.sin(o.a*2 + o.ph)*o.yAmp;
}

/* ---------- render ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);

  // soft floor shadow (fades as the hat dissolves)
  var solid = (state === STATE_FORMED || state === STATE_REFORM)
    ? (state === STATE_REFORM ? easeInOut(Math.min(1,stateT/DUR_REFORM)) : 1)
    : Math.max(0, 1 - stateT/0.5);
  if(solid > 0.02){
    ctx.save();
    ctx.globalAlpha = 0.5 * solid;
    var sy = CY + 168*SCALE;
    var grd = ctx.createRadialGradient(CX, sy, 0, CX, sy, 210*SCALE);
    grd.addColorStop(0, "rgba(0,0,0,0.85)");
    grd.addColorStop(0.55,"rgba(0,0,0,0.35)");
    grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.translate(CX, sy);
    ctx.scale(1, 0.16);
    ctx.beginPath();
    ctx.arc(0,0,210*SCALE,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // faint red bounce-light on the "floor"
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.10 * solid;
    var g2 = ctx.createRadialGradient(CX, sy, 0, CX, sy, 170*SCALE);
    g2.addColorStop(0,"rgba(200,40,55,0.8)");
    g2.addColorStop(1,"rgba(200,40,55,0)");
    ctx.fillStyle = g2;
    ctx.translate(CX, sy);
    ctx.scale(1, 0.14);
    ctx.beginPath();
    ctx.arc(0,0,170*SCALE,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  var i, p, pr, spr, a, sz;
  for(i=0;i<particles.length;i++){
    p = particles[i];
    pr = project(p.x, p.y, p.z);
    if(pr.sx < -40 || pr.sx > W+40 || pr.sy < -40 || pr.sy > H+40) continue;

    // depth-based lighting: nearer = bigger & brighter
    var dNorm = Math.max(0.25, Math.min(1.6, FOV/(FOV+pr.depth)));
    sz = p.size * pr.s * 3.1 * (0.75 + 0.35*dNorm);
    a  = Math.min(1, (0.30 + 0.55*dNorm) * (0.75 + 0.35*p.heat));

    if(p.heat > 0.62)      spr = SPR_HOT;
    else if(p.heat > 0.30) spr = SPR_EMBER;
    else                   spr = p.band ? SPR_DARK : SPR_RED;

    ctx.globalAlpha = a;
    ctx.drawImage(spr, pr.sx - sz/2, pr.sy - sz/2, sz, sz);

    // orbiter trails — faint light ribbons
    if(p.orbiter){
      p.trail.push(pr.sx, pr.sy);
      if(p.trail.length > 20) p.trail.splice(0,2);
      if(p.trail.length >= 6){
        ctx.beginPath();
        ctx.moveTo(p.trail[0], p.trail[1]);
        for(var k=2;k<p.trail.length;k+=2) ctx.lineTo(p.trail[k], p.trail[k+1]);
        ctx.strokeStyle = "rgba(255,170,110,"+(0.16*a).toFixed(3)+")";
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

/* ---------- loops ---------- */
resize();

if(reduceMotion){
  // static, dignified presentation — no spin, no particles storm
  function renderStatic(){
    resize();
    ctx.clearRect(0,0,W,H);
    angle = -0.38;
    // floor shadow
    ctx.save();
    ctx.globalAlpha = 0.5;
    var sy = CY + 168*SCALE;
    var grd = ctx.createRadialGradient(CX, sy, 0, CX, sy, 210*SCALE);
    grd.addColorStop(0,"rgba(0,0,0,0.85)");
    grd.addColorStop(0.55,"rgba(0,0,0,0.35)");
    grd.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.translate(CX, sy); ctx.scale(1,0.16);
    ctx.beginPath(); ctx.arc(0,0,210*SCALE,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      var pr = project(p.tx, p.ty, p.tz);
      var dNorm = Math.max(0.25, Math.min(1.6, FOV/(FOV+pr.depth)));
      var sz = p.size * pr.s * 3.1 * (0.75+0.35*dNorm);
      ctx.globalAlpha = Math.min(1, 0.30 + 0.55*dNorm);
      ctx.drawImage(p.band ? SPR_DARK : SPR_RED, pr.sx-sz/2, pr.sy-sz/2, sz, sz);
    }
    ctx.restore();
  }
  renderStatic();
}else{
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - last)/1000);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

})();
</script>
</body>
</html>
