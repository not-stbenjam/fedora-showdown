<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0e">
<title>Ember — a study in red</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a0e;color:#ece8e5}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#21151b 0, #101015 36%,#090a0e 73%)}main::after{content:"";position:absolute;inset:18px;border:1px solid #ffffff09;border-radius:6px;pointer-events:none}.signature{position:absolute;top:42px;left:clamp(32px,6vw,88px);font-size:11px;letter-spacing:.28em;color:#a8a0a5}.signature span{color:#e74445;margin-right:12px}.scene{width:min(100%,1000px);text-align:center;padding:74px 12px 86px}button{display:block;position:relative;width:100%;height:clamp(290px,53svh,570px);padding:0;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:1px solid #e75e6180;outline-offset:4px;border-radius:24px}canvas{display:block;width:100%;height:100%;pointer-events:none}h1{font-size:clamp(26px,4vw,40px);font-weight:450;letter-spacing:-.055em;margin:4px 0 12px}p{font-size:12px;line-height:1.8;color:#918990;margin:0;letter-spacing:.055em}.hint{display:inline-flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-top:26px;color:#a1989f}.dot{width:4px;height:4px;border-radius:50%;background:#f36362;box-shadow:0 0 9px #ed4b4960}footer{position:absolute;bottom:35px;text-align:center;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#58545d;left:20px;right:20px}@media(max-height:550px){.scene{padding:60px 12px}button{height:270px}.signature{top:25px}footer{position:relative;bottom:20px}}@media(prefers-reduced-motion:reduce){.hint{letter-spacing:.08em}}
</style>
</head>
<body>
<main>
<div class="signature"><span>●</span>FORM / 001</div>
<section class="scene" aria-labelledby="title">
<button id="hat" aria-label="Dissolve the rotating red fedora into embers and let it reform">
<canvas id="canvas" aria-hidden="true"></canvas>
</button>
<h1 id="title">Nothing is lost.</h1>
<p>A little fire. A familiar form.</p>
<div class="hint"><span class="dot"></span><span id="hint">Hover or tap to unravel</span></div>
</section>
<footer>A study in form &amp; light</footer>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),button=document.getElementById('hat'),hint=document.getElementById('hint'),motion=matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,scale=1,angle=.48,last=0,elapsed=0,active=false,hover=false,raf=0,reduced=motion.matches;
const faces=[],particles=[],TAU=Math.PI*2;
let seed=381;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
// The crown narrows toward its creased top; the brim curls gently at its sides.
function brim(t,r){const x=Math.cos(t),z=Math.sin(t);return [x*(1.03+1.12*r),-.37+.12*r*r+.09*r*r*Math.cos(2*t),z*(.76+.68*r)]}
function crown(t,v){const x=Math.cos(t),z=Math.sin(t),pinch=1-.13*v*Math.pow(Math.max(0,z),6);return [x*(1.06-.23*v)*pinch,-.36+1.12*v,z*(.78-.15*v)]}
function top(t,r){const edge=crown(t,1);return [edge[0]*r,.76-.26*Math.pow(1-r,1.1)+.055*Math.sin(t)*r*(1-r),edge[2]*r]}
function band(t,v){const p=crown(t,.065+.205*v);p[0]*=1.008;p[2]*=1.008;return p}
function addSurface(fn,rows,cols,color){for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
 const a=fn(i/cols*TAU,j/rows),b=fn((i+1)/cols*TAU,j/rows),c=fn((i+1)/cols*TAU,(j+1)/rows),d=fn(i/cols*TAU,(j+1)/rows);
 faces.push({points:[a,b,c,d],color});
 const u=b.map((v,k)=>v-a[k]),v=d.map((v,k)=>v-a[k]);const area=Math.hypot(u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]);
 const count=Math.max(1,Math.round(area*330));for(let k=0;k<count;k++){const x=random(),y=random();particles.push({p:a.map((n,q)=>mix(mix(n,b[q],x),mix(d[q],c[q],x),y)),color,phase:random()*TAU,speed:.6+random(),spread:[(random()-.5)*5.4,(random()-.25)*3.8,(random()-.5)*4.6],size:.45+random()*.65})}
}}
addSurface(brim,12,100,'red');addSurface(crown,18,100,'red');addSurface(top,12,100,'red');addSurface(band,4,100,'black');
function transform(p){const ca=Math.cos(angle),sa=Math.sin(angle),x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca;const tilt=.3;return [x,p[1]*Math.cos(tilt)-z*Math.sin(tilt),p[1]*Math.sin(tilt)+z*Math.cos(tilt)]}
function project(p){const depth=7/(7+p[2]);return [w/2+p[0]*scale*depth,h*.51-p[1]*scale*depth,depth]}
function shade(points,color){const a=points[0],b=points[1],d=points[3],u=b.map((n,i)=>n-a[i]),v=d.map((n,i)=>n-a[i]);let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;let light=.46+.54*Math.abs((n[0]*-.35+n[1]*.85+n[2]*-.4)/len);return color==='black'?`rgb(${Math.round(18*light+3)},${Math.round(17*light+3)},${Math.round(22*light+3)})`:`rgb(${Math.round(215*light+24)},${Math.round(31*light+5)},${Math.round(42*light+6)})`}
function render(now){raf=0;const dt=Math.min((now-(last||now))/1000,.05);last=now;if(!reduced)angle+=dt*(active||hover?.105:.27);if(active){elapsed+=dt;if(elapsed>=7.8){elapsed=0;active=false}}
const scatter=active?smooth(elapsed/1.9)*(1-smooth((elapsed-4.6)/3.2)):0;
ctx.clearRect(0,0,w,h);
const shadow=ctx.createRadialGradient(w/2,h*.82,0,w/2,h*.82,scale*1.9);shadow.addColorStop(0,`rgba(0,0,0,${.5*(1-scatter*.65)})`);shadow.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.translate(0,h*.82);ctx.scale(1,.17);ctx.translate(0,-h*.82);ctx.fillStyle=shadow;ctx.fillRect(0,-h*4,w,h*10);ctx.restore();
if(scatter<.21){ctx.globalAlpha=1-smooth(scatter/.21);const sorted=faces.map(f=>{const points=f.points.map(transform);return {points,color:f.color,z:points.reduce((s,p)=>s+p[2],0)}}).sort((a,b)=>b.z-a.z);for(const f of sorted){ctx.beginPath();f.points.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=shade(f.points,f.color);ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.65;ctx.fill();ctx.stroke()}ctx.globalAlpha=1}
if(scatter>0){ctx.globalAlpha=smooth(scatter/.12);ctx.globalCompositeOperation='lighter';for(const p of particles){const swirl=elapsed*p.speed*.65,sp=p.spread;const dest=[sp[0]*Math.cos(swirl)-sp[2]*Math.sin(swirl),sp[1]+.18*Math.sin(swirl+p.phase),sp[0]*Math.sin(swirl)+sp[2]*Math.cos(swirl)];const pos=p.p.map((v,i)=>v+scatter*dest[i]);const q=project(transform(pos));const radius=p.size*q[2]*Math.max(.7,scale/150);ctx.fillStyle=p.color==='black'?'rgba(155,76,58,.55)':`rgba(255,${Math.round(81+70*(.5+.5*Math.sin(p.phase+elapsed)))},65,.8)`;ctx.fillRect(q[0],q[1],radius,radius);if(p.phase<.2){ctx.fillStyle='rgba(255,89,49,.035)';ctx.beginPath();ctx.arc(q[0],q[1],radius*5,0,TAU);ctx.fill()}}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
// A small constellation keeps the silhouette alive after it settles.
ctx.globalCompositeOperation='lighter';for(let i=0;i<14;i++){for(let tail=7;tail>=0;tail--){const t=(reduced?1:now/1000)*(.19+i*.006)+i*2.399-tail*.018;const p=transform([Math.cos(t)*(2.25+.1*Math.sin(i)),.18+Math.sin(t*1.7+i)*.65,Math.sin(t)*1.55]);const q=project(p);ctx.fillStyle=`rgba(255,134,91,${(1-tail/8)*.45})`;ctx.beginPath();ctx.arc(q[0],q[1],(tail? .65:1.15)*q[2],0,TAU);ctx.fill()}}ctx.globalCompositeOperation='source-over';if(!reduced&&!document.hidden)raf=requestAnimationFrame(render)}
function draw(){if(!raf)raf=requestAnimationFrame(render)}
function resize(){const rect=button.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);w=rect.width;h=rect.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(w/6.8,h/4.2);draw()}
function trigger(){if(reduced){return}if(!active){active=true;elapsed=0;draw()}}
button.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hover=true;trigger()}});button.addEventListener('pointerleave',()=>{hover=false});button.addEventListener('click',trigger);
function preference(){reduced=motion.matches;active=false;elapsed=0;last=0;hint.textContent=reduced?'Stillness, by preference':'Hover or tap to unravel';button.setAttribute('aria-label',reduced?'Red fedora with a quiet constellation of embers. Reduced motion enabled.':'Dissolve the rotating red fedora into embers and let it reform');if(raf)cancelAnimationFrame(raf);raf=0;draw()}
motion.addEventListener('change',preference);document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){cancelAnimationFrame(raf);raf=0}else draw()});new ResizeObserver(resize).observe(button);preference();resize();
})();
</script>
</body>
</html>
