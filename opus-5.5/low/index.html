<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fedora</title>
<style>
  html,body{margin:0;height:100%;background:#07070a;color:#ddd;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:radial-gradient(ellipse at 50% 40%,#1c1418 0%,#0b0a0d 55%,#050506 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
  .cap{position:fixed;left:0;right:0;bottom:clamp(24px,9vh,90px);text-align:center;pointer-events:none}
  .cap h1{margin:0;font-weight:300;letter-spacing:.35em;font-size:clamp(14px,2.2vw,20px);color:#eee;text-transform:uppercase}
  .cap p{margin:.6em 0 0;font-size:clamp(11px,1.4vw,13px);letter-spacing:.12em;color:#8a8088}
</style>
</head>
<body>
<canvas id="c" aria-label="A spinning red fedora that dissolves into particles on hover"></canvas>
<div class="cap"><h1>The Fedora</h1><p>hover or tap to scatter</p></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let W,H,S,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);S=Math.min(W,H*1.1)*0.27;}
addEventListener('resize',resize);resize();

// ---- build fedora point cloud (x,y,z, normal, colour type) ----
const P=[];const R=Math.random;
function add(x,y,z,nx,ny,nz,t){const l=Math.hypot(nx,ny,nz)||1;
  P.push({hx:x,hy:y,hz:z,nx:nx/l,ny:ny/l,nz:nz/l,t,
    dx:R()*2-1,dy:R()*2-1,dz:R()*2-1,sp:.6+R()*1.2,ph:R()*6.28,s:.6+R()*.9});}
const N=7000;
for(let i=0;i<N;i++){
  const u=R();
  if(u<.42){ // brim: annulus, curled up at sides, down at front/back
    const r=Math.sqrt(.36+R()*(1.56-.36)),a=R()*6.283;
    const e=(r-.6)/.65,c=Math.cos(a),s=Math.sin(a);
    const y=.28*e*e*(c*c)-.08*e*e*(s*s);
    add(r*c,y,r*s*.92,-.5*e*c,1,.2*e*s,0);
  }else{ // crown
    const h=R(),a=R()*6.283;
    const rb=.6-.14*h;
    const pinch=1-.18*Math.pow(h,3)*Math.abs(Math.cos(a));
    const x=Math.cos(a)*rb*pinch,z=Math.sin(a)*rb*.88;
    add(x,h*.85,z,Math.cos(a),.18,Math.sin(a),h<.2?1:0);
    if(u>.9){ // top with centre dent
      const rr=Math.sqrt(R())*.44,b=R()*6.283;
      const dent=.12*Math.max(0,1-Math.abs(Math.sin(b)*rr)/.18)*(1-rr/.44);
      add(Math.cos(b)*rr*.85,.85+.04*(1-rr/.44)-dent,Math.sin(b)*rr*.8,0,1,0,0);
    }
  }
}
// orbiters
const O=[];for(let i=0;i<14;i++)O.push({r:1.3+R()*.6,a:R()*6.28,sp:.35+R()*.5,tilt:(R()-.5)*.9,y:R()*.6-.1,tr:[],on:0});

// ---- state ----
let hover=false,spin=0,speed=.6,last=performance.now(),dT=-1,orbitOn=0;
const DUR=4.6;
function trigger(){ if(RM.matches)return; if(dT<0||dT>DUR-.3)dT=0; }
cv.addEventListener('pointerenter',()=>{hover=true;trigger()});
cv.addEventListener('pointerleave',()=>hover=false);
cv.addEventListener('pointerdown',e=>{hover=e.pointerType!=='mouse'?true:hover;trigger();
  if(e.pointerType!=='mouse')setTimeout(()=>hover=false,DUR*1000)});

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function amount(t){ // 0 = hat, 1 = fully scattered
  if(t<0)return 0; if(t<1.1)return ease(t/1.1); if(t<2.4)return 1; if(t<DUR)return 1-ease((t-2.4)/(DUR-2.4)); return 0;}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const rm=RM.matches;
  const target=rm?0:(hover||dT>=0?.18:.6);
  speed+=(target-speed)*Math.min(1,dt*2.5);spin+=speed*dt;
  if(rm)spin=.6;
  if(dT>=0){dT+=dt;if(dT>DUR){dT=-1;orbitOn=1;}}
  const k=amount(dT),tt=now/1000;
  const cx=W/2,cy=H*.46;
  g.clearRect(0,0,W,H);

  // floor shadow
  const sh=g.createRadialGradient(cx,cy+S*.95,0,cx,cy+S*.95,S*1.4);
  sh.addColorStop(0,`rgba(0,0,0,${.55*(1-k*.7)})`);sh.addColorStop(1,'rgba(0,0,0,0)');
  g.save();g.translate(cx,cy+S*.95);g.scale(1,.18);g.translate(-cx,-(cy+S*.95));
  g.fillStyle=sh;g.fillRect(cx-S*1.5,cy,S*3,S*2);g.restore();
  // soft back light
  const bl=g.createRadialGradient(cx,cy,0,cx,cy,S*1.8);
  bl.addColorStop(0,`rgba(200,40,50,${.07+k*.06})`);bl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=bl;g.fillRect(0,0,W,H);

  const ca=Math.cos(spin),sa=Math.sin(spin),tx=.32,ct=Math.cos(tx),st=Math.sin(tx);
  const L=[-.4,.8,.45];
  const list=[];
  for(const p of P){
    let x=p.hx,y=p.hy-.35,z=p.hz;
    if(k>0){
      const d=1.3*p.sp*k, sw=k*(tt*p.sp*.8+p.ph);
      const ox=p.dx*d, oz=p.dz*d, cs=Math.cos(sw*.6),sn=Math.sin(sw*.6);
      x+=ox*cs-oz*sn; z+=ox*sn+oz*cs;
      y+=p.dy*d*.7+Math.sin(tt*p.sp+p.ph)*.15*k+ k*.25*p.sp;
    }
    // rotate Y then tilt X
    let X=x*ca+z*sa,Z=-x*sa+z*ca;
    let Y=y*ct-Z*st;Z=y*st+Z*ct;
    let nx=p.nx*ca+p.nz*sa,nz=-p.nx*sa+p.nz*ca,ny=p.ny*ct-nz*st;nz=p.ny*st+nz*ct;
    const f=3.2/(3.2+Z);
    let lam=Math.max(0,nx*L[0]+ny*L[1]-nz*L[2]);
    if(nz>0)lam*=.55; // facing away: dim
    list.push({x:cx+X*S*f,y:cy-Y*S*f,z:Z,f,lam,p});
  }
  list.sort((a,b)=>b.z-a.z);
  for(const q of list){
    const p=q.p,l=.25+.75*q.lam,dep=.6+.4*(1-(q.z+1.4)/2.8);
    let r,gg,b;
    if(p.t===1){r=40;gg=34;b=38;}else{r=205;gg=22;b=32;}
    r=r*l*dep;gg=gg*l*dep;b=b*l*dep;
    if(k>0){const fl=.6+.4*Math.sin(tt*6+p.ph);
      r+=(255-r)*k*fl;gg+=(140-gg)*k*fl*.8;b+=(60-b)*k*fl*.5;}
    g.fillStyle=`rgb(${r|0},${gg|0},${b|0})`;
    const s=(1.6+k*.6*p.s)*q.f*S/260;
    g.fillRect(q.x-s/2,q.y-s/2,s,s);
  }
  // ember glow
  if(k>.02){
    g.globalCompositeOperation='lighter';
    for(let i=0;i<list.length;i+=3){const q=list[i],a=k*.12*q.p.s;
      g.fillStyle=`rgba(255,120,50,${a})`;const s=4*q.f*S/260*q.p.s;
      g.beginPath();g.arc(q.x,q.y,s,0,6.283);g.fill();}
    g.globalCompositeOperation='source-over';
  }
  // orbiters
  if(!rm&&orbitOn){
    g.globalCompositeOperation='lighter';g.lineCap='round';
    for(const o of O){
      o.on=Math.min(1,o.on+dt*.5);o.a+=o.sp*dt;
      const x=Math.cos(o.a)*o.r,z=Math.sin(o.a)*o.r,y=o.y+Math.sin(o.a)*o.tilt;
      const Y=y*ct-z*st,Z=y*st+z*ct,f=3.2/(3.2+Z);
      o.tr.push([cx+x*S*f,cy-Y*S*f]);if(o.tr.length>28)o.tr.shift();
      for(let i=1;i<o.tr.length;i++){
        g.strokeStyle=`rgba(255,110,70,${o.on*.35*i/o.tr.length})`;g.lineWidth=1.4*i/o.tr.length*f;
        g.beginPath();g.moveTo(...o.tr[i-1]);g.lineTo(...o.tr[i]);g.stroke();}
      const h=o.tr[o.tr.length-1];
      g.fillStyle=`rgba(255,190,140,${o.on*.9})`;g.beginPath();g.arc(h[0],h[1],1.6*f,0,6.283);g.fill();
    }
    g.globalCompositeOperation='source-over';
  }
  if(!rm||k>0)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
RM.addEventListener?.('change',()=>{last=performance.now();requestAnimationFrame(frame)});
addEventListener('resize',()=>{if(RM.matches)requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
