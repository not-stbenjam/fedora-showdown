<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>Fedora — A Red Hat–style hero</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #07080c;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 480px;
    background: radial-gradient(120% 90% at 50% 32%, #22262f 0%, #15181f 46%, #07080c 100%);
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(95% 75% at 50% 44%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero:focus-visible { outline: 2px solid rgba(255,80,50,.8); outline-offset: -2px; }

  .caption {
    position: absolute;
    left: 50%; bottom: 7%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
    animation: rise 1.1s cubic-bezier(.2,.7,.2,1) .15s both;
    z-index: 2;
    max-width: 94vw;
  }
  .kicker {
    font-size: .66rem;
    letter-spacing: .5em;
    text-transform: uppercase;
    color: rgba(255,255,255,.42);
    margin-bottom: 14px;
  }
  .title {
    font-family: "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: clamp(1.9rem, 9vw, 4.4rem);
    font-weight: 700;
    letter-spacing: .09em;
    line-height: 1.02;
    background: linear-gradient(180deg, #ff7a55 0%, #e22a1c 48%, #a2110b 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 14px rgba(226,42,28,.30));
    white-space: nowrap;
  }
  .rule {
    width: 64px; height: 1px;
    margin: 16px auto 14px;
    background: linear-gradient(90deg, rgba(255,80,40,0), rgba(255,90,55,.7), rgba(255,80,40,0));
  }
  .tag {
    font-size: .7rem;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    margin-left: .34em;
  }
  .hint {
    position: absolute;
    left: 50%; bottom: 4%;
    transform: translateX(-50%);
    max-width: 92vw;
    text-align: center;
    font-size: .66rem;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(255,255,255,.38);
    pointer-events: none;
    transition: opacity .7s ease;
    z-index: 2;
  }
  .hint.gone { opacity: 0; }

  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, 16px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .caption { animation: none; }
    .hint { display: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main id="hero" class="hero" tabindex="0" role="button"
      aria-label="A spinning fedora hat. Hover or tap to release glowing embers.">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="caption" aria-hidden="true">
    <p class="kicker">Signature Headwear</p>
    <h1 class="title">RED HAT</h1>
    <div class="rule"></div>
    <p class="tag">Think big. Act bold.</p>
  </div>
  <p class="hint" id="hint">Hover or tap the hat · set the embers free</p>
</main>
<script>
(() => {
  'use strict';
  const hero = document.getElementById('hero');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- math ----------
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  function rotX(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; }
  function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }

  // ---------- hat geometry ----------
  const SEG = 64, CR = 7, BR = 2;
  const RB = 0.58, RT = 0.50, HC = 0.92;
  const RBAND = 0.615, HBAND = 0.15;
  const RBRIM = 1.52, WAVE = 0.05;
  const TILT = -0.26;

  const CROWN = [0.90, 0.10, 0.06];
  const TOP = [0.95, 0.14, 0.08];
  const BAND = [0.15, 0.045, 0.045];
  const BRIM = [0.80, 0.07, 0.05];
  const BRIM_EDGE = [0.52, 0.04, 0.03];

  const faces = [];
  const addFace = (v, c) => faces.push({ v, c });

  for (let i = 0; i < SEG; i++) {
    const a0 = i / SEG * TAU, a1 = (i + 1) / SEG * TAU;
    const ca0 = Math.cos(a0), sa0 = Math.sin(a0), ca1 = Math.cos(a1), sa1 = Math.sin(a1);
    // crown side (tapered cylinder)
    for (let j = 0; j < CR; j++) {
      const t0 = j / CR, t1 = (j + 1) / CR;
      const r0 = lerp(RB, RT, t0), r1 = lerp(RB, RT, t1);
      const y0 = t0 * HC, y1 = t1 * HC;
      addFace([
        [r0 * ca0, y0, r0 * sa0], [r1 * ca0, y1, r1 * sa0],
        [r1 * ca1, y1, r1 * sa1], [r0 * ca1, y0, r0 * sa1]
      ], CROWN);
    }
    // crown top — shallow dome (fan), wound so the normal points up
    addFace([[0, HC + 0.06, 0], [RT * ca1, HC, RT * sa1], [RT * ca0, HC, RT * sa0]], TOP);
    // band
    addFace([
      [RBAND * ca0, 0, RBAND * sa0], [RBAND * ca0, HBAND, RBAND * sa0],
      [RBAND * ca1, HBAND, RBAND * sa1], [RBAND * ca1, 0, RBAND * sa1]
    ], BAND);
    // brim (gentle four-lobe wave), wound so the normal points up
    for (let j = 0; j < BR; j++) {
      const t0 = j / BR, t1 = (j + 1) / BR;
      const r0 = lerp(RB, RBRIM, t0), r1 = lerp(RB, RBRIM, t1);
      const y0 = WAVE * t0 * Math.sin(2 * a0), y1 = WAVE * t1 * Math.sin(2 * a1);
      addFace([
        [r0 * ca0, y0, r0 * sa0], [r1 * ca1, y1, r1 * sa1],
        [r1 * ca0, y1, r1 * sa0], [r0 * ca1, y0, r0 * sa1]
      ], BRIM);
    }
    // brim edge (thin side wall)
    const e0 = WAVE * Math.sin(2 * a0), e1 = WAVE * Math.sin(2 * a1);
    addFace([
      [RBRIM * ca0, e0 - 0.035, RBRIM * sa0], [RBRIM * ca0, e0, RBRIM * sa0],
      [RBRIM * ca1, e1, RBRIM * sa1], [RBRIM * ca1, e1 - 0.035, RBRIM * sa1]
    ], BRIM_EDGE);
  }

  // bake the tilt and center the hat on the origin
  let minY = 1e9, maxY = -1e9;
  for (const f of faces) {
    f.v = f.v.map(p => {
      const q = rotX(p, TILT);
      if (q[1] < minY) minY = q[1];
      if (q[1] > maxY) maxY = q[1];
      return q;
    });
  }
  const offY = (minY + maxY) / 2;
  for (const f of faces) for (const p of f.v) p[1] -= offY;

  // normals + surface areas
  const triArea = (a, b, c) => { const cr = cross(sub(b, a), sub(c, a)); return 0.5 * Math.hypot(cr[0], cr[1], cr[2]); };
  let totalArea = 0;
  for (const f of faces) {
    if (f.v.length === 3) {
      f.n = norm3(cross(sub(f.v[1], f.v[0]), sub(f.v[2], f.v[0])));
      f.area = triArea(f.v[0], f.v[1], f.v[2]);
    } else {
      f.n = norm3(cross(sub(f.v[1], f.v[0]), sub(f.v[2], f.v[0])));
      f.area = triArea(f.v[0], f.v[1], f.v[2]) + triArea(f.v[0], f.v[2], f.v[3]);
    }
    totalArea += f.area;
  }

  function sampleFace(f) {
    if (f.v.length === 3) {
      let u = Math.random(), v = Math.random();
      if (u + v > 1) { u = 1 - u; v = 1 - v; }
      const A = f.v[0], B = f.v[1], C = f.v[2];
      return [A[0] + (B[0] - A[0]) * u + (C[0] - A[0]) * v,
              A[1] + (B[1] - A[1]) * u + (C[1] - A[1]) * v,
              A[2] + (B[2] - A[2]) * u + (C[2] - A[2]) * v];
    }
    const u = Math.random(), v = Math.random();
    const A = f.v[0], B = f.v[1], C = f.v[2], D = f.v[3];
    return [
      A[0] * (1 - u) * (1 - v) + B[0] * u * (1 - v) + C[0] * u * v + D[0] * (1 - u) * v,
      A[1] * (1 - u) * (1 - v) + B[1] * u * (1 - v) + C[1] * u * v + D[1] * (1 - u) * v,
      A[2] * (1 - u) * (1 - v) + B[2] * u * (1 - v) + C[2] * u * v + D[2] * (1 - u) * v
    ];
  }
  function sampleSurface() {
    let r = Math.random() * totalArea;
    for (const f of faces) { r -= f.area; if (r < 0) return sampleFace(f); }
    return sampleFace(faces[0]);
  }

  // ---------- glow sprites ----------
  function makeSprite(r, g, b) {
    const s = 64, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const c = cv.getContext('2d');
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.22, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
    gr.addColorStop(0.55, 'rgba(' + r + ',' + g + ',' + b + ',0.25)');
    gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    c.fillStyle = gr;
    c.fillRect(0, 0, s, s);
    return cv;
  }
  const sprites = [
    makeSprite(255, 255, 255),
    makeSprite(255, 200, 120),
    makeSprite(255, 130, 60),
    makeSprite(255, 60, 35)
  ];
  const goldSprite = makeSprite(255, 180, 90);

  // ---------- particles ----------
  const N = 2600;
  const orbStride = Math.max(1, Math.round(N / 34));
  const particles = [];
  for (let i = 0; i < N; i++) {
    const o = sampleSurface();
    let dir = norm3(o);
    if (Math.hypot(o[0], o[1], o[2]) < 0.05) dir = [0.1, 0.99, 0.03];
    const isOrb = i % orbStride === 0;
    particles.push({
      o, dir,
      spread: 0.8 + Math.random() * 1.0,
      orbA: Math.random() * TAU,
      orbR: (isOrb ? 1.9 : 0.95) + Math.random() * (isOrb ? 1.15 : 1.5),
      orbSpeed: (isOrb ? 0.38 : 0.5) + Math.random() * 0.55,
      yOff: (Math.random() - 0.5) * 0.95,
      ph1: Math.random() * TAU, ph2: Math.random() * TAU, ph3: Math.random() * TAU,
      ph4: Math.random() * TAU, ph5: Math.random() * TAU, ph6: Math.random() * TAU,
      ph7: Math.random() * TAU,
      size: (0.011 + Math.random() * 0.02) * (Math.random() < 0.12 ? 1.7 : 1),
      sprite: sprites[(Math.random() < 0.14) ? 0 : (Math.random() < 0.5) ? 1 : (Math.random() < 0.85) ? 2 : 3],
      orbiter: isOrb,
      orbStart: null,
      hist: []
    });
  }
  const orbiters = particles.filter(p => p.orbiter);

  // ---------- state ----------
  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, focal = 0;
  let tGlobal = 0, seqT = -1, spin = -0.7, spinF = 1, state = 'idle', orbSnapped = false;
  const CAMZ = 5.0;
  const LIGHT = norm3([-0.55, 0.85, 0.65]);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = hero.clientWidth || window.innerWidth;
    H = hero.clientHeight || window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    cx = W / 2;
    cy = H * 0.40;
    focal = Math.min(W, H) * 0.84;
  }
  function hatRpx() { return RBRIM * focal / CAMZ; }

  function hatAlphaF() {
    if (state === 'idle') return 1;
    const a = seqT;
    if (a < 1.0) return 1 - smooth(clamp((a - 0.45) / 0.55, 0, 1));
    if (a < 6.2) return 0;
    return smooth(clamp((a - 6.2) / 0.8, 0, 1));
  }

  function drawShadow() {
    const k = focal / CAMZ;
    const sx = cx + hatRpx() * 0.22;
    const sy = cy + 1.38 * k;
    const rx = hatRpx() * 1.28, ry = hatRpx() * 0.34;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, 'rgba(0,0,0,0.5)');
    g.addColorStop(0.62, 'rgba(0,0,0,0.24)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawHat(alpha) {
    if (alpha <= 0.01) return;
    const cosS = Math.cos(spin), sinS = Math.sin(spin);
    const items = [];
    for (const f of faces) {
      let cxs = 0, cys = 0, czs = 0;
      const pts = f.v.map(p => {
        const x = p[0] * cosS + p[2] * sinS;
        const z = -p[0] * sinS + p[2] * cosS;
        const y = p[1];
        cxs += x; cys += y; czs += z;
        return [x, y, z];
      });
      const cnt = f.v.length;
      cxs /= cnt; cys /= cnt; czs /= cnt;
      const dz = CAMZ - czs;
      if (dz < 0.4) continue;
      const n = rotY(f.n, spin);
      const diff = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
      const vx = cxs, vy = cys, vz = czs - CAMZ;
      const vl = Math.hypot(vx, vy, vz) || 1;
      const facing = (n[0] * vx + n[1] * vy + n[2] * vz) / vl;
      const back = facing < 0;
      let lum = 0.27 + 0.73 * diff;
      if (back) lum *= 0.52;
      lum += Math.pow(1 - Math.min(1, Math.abs(facing)), 2.2) * (back ? 0.12 : 0.30);
      lum *= 1 - clamp((dz - 3.2) * 0.06, 0, 0.14);
      const r = Math.min(255, f.c[0] * 255 * lum);
      const g = Math.min(255, f.c[1] * 255 * lum);
      const b = Math.min(255, f.c[2] * 255 * lum);
      const pr = pts.map(p => {
        const k = focal / (CAMZ - p[2]);
        return [cx + p[0] * k, cy - p[1] * k];
      });
      items.push({ pr, dz, r, g, b });
    }
    items.sort((a, b) => b.dz - a.dz);
    ctx.globalAlpha = alpha;
    for (const it of items) {
      ctx.fillStyle = 'rgb(' + (it.r | 0) + ',' + (it.g | 0) + ',' + (it.b | 0) + ')';
      ctx.beginPath();
      ctx.moveTo(it.pr[0][0], it.pr[0][1]);
      for (let i = 1; i < it.pr.length; i++) ctx.lineTo(it.pr[i][0], it.pr[i][1]);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function particlePos(p) {
    const c = Math.cos(spin), s = Math.sin(spin);
    const tx = p.o[0] * c + p.o[2] * s;
    const ty = p.o[1];
    const tz = -p.o[0] * s + p.o[2] * c;
    const b = easeOut(clamp(seqT / 2.3, 0, 1));
    const d = [p.dir[0] * c + p.dir[2] * s, p.dir[1], -p.dir[0] * s + p.dir[2] * c];
    const turb = 0.14 * b;
    const bx = tx + d[0] * p.spread * b + Math.sin(seqT * 1.7 + p.ph1) * turb;
    const by = ty + d[1] * p.spread * b + 0.5 * b + Math.sin(seqT * 2.3 + p.ph2) * 0.10 * b;
    const bz = tz + d[2] * p.spread * b + Math.cos(seqT * 1.4 + p.ph3) * turb;
    const ang = p.orbA + seqT * p.orbSpeed;
    const rr = p.orbR * (1 + 0.16 * Math.sin(seqT * 2.1 + p.ph4));
    const swX = Math.cos(ang) * rr, swZ = Math.sin(ang) * rr;
    const swY = 0.34 * Math.sin(seqT * 1.6 + p.ph5) + p.yOff + 0.13 * Math.sin(seqT * 3.2 + p.ph6) + 0.16 * clamp(seqT / 4, 0, 1);
    const m1 = smooth(clamp((seqT - 2.1) / 0.55, 0, 1));
    let px = lerp(bx, swX, m1), py = lerp(by, swY, m1), pz = lerp(bz, swZ, m1);
    const m2 = easeInOut(clamp((seqT - 4.7) / 2.2, 0, 1));
    return [lerp(px, tx, m2), lerp(py, ty, m2), lerp(pz, tz, m2)];
  }

  function pAlpha(p) {
    let al = smooth(clamp(seqT / 0.45, 0, 1));
    al *= 0.8 + 0.2 * Math.sin(tGlobal * 3 + p.ph7);
    if (p.orbiter && seqT >= 7.0) return 0;
    if (seqT > 7.0) al *= 1 - smooth(clamp((seqT - 7.0) / 0.7, 0, 1));
    return al;
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const al = pAlpha(p);
      if (al <= 0.01) continue;
      const pos = particlePos(p);
      const dz = CAMZ - pos[2];
      if (dz < 0.4) continue;
      const k = focal / dz;
      const sx = cx + pos[0] * k, sy = cy - pos[1] * k;
      const rad = p.size * k * 2.2;
      ctx.globalAlpha = al;
      ctx.drawImage(p.sprite, sx - rad, sy - rad, rad * 2, rad * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawOrbiters() {
    if (seqT < 7.0) return;
    if (!orbSnapped) {
      for (const p of orbiters) {
        const c = Math.cos(spin), s = Math.sin(spin);
        p.orbStart = [p.o[0] * c + p.o[2] * s, p.o[1], -p.o[0] * s + p.o[2] * c];
        p.hist.length = 0;
      }
      orbSnapped = true;
    }
    ctx.globalCompositeOperation = 'lighter';
    const tOrb = seqT - 7.0;
    for (const p of orbiters) {
      const rr = lerp(0.45, p.orbR, easeOut(clamp(tOrb / 2.5, 0, 1)));
      const ang = Math.atan2(p.orbStart[2], p.orbStart[0]) + tOrb * p.orbSpeed;
      const oy = 0.5 * Math.sin(tOrb * 0.8 + p.ph5) + p.yOff * 0.45;
      const ox = Math.cos(ang) * rr, oz = Math.sin(ang) * rr;
      const m = smooth(clamp(tOrb / 2.0, 0, 1));
      const pos = [
        lerp(p.orbStart[0], ox, m),
        lerp(p.orbStart[1], oy, m),
        lerp(p.orbStart[2], oz, m)
      ];
      const dz = CAMZ - pos[2];
      if (dz < 0.4) continue;
      const k = focal / dz;
      const sx = cx + pos[0] * k, sy = cy - pos[1] * k;
      const head = p.size * k * 2.6;
      p.hist.push([sx, sy, head]);
      if (p.hist.length > 14) p.hist.shift();
      const n = p.hist.length;
      const pulse = 0.75 + 0.25 * Math.sin(tGlobal * 3 + p.ph7);
      for (let i = 0; i < n; i++) {
        const h = p.hist[i];
        ctx.globalAlpha = (i + 1) / n * 0.5 * pulse;
        const rr2 = h[2] * (0.35 + 0.65 * (i + 1) / n);
        ctx.drawImage(p.sprite, h[0] - rr2, h[1] - rr2, rr2 * 2, rr2 * 2);
      }
      ctx.globalAlpha = 0.95 * pulse;
      ctx.drawImage(p.sprite, sx - head, sy - head, head * 2, head * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- ambient dust ----------
  const dust = Array.from({ length: 64 }, () => ({
    x: (Math.random() * 2 - 1) * 2.4,
    y: (Math.random() * 2 - 1) * 1.7,
    z: (Math.random() * 2 - 1) * 1.3,
    sp: 0.05 + Math.random() * 0.14,
    ph: Math.random() * TAU,
    sz: 0.004 + Math.random() * 0.009
  }));
  function drawDust() {
    ctx.globalCompositeOperation = 'lighter';
    for (const d of dust) {
      const yy = (((d.y + tGlobal * d.sp * 0.5) % 2) + 2) % 2 - 1;
      const x = d.x + Math.sin(tGlobal * 0.3 + d.ph) * 0.3;
      const dz = CAMZ - d.z;
      if (dz < 0.4) continue;
      const k = focal / dz;
      const sx = cx + x * k, sy = cy - yy * k;
      const rad = d.sz * k * 2.0;
      ctx.globalAlpha = 0.04 + 0.07 * (0.5 + 0.5 * Math.sin(tGlobal * 1.3 + d.ph));
      ctx.drawImage(goldSprite, sx - rad, sy - rad, rad * 2, rad * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function glowBehindHat(alpha) {
    const hr = hatRpx();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr * 2.0);
    g.addColorStop(0, 'rgba(255,84,38,' + alpha + ')');
    g.addColorStop(0.45, 'rgba(235,50,25,' + (alpha * 0.35) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - hr * 2, cy - hr * 2, hr * 4, hr * 4);
    ctx.globalCompositeOperation = 'source-over';
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    glowBehindHat(0.20);
    drawShadow();
    drawDust();
    drawHat(hatAlphaF());
    if (state !== 'idle') drawParticles();
    if (state !== 'idle' && seqT >= 7.0) drawOrbiters();
  }

  function renderStatic() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    glowBehindHat(0.18);
    drawShadow();
    drawHat(1);
  }

  // ---------- interactions ----------
  function trigger() {
    if (reduceMotion) return;
    hint.classList.add('gone');
    orbSnapped = false;
    for (const p of orbiters) p.hist.length = 0;
    state = 'seq';
    seqT = 0;
  }
  hero.addEventListener('pointerenter', trigger);
  hero.addEventListener('click', trigger);
  hero.addEventListener('touchstart', trigger, { passive: true });
  hero.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); }
  });

  // ---------- boot ----------
  function onResize() {
    resize();
    if (reduceMotion) renderStatic();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  resize();
  if (reduceMotion) {
    renderStatic();
  } else {
    render();
    let last = performance.now();
    (function frame(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      tGlobal += dt;
      const targetF = state === 'seq' ? 0.05 : 1;
      spinF += (targetF - spinF) * Math.min(1, dt * 2.0);
      spin += 0.6 * spinF * dt;
      if (state === 'seq') {
        seqT += dt;
        if (seqT > 7.4) state = 'done';
      }
      render();
      requestAnimationFrame(frame);
    })(performance.now());
  }
})();
</script>
</body>
</html>
