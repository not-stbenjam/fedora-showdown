<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Red Hat Fedora</title>
<style>
  :root {
    --bg:#0a0a0a;
    --hat:#e32b2b;
    --glow:rgba(255,100,100,.7);
    --particle:#ff9f9f;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#1a1a1a 0%,var(--bg) 70%);
    font-family:'Segoe UI',system-ui,sans-serif;color:#eee;overflow:hidden;
  }
  .scene{
    perspective:1200px;
    width:300px;height:300px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .hat-wrap{
    transform-style:preserve-3d;
    animation:spin 12s linear infinite;
    will-change:transform;
  }
  @keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
  .hat{
    width:200px;height:200px;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));
    transition:filter .3s;
  }
  .hat:hover{filter:drop-shadow(0 10px 30px var(--glow))}
  .caption{margin-top:2rem;font-size:.9rem;opacity:.8;text-align:center;}
  /* particles */
  .particle{
    position:absolute;width:4px;height:4px;border-radius:50%;background:var(--particle);
    pointer-events:none;opacity:0;
  }
  @media(prefers-reduced-motion:reduce){
    .hat-wrap{animation:none;}
    .particle{display:none;}
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="hat-wrap" id="hatWrap">
    <!-- Simple Red Hat SVG -->
    <svg class="hat" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff4d4d"/>
          <stop offset="100%" stop-color="#c00000"/>
        </linearGradient>
      </defs>
      <path d="M100 20 C60 20 30 50 30 90 L30 120 L170 120 L170 90 C170 50 140 20 100 20 Z" fill="url(#grad)" stroke="#fff" stroke-width="2"/>
      <ellipse cx="100" cy="120" rx="70" ry="10" fill="#fff" opacity=".2"/>
      <circle cx="100" cy="120" r="4" fill="#fff"/>
    </svg>
  </div>
</div>
<p class="caption">Hover or tap to dissolve &amp; reform</p>

<script>
(() => {
  const scene = document.getElementById('scene');
  const hatWrap = document.getElementById('hatWrap');
  let particles = [];
  let animating = false;
  let rafId;

  function createParticles(count = 200) {
    const rect = hatWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = `${cx}px`;
      p.style.top = `${cy}px`;
      scene.appendChild(p);
      particles.push({
        el: p,
        x: cx,
        y: cy,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: Math.random() * 2 + 1, // seconds
        maxLife: Math.random() * 2 + 1,
        orbit: Math.random() > 0.8, // some orbit after dissolve
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * 30 + 10,
        speed: (Math.random() * 0.5 + 0.2) * (Math.random() > 0.5 ? 1 : -1),
      });
    }
  }

  function startDissolve() {
    if (animating || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    animating = true;
    hatWrap.style.animationPlayState = 'paused';
    createParticles();
    const startTime = performance.now();
    function tick(now) {
      const dt = (now - startTime) / 1000;
      particles.forEach((p, idx) => {
        if (p.life <= 0) return;
        p.life -= dt;
        if (p.orbit && p.life < 0.5) {
          // orbit around original center
          p.angle += p.speed * dt;
          const cx = parseFloat(p.el.style.left);
          const cy = parseFloat(p.el.style.top);
          const ox = cx + Math.cos(p.angle) * p.radius;
          const oy = cy + Math.sin(p.angle) * p.radius;
          p.x = ox;
          p.y = oy;
        } else {
          p.x += p.vx * dt * 60;
          p.y += p.vy * dt * 60;
        }
        const opacity = Math.min(1, p.life / p.maxLife);
        p.el.style.transform = `translate(${p.x}px,${p.y}px)`;
        p.el.style.opacity = opacity;
      });
      // remove dead particles
      particles = particles.filter(p => p.life > 0);
      if (particles.length) {
        rafId = requestAnimationFrame(tick);
      } else {
        // reassemble
        startReform();
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function startReform() {
    const cx = scene.offsetWidth / 2;
    const cy = scene.offsetHeight / 2;
    particles.forEach(p => {
      p.x = cx;
      p.y = cy;
      p.vx = 0;
      p.vy = 0;
      p.life = 0.5;
      p.maxLife = 0.5;
      p.orbit = false;
    });
    const startTime = performance.now();
    function tick(now) {
      const dt = (now - startTime) / 1000;
      particles.forEach(p => {
        p.life -= dt;
        const opacity = Math.min(1, p.life / p.maxLife);
        p.el.style.opacity = opacity;
        if (p.life <= 0) {
          p.el.remove();
        }
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length) {
        rafId = requestAnimationFrame(tick);
      } else {
        animating = false;
        hatWrap.style.animationPlayState = 'running';
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  // Interaction
  hatWrap.addEventListener('pointerenter', startDissolve);
  hatWrap.addEventListener('pointercancel', () => {
    if (!animating) return;
    // cancel dissolve early, go back to normal
    cancelAnimationFrame(rafId);
    particles.forEach(p => p.el.remove());
    particles = [];
    animating = false;
    hatWrap.style.animationPlayState = 'running';
  });
})();
</script>
</body>
</html>
