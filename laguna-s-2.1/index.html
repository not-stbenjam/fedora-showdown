<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05050a; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
  }
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .caption {
    position: relative;
    z-index: 10;
    margin-top: 3rem;
    font-size: 1.3rem;
    color: #e0e0e0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.7;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .hero:hover .caption { opacity: 1; }
  @media (max-width: 768px) {
    .caption { font-size: 1.1rem; margin-top: 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .caption { opacity: 1; }
    .hero:hover .caption { opacity: 1; }
  }
</style>
</head>
<body>
<div class="hero" id="hero">
  <canvas id="canvas"></canvas>
  <div class="caption">Fedora</div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const hero = document.getElementById('hero');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ─── Resize ────────────────────────────────────────────────────────────
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    canvas.width  = window.innerWidth  * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // ─── Fedora geometry (3D model, y=0 at centre) ─────────────────────────
  const F = {
    crownTopR: 36,
    crownBottomR: 52,
    crownH: 125,
    brimOuterR: 100,
    brimInnerR: 52,
    brimT: 10,
  };

  // Generate surface points used both for rendering hints and particle emission
  function genPoints() {
    const pts = [];
    const cs = 32, cseg = 64;          // crown
    for (let i = 0; i <= cs; i++) {
      const t = i / cs;
      const y = (t - 0.5) * F.crownH;
      const r = F.crownBottomR + (F.crownTopR - F.crownBottomR) * t;
      for (let j = 0; j < cseg; j++) {
        const a = (j / cseg) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r });
      }
    }
    const bs = 26, bseg = 64;           // brim top
    for (let i = 0; i < bs; i++) {
      const r = F.brimInnerR + (F.brimOuterR - F.brimInnerR) * (i / bs);
      for (let j = 0; j < bseg; j++) {
        const a = (j / bseg) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * r, y: -F.crownH / 2, z: Math.sin(a) * r });
      }
    }
    const es = 8, eseg = 90;            // brim edge
    for (let i = 0; i < es; i++) {
      const y = -F.crownH / 2 - (i / es) * F.brimT;
      for (let j = 0; j < eseg; j++) {
        const a = (j / eseg) * Math.PI * 2;
        pts.push({ x: Math.cos(a) * F.brimOuterR, y, z: Math.sin(a) * F.brimOuterR });
      }
    }
    return pts;
  }
  const surfacePoints = genPoints();

  // ─── Particle textures (pre-rendered glow canvases) ───────────────────
  function makeTex(col) {
    const s = 56;
    const t = document.createElement('canvas');
    t.width = t.height = s;
    const tc = t.getContext('2d');
    const g = tc.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0,   col);
    g.addColorStop(0.35, col);
    g.addColorStop(1,   'rgba(0,0,0,0)');
    tc.fillStyle = g;
    tc.fillRect(0, 0, s, s);
    return t;
  }
  const TEX = {
    orange: makeTex('#FF8C00'),
    gold:   makeTex('#FFD700'),
    red:    makeTex('#FF6347'),
    amber:  makeTex('#FFA500'),
  };
  const TEX_KEYS = Object.keys(TEX);

  // ─── State ─────────────────────────────────────────────────────────────
  const S = {
    angle: 0,
    spinSpeed: 0.004,
    targetSpin: 0.004,
    mode: 'spinning',          // spinning | dissolve | swirl | reform | reformed
    phaseT: 0,
    hovered: false,
    particles: [],
    orbiting: [],
  };

  // ─── Event handlers ────────────────────────────────────────────────────
  function hoverStart() {
    S.hovered = true;
    S.targetSpin = 0.0008;
    if (S.mode === 'spinning') {
      setTimeout(() => {
        if (S.hovered && S.mode === 'spinning') startDissolve();
      }, 450);
    }
  }
  function hoverEnd() {
    S.hovered = false;
    S.targetSpin = 0.004;
    if (S.mode === 'reformed') fadeOrbiting();
  }
  if (!prefersReducedMotion) {
    hero.addEventListener('mouseenter', hoverStart);
    hero.addEventListener('mouseleave', hoverEnd);
    hero.addEventListener('touchstart', (e) => { e.preventDefault(); hoverStart(); });
    hero.addEventListener('touchend',   (e) => { e.preventDefault(); hoverEnd(); });
  }

  // ─── Start dissolve ────────────────────────────────────────────────────
  function startDissolve() {
    S.mode = 'dissolve';
    S.phaseT = 0;
    const cx = canvas.clientWidth / 2;
    const cy = canvas.clientHeight / 2;
    const sc = Math.min(canvas.clientWidth, canvas.clientHeight) / 800;
    const cos = Math.cos(S.angle);
    const sin = Math.sin(S.angle);
    const persp = 900;

    S.particles = surfacePoints.map(p => {
      // rotate around Y
      const x = p.x * cos + p.z * sin;
      const z = -p.x * sin + p.z * cos;
      const f = persp / (persp + z * sc);
      const sx = cx + x * sc * f;
      const sy = cy - p.y * sc * f;

      // outward velocity from centre
      const dx = sx - cx;
      const dy = sy - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ang = Math.atan2(dy, dx);
      const sp = 0.4 + Math.random() * 0.6;
      const vx = Math.cos(ang) * sp * (40 + dist * 0.4) + (Math.random() - 0.5) * 30;
      const vy = Math.sin(ang) * sp * (40 + dist * 0.4) + (Math.random() - 0.5) * 30;

      return {
        x: sx, y: sy,
        tx: sx, ty: sy,
        vx, vy,
        size: 0,
        targetSize: 1.5 + Math.random() * 2.5,
        tex: TEX_KEYS[Math.floor(Math.random() * TEX_KEYS.length)],
        alpha: 0,
      };
    });
  }

  // ─── Create orbiting particles ─────────────────────────────────────────
  function createOrbiting() {
    S.orbiting = [];
    const cx = canvas.clientWidth / 2;
    const cy = canvas.clientHeight / 2;
    const sc = Math.min(canvas.clientWidth, canvas.clientHeight) / 800;
    for (let i = 0; i < 9; i++) {
      S.orbiting.push({
        radius: (110 + Math.random() * 110) * sc,
        speed: 0.0015 + Math.random() * 0.0025,
        phase: Math.random() * Math.PI * 2,
        height: cy - (F.crownH * 0.4) * sc + Math.random() * (F.crownH * 0.8) * sc,
        size: (1.5 + Math.random() * 2.5) * sc,
        tex: TEX_KEYS[Math.floor(Math.random() * TEX_KEYS.length)],
        alpha: 0,
        trail: [],
        fadeOut: false,
      });
    }
  }

  function fadeOrbiting() {
    S.orbiting.forEach(p => { p.fadeOut = true; });
  }

  // ─── Animation loop ────────────────────────────────────────────────────
  let lastT = 0;
  function animate(time) {
    const dt = (time - lastT) / 1000;
    lastT = time;
    update(dt);
    render();
    requestAnimationFrame(animate);
  }

  // ─── Update ────────────────────────────────────────────────────────────
  function update(dt) {
    const step = dt * 60; // normalise to 60 fps

    // spin speed easing
    S.spinSpeed += (S.targetSpin - S.spinSpeed) * 0.08;
    S.angle += S.spinSpeed * step;

    if (S.mode === 'dissolve') {
      S.phaseT += dt;
      const t = S.phaseT / 0.8;
      S.particles.forEach(p => {
        p.size = p.targetSize * Math.min(1, t * 2.5) * (Math.min(canvas.clientWidth, canvas.clientHeight) / 800);
        p.alpha = Math.min(1, t * 2);
        p.vx *= Math.pow(0.97, step);
        p.vy *= Math.pow(0.97, step);
        // gentle outward drift + swirl seed
        const cx = canvas.clientWidth / 2;
        const cy = canvas.clientHeight / 2;
        const ang = Math.atan2(p.y - cy, p.x - cx);
        p.vx += Math.cos(ang + Math.PI / 2) * 0.15 * step;
        p.vy += Math.sin(ang + Math.PI / 2) * 0.15 * step;
        p.x += p.vx * step * 0.016;
        p.y += p.vy * step * 0.016;
      });
      if (S.phaseT >= 0.8) { S.mode = 'swirl'; S.phaseT = 0; }

    } else if (S.mode === 'swirl') {
      S.phaseT += dt;
      const t = S.phaseT / 1.6;
      const cx = canvas.clientWidth / 2;
      const cy = canvas.clientHeight / 2;
      S.particles.forEach(p => {
        const dx = p.x - cx;
        const dy = p.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.atan2(dy, dx);
        // tangential swirl
        const sw = 0.0008 * (1 - t * 0.2) * dist;
        p.vx += Math.cos(ang + Math.PI / 2) * sw * step;
        p.vy += Math.sin(ang + Math.PI / 2) * sw * step;
        // noise
        p.vx += (Math.random() - 0.5) * 0.3 * step;
        p.vy += (Math.random() - 0.5) * 0.3 * step;
        p.vx *= Math.pow(0.985, step);
        p.vy *= Math.pow(0.985, step);
        p.x += p.vx * step * 0.016;
        p.y += p.vy * step * 0.016;
        // colour shift toward warmer
        if (t > 0.4 && Math.random() < 0.02) {
          p.tex = TEX_KEYS[Math.floor(Math.random() * TEX_KEYS.length)];
        }
      });
      if (S.phaseT >= 1.6) { S.mode = 'reform'; S.phaseT = 0; }

    } else if (S.mode === 'reform') {
      S.phaseT += dt;
      const t = S.phaseT / 1.4;
      const ease = 1 - Math.pow(1 - t, 3);
      let allClose = true;
      S.particles.forEach(p => {
        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 3) allClose = false;
        const force = 0.0006 * (1 + ease * 4);
        p.vx += dx * force * step;
        p.vy += dy * force * step;
        p.vx *= Math.pow(0.92, step);
        p.vy *= Math.pow(0.92, step);
        p.x += p.vx * step * 0.016;
        p.y += p.vy * step * 0.016;
        p.size = p.targetSize * Math.max(0.1, 1 - ease * 0.8) * (Math.min(canvas.clientWidth, canvas.clientHeight) / 800);
        p.alpha = Math.max(0, 1 - ease * 1.3);
      });
      if (allClose || S.phaseT >= 1.4) {
        S.mode = 'reformed';
        createOrbiting();
      }

    } else if (S.mode === 'reformed') {
      S.orbiting.forEach(p => {
        p.phase += p.speed * step;
        p.alpha = p.fadeOut
          ? Math.max(0, p.alpha - 0.03 * step)
          : Math.min(1, p.alpha + 0.05 * step);
        // trail
        p.trail.push({ x: p.radius * Math.cos(p.phase), y: p.height });
        if (p.trail.length > 12) p.trail.shift();
      });
      // remove dead orbiting particles
      if (S.orbiting.every(p => p.alpha <= 0.01)) {
        S.orbiting = [];
      }
    }
  }

  // ─── Render ────────────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.clientWidth / 2;
    const cy = canvas.clientHeight / 2;
    const sc = Math.min(canvas.clientWidth, canvas.clientHeight) / 800;

    // ── Particles (dissolve / swirl / reform) ──
    if (S.mode !== 'spinning') {
      ctx.globalCompositeOperation = 'lighter';
      S.particles.forEach(p => {
        if (p.alpha <= 0) return;
        const sz = p.size * 2;
        ctx.globalAlpha = p.alpha;
        ctx.drawImage(TEX[p.tex], p.x - sz / 2, p.y - sz / 2, sz, sz);
      });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // ── Orbiting particles ──
    if (S.orbiting.length > 0) {
      ctx.globalCompositeOperation = 'lighter';
      S.orbiting.forEach(p => {
        if (p.alpha <= 0) return;
        // trail
        for (let i = 0; i < p.trail.length; i++) {
          const tr = i / p.trail.length;
          const ts = p.size * 0.6 * tr;
          ctx.globalAlpha = p.alpha * tr * 0.4;
          ctx.drawImage(TEX[p.tex], cx + p.trail[i].x - ts / 2, p.trail[i].y - ts / 2, ts, ts);
        }
        // main particle
        ctx.globalAlpha = p.alpha;
        const sz = p.size * 2;
        const px = cx + p.radius * Math.cos(p.phase);
        ctx.drawImage(TEX[p.tex], px - sz / 2, p.height - sz / 2, sz, sz);
      });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // ── Fedora (spinning or reformed) ──
    if (S.mode === 'spinning' || S.mode === 'reformed') {
      drawFedora(ctx, S.angle, cx, cy, sc);
    }
  }

  // ─── Draw the fedora ───────────────────────────────────────────────────
  function drawFedora(ctx, angle, cx, cy, sc) {
    const cos = Math.cos(angle);
    const absCos = Math.abs(cos);
    const light = (cos + 1) / 2; // 0 = back, 1 = front

    // dimensions
    const tR = F.crownTopR * sc;
    const bR = F.crownBottomR * sc;
    const cH = F.crownH * sc;
    const oR = F.brimOuterR * sc;
    const iR = F.brimInnerR * sc;
    const bT = F.brimT * sc;

    // positions (y=0 at centre, canvas y is inverted)
    const cTopY  = cy - cH / 2;
    const cBotY  = cy + cH / 2;
    const brimY  = cBotY;
    const bob    = Math.sin(angle * 2.5) * 3 * sc; // gentle float

    // ── Shadow ──
    ctx.fillStyle = `rgba(0,0,0,${0.22 * absCos})`;
    ctx.beginPath();
    ctx.ellipse(cx, brimY + 12 * sc, oR * absCos * 0.65, 16 * sc * absCos, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Brim top surface ──
    const brimGrad = ctx.createRadialGradient(
      cx + oR * 0.25 * cos * absCos,
      brimY,
      3 * sc,
      cx,
      brimY,
      oR * absCos
    );
    const bl = 18 + Math.round(12 * light);
    const bm = 14 + Math.round(8 * light);
    const bd = 10 + Math.round(6 * light);
    brimGrad.addColorStop(0,   `rgb(${bl},${bl},${bl + 4})`);
    brimGrad.addColorStop(0.5, `rgb(${bm},${bm},${bm + 4})`);
    brimGrad.addColorStop(1,   `rgb(${bd},${bd},${bd + 4})`);
    ctx.fillStyle = brimGrad;
    ctx.beginPath();
    ctx.ellipse(cx, brimY + bob, oR * absCos, oR * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Brim edge (side) ──
    if (absCos < 0.97) {
      const edgeW = oR * (1 - absCos) + bT;
      const edgeX = cx + oR * absCos * (cos >= 0 ? 1 : -1);
      const edgeGrad = ctx.createLinearGradient(
        edgeX, brimY - bT,
        edgeX + (cos >= 0 ? edgeW : -edgeW), brimY + bT
      );
      edgeGrad.addColorStop(0, `rgba(${bd},${bd},${bd + 4},0.6)`);
      edgeGrad.addColorStop(1, `rgba(${bd - 4},${bd - 4},${bd},0.2)`);
      ctx.fillStyle = edgeGrad;
      ctx.fillRect(
        cos >= 0 ? edgeX : edgeX - edgeW,
        brimY - bT,
        edgeW,
        bT + cH * 0.1
      );
    }

    // ── Crown (front face) ──
    const topW = tR * absCos;
    const botW = bR * absCos;

    // Determine draw order: back side first if visible
    const drawBack = cos < 0;

    // ── Crown back face ──
    if (drawBack) {
      const backGrad = ctx.createLinearGradient(
        cx - botW / 2, cTopY,
        cx + botW / 2, cBotY
      );
      backGrad.addColorStop(0, `rgb(${bd - 2},${bd - 2},${bd + 2})`);
      backGrad.addColorStop(1, `rgb(${bd - 6},${bd - 6},${bd - 2})`);
      ctx.fillStyle = backGrad;
      ctx.beginPath();
      ctx.moveTo(cx - topW / 2, cTopY + bob);
      ctx.lineTo(cx + topW / 2, cTopY + bob);
      ctx.lineTo(cx + botW / 2, cBotY + bob);
      ctx.lineTo(cx - botW / 2, cBotY + bob);
      ctx.closePath();
      ctx.fill();
    }

    // ── Crown front face ──
    const frontGrad = ctx.createLinearGradient(
      cx - botW / 2, cTopY,
      cx + botW / 2, cBotY
    );
    const fl = 22 + Math.round(14 * light);
    const fm = 18 + Math.round(10 * light);
    const fb = 14 + Math.round(8 * light);
    frontGrad.addColorStop(0,   `rgb(${fl},${fl},${fl + 6})`);
    frontGrad.addColorStop(0.5, `rgb(${fm},${fm},${fm + 5})`);
    frontGrad.addColorStop(1,   `rgb(${fb},${fb},${fb + 4})`);
    ctx.fillStyle = frontGrad;
    ctx.beginPath();
    ctx.moveTo(cx - topW / 2, cTopY + bob);
    ctx.lineTo(cx + topW / 2, cTopY + bob);
    ctx.lineTo(cx + botW / 2, cBotY + bob);
    ctx.lineTo(cx - botW / 2, cBotY + bob);
    ctx.closePath();
    ctx.fill();

    // ── Crown top ──
    ctx.fillStyle = `rgb(${fl - 2},${fl - 2},${fl + 4})`;
    ctx.beginPath();
    ctx.ellipse(cx, cTopY + bob, topW / 2, topW / 2 * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Crown top highlight ──
    const hl = ctx.createRadialGradient(
      cx - topW * 0.2, cTopY - topW * 0.1, 1,
      cx, cTopY, topW / 2
    );
    hl.addColorStop(0, `rgba(255,255,255,${0.08 * absCos})`);
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.ellipse(cx, cTopY + bob, topW / 2, topW / 2 * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Brim highlight ──
    const bhl = ctx.createRadialGradient(
      cx + oR * 0.2 * cos, brimY + bob, 3,
      cx, brimY + bob, oR * absCos
    );
    bhl.addColorStop(0, `rgba(255,255,255,${0.06 * absCos})`);
    bhl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bhl;
    ctx.beginPath();
    ctx.ellipse(cx, brimY + bob, oR * absCos, oR * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ─── Init ──────────────────────────────────────────────────────────────
  if (prefersReducedMotion) {
    // Static fedora, no animation
    function renderStatic() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const sc = Math.min(canvas.clientWidth, canvas.clientHeight) / 800;
      drawFedora(ctx, 0, canvas.clientWidth / 2, canvas.clientHeight / 2, sc);
    }
    renderStatic();
    window.addEventListener('resize', renderStatic);
  } else {
    requestAnimationFrame(animate);
  }
})();
</script>
</body>
</html>
