<title>Red Hat Fedora 3D Hero</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #0c0c1d 0%, #050510 50%, #020208 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .hat-container {
    perspective: 1000px;
    position: relative;
  }

  .fedora {
    width: 200px;
    height: 200px;
    transform-style: preserve-3d;
    animation: spin 10s linear infinite;
    transform-origin: center center;
  }

  @keyframes spin {
    0%   { transform: rotateY(0deg) rotateX(15deg); }
    1的朋友% { transform: rotateY(360deg) rotateX(0deg); }
    100% { transform: rotateY(720deg) rotateX(15deg); }
  }
</style>

<body>
<div id="scene">
  <canvas id="particleCanvas"></canvas>
  <div id="hat-container">
    <svg id="fedora" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
      <!-- Brim -->
      <ellipse cx="100" cy="120" rx="90" ry="20" fill="#9e1b1b" stroke="#6b1010" stroke-width="2"/>
      <!-- Crown -->
      <path d="M50,120 Q50,50 100,30 Q150,50 150,120" fill="#b22222" stroke="#6b1010" stroke-width="2"/>
      <!-- Band -->
      <rect x="45" y="110" width="110" height="25" fill="#b22222" stroke="#6b1010" stroke-width="2"/>
      <!-- Top dot -->
      <circle cx="100" cy="25" r="5" fill="#b22222" stroke="#6b1010" stroke-width="2"/>
    </svg>
    <div id="hat-bg">
      <ellipse cx="100" cy="140" rx="70" ry="15" fill="#7a1515"/>
      <path d="M30,140 Q30,60 100,40 Q170,60 170,140" fill="#7a1515"/>
    </div>
  </div>

  <p style="text-align:center; color:#ccc; margin-top:20px; font-size:1.2em;">Red Hat Fedora Badge</p>

<script>
  // Reduced motion check
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // If reduced motion, keep the hat static
  if (!prefersReducedMotion) {
    const hat = document.getElementById('fedora');
    let angle = 0;
    function animate() {
      angle += 0.5;
      hat.style.transform = `rotateY(${angle}deg) rotateX(${-angle * 0.5}deg)`;
      requestAnimationFrame(animate);
    }
    animate();
  }
</script>
