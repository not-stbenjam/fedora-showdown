<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fedora — Embers</title>
<style>
  :root{
    --bg-0:#07080a;
    --bg-1:#0d0f14;
    --ember:#e01828;
    --ember-warm:#ff7a5c;
    --text:#e8e9ec;
    --muted:#797f8a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1300px 760px at 50% 36%, #151820 0%, var(--bg-1) 44%, var(--bg-0) 100%),
      var(--bg-0);
    color:var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* soft vignette for depth */
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(130% 95% at 50% 45%, transparent 44%, rgba(0,0,0,.6) 100%);
  }
  /* faint warm pool of light beneath the hat */
  .floor{
    position:fixed; left:50%; bottom:-6vh; transform:translateX(-50%);
    width:min(140vmin,1400px); height:52vmin; pointer-events:none; z-index:1;
    background:radial-gradient(50% 50% at 50% 100%, rgba(224,24,40,.16), transparent 72%);
    filter:blur(24px);
  }

  .stage{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px, 2.4vh, 24px);
    padding:max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;width:100%;height:100%}

  .caption{text-align:center;user-select:none;transition:filter .8s ease,opacity .8s ease}
  .caption h1{
    font-size:clamp(1.15rem,3.6vw,1.95rem);
    font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:#f4f5f7;
    text-shadow:0 0 26px rgba(224,24,40,.4), 0 2px 14px rgba(0,0,0,.7);
  }
  .caption p{
    margin-top:.75em; font-size:clamp(.68rem,1.9vw,.84rem);
    letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    transition:color .8s ease;
  }
  body.dissolving .caption h1{filter:blur(1.4px);opacity:.5}
  body.dissolving .caption p{color:#c9453c}
</style>
</head>
<body>
  <div class="floor"></div>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Dissolve the hat into glowing embers">
    <canvas id="scene"></canvas>
    <div class="caption">
      <h1>Fedora</h1>
      <p id="hint">Hover or tap to release the embers</p>
    </div>
  </div>

  <div class="vignette"></div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha:true });
  const stage = document.getElementById("stage");
  const hint  = document.getElementById("hint");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  // ---------------------------------------------------------------- config
  const CFG = {
    spinSpeed: 0.44,      // rad/s at rest
    slowSpin: 0.10,       // while dissolved
    reducedSpin: 0.05,    // prefers-reduced-motion
    size: 1.5,            // ember core radius
    glowSize: 7,          // glow sprite radius
    glowAlpha: 0.5,
    dissolveTime: 1.2,
    reformTime: 1.4,
    holdTime: 2.5,        // drift duration before reforming
    orbitCount: 34,
    orbitSpeed: 0.26,
    gravity: 0.02
  };

  // ------------------------------------------------- fedora silhouette (unit)
  // x in [-1,1], y from 0 (brim) up to ~1 (crown top). 0,0 is crown base center.
  function brimRadius(theta){
    const a = Math.abs(((theta % (Math.PI*2)) + Math.PI*2) % (Math.PI*2) - Math.PI);
    return 0.62 + 0.30 * Math.pow(Math.cos(a), 0.6);   // slightly oval
  }
  // crown half-width profile: pinched fedora sides + center crease
  const CROWN = [
    {t:0.00,x:0.30},{t:0.08,x:0.42},{t:0.20,x:0.45},
    {t:0.34,x:0.44},{t:0.48,x:0.38},{t:0.62,x:0.28},
    {t:0.78,x:0.15},{t:0.90,x:0.07},{t:1.00,x:0.02}
  ];
  function crownAt(t){
    const s = CROWN; let i = 0;
    for (let k=0;k<s.length-1;k++){ if (t <= s[k+1].t){ i=k; break; } i=s.length-2; }
    const a=s[i], b=s[i+1];
    const f = (b.t===a.t)?0:(t-a.t)/(b.t-a.t);
    return a.x + (b.x-a.x)*f;
  }

  // ---------------------------------------------------------------- state
  const S = {
    w:0,h:0,dpr:1,cx:0,cy:0,scale:1,
    spin:0, spinTarget:CFG.spinSpeed, bobY:0,
    t:0, holdT:0,
    mode:"rest",           // rest | dissolving | scattered | reforming
    dissolved:false,
    n:0, P:[],             // particles
    hx:null,hy:null,hz:null,   // home
    sx:null,sy:null,sz:null,   // scatter targets
    fx:null,fy:null,fz:null,   // reform-from
    orbiters:null, seed:null, bright:null,
    orbitIdx:[]
  };

  // --------------------------------------------------------- glow sprites
  // Pre-rendered radial sprites keep the draw loop cheap (no per-frame gradients).
  function makeSprite(rgb){
    const R = 32;
    const c = document.createElement("canvas");
    c.width = c.height = R*2;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(R,R,0,R,R,R);
    grd.addColorStop(0,   `rgba(${rgb},1)`);
    grd.addColorStop(0.25,`rgba(${rgb},0.55)`);
    grd.addColorStop(0.6, `rgba(${rgb},0.14)`);
    grd.addColorStop(1,   `rgba(${rgb},0)`);
    g.fillStyle = grd;
    g.fillRect(0,0,R*2,R*2);
    return c;
  }
  const SPR_RED  = makeSprite("224,24,40");
  const SPR_WARM = makeSprite("255,140,110");
  const SPR_CORE = makeSprite("255,205,190");

  function drawSprite(sprite, x, y, radius, alpha){
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprite, x-radius, y-radius, radius*2, radius*2);
  }

  // ------------------------------------------------------- build particles
  function densityFor(){
    const area = S.w * S.h;
    return Math.round(5600 * Math.min(1.4, Math.max(0.5, area/(1080*760))));
  }

  function buildHat(){
    const count = densityFor();
    const N = count;
    const hx=new Float32Array(N), hy=new Float32Array(N), hz=new Float32Array(N);
    let i=0;

    const push=(x,y,z)=>{ hx[i]=x; hy[i]=y; hz[i]=z; i++; };

    // brim — two thin shells => sense of volume as it spins
    const bN = Math.round(N*0.42);
    for(let k=0;k<bN;k++){
      const th = (k/bN)*Math.PI*2*7.31;
      const rr = Math.pow(Math.random(),0.45);
      const r = brimRadius(th)*rr;
      push(Math.cos(th)*r, 0, Math.sin(th)*r);
    }
    const bN2 = Math.round(N*0.18);
    for(let k=0;k<bN2;k++){
      const th = (k/bN2)*Math.PI*2*5.17;
      const rr = Math.pow(Math.random(),0.4);
      const r = brimRadius(th)*rr*0.85;
      push(Math.cos(th)*r, -0.01, Math.sin(th)*r);
    }

    // crown body — tapered, follows the pinched profile
    const cN = Math.round(N*0.32);
    for(let k=0;k<cN;k++){
      const th = (k/cN)*Math.PI*2*11.7;
      const y = (k/cN)%1;                 // ring height 0..1
      const ringT = Math.min(0.999, y);
      const half = crownAt(ringT)*Math.abs(Math.cos(th))*0.9 + 0.05;
      const r = Math.max(0.02, half);
      push(Math.cos(th)*r, ringT, Math.sin(th)*r);
    }

    // crown crease down the front (fedora signature)
    const crN = Math.round(N*0.05);
    for(let k=0;k<crN;k++){
      const y=k/crN;
      push((Math.random()-0.5)*0.02, y, (Math.random()-0.5)*0.03);
    }
    // red band ribbon at crown base
    const bdN = Math.round(N*0.03);
    for(let k=0;k<bdN;k++){
      const th=(k/bdN)*Math.PI*2*3.1;
      const r=Math.max(0.02, crownAt(0.03)*Math.abs(Math.cos(th))*0.94);
      push(Math.cos(th)*r, 0.02, Math.sin(th)*r);
    }

    S.n=N; S.hx=hx; S.hy=hy; S.hz=hz;
    S.sx=new Float32Array(N); S.sy=new Float32Array(N); S.sz=new Float32Array(N);
    S.fx=new Float32Array(N); S.fy=new Float32Array(N); S.fz=new Float32Array(N);
    S.orbiters=new Uint8Array(N);
    S.seed=new Float32Array(N);
    S.bright=new Float32Array(N);
    for(let k=0;k<N;k++){ S.seed[k]=Math.random()*1000; S.bright[k]=0.65+Math.random()*0.5; }

    // particle struct with mutable x,y,z
    S.P = new Array(N);
    for(let k=0;k<N;k++) S.P[k] = {x:hx[k], y:hy[k], z:hz[k]};

    pickOrbiters();
  }

  function pickOrbiters(){
    const want = Math.min(CFG.orbitCount, S.n);
    const set = new Set();
    while(set.size<want) set.add(Math.floor(Math.random()*S.n));
    S.orbitIdx = Array.from(set);
  }

  function scatter(){
    for(let i=0;i<S.n;i++){
      const dx=S.hx[i]+(Math.random()-0.5)*0.3;
      const dy=S.hy[i]-0.3+(Math.random()-0.5)*0.35;
      const dz=S.hz[i]+(Math.random()-0.5)*0.3;
      const len=Math.hypot(dx,dy,dz)||1;
      const mag=0.9+Math.random()*1.6;
      S.sx[i]=dx/len*mag;
      S.sy[i]=dy/len*mag*0.75-0.3;
      S.sz[i]=dz/len*mag;
    }
    // a subset glows warm (these later become the orbiting embers)
    const orbit = new Set(S.orbitIdx);
    for(let i=0;i<S.n;i++) S.orbiters[i]=0;
    for(const idx of orbit) S.orbiters[idx]=1;
  }

  // ------------------------------------------------------------ projection
  const tmp={x:0,y:0,d:1};
  function project(x,y,z){
    const s=S.spin, cs=Math.cos(s), sn=Math.sin(s);
    const rx=x*cs+z*sn, rz=-x*sn+z*cs;
    const tilt=0.40, ct=Math.cos(tilt), st=Math.sin(tilt);
    const ry=y*ct-rz*st, rz2=y*st+rz*ct;
    const d=1/(1+rz2*0.22);
    tmp.x=S.cx+rx*S.scale*d;
    tmp.y=S.cy+ry*S.scale*d;
    tmp.d=d;
    return tmp;
  }

  // ---------------------------------------------------------------- resize
  function resize(){
    const r=stage.getBoundingClientRect();
    S.dpr=Math.min(window.devicePixelRatio||1,2);
    S.w=Math.max(1,r.width); S.h=Math.max(1,r.height);
    canvas.width=Math.round(S.w*S.dpr);
    canvas.height=Math.round(S.h*S.dpr);
    ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
    S.cx=S.w*0.5; S.cy=S.h*0.5;
    S.scale=Math.min(S.w,S.h)*0.31;
    buildHat();
  }

  // ---------------------------------------------------------------- easing
  const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const easeOut =t=>1-Math.pow(1-t,3);

  // ---------------------------------------------------------------- update
  function update(dt){
    S.spinTarget = reduced.matches ? CFG.reducedSpin
                 : (S.dissolved ? CFG.slowSpin : CFG.spinSpeed);
    S.spin += (S.spinTarget - S.spin)*Math.min(1, dt*2.4);
    S.t += dt;

    const N=S.n, P=S.P;
    S.bobY = Math.sin(S.t*0.9)*0.012;

    if(S.mode==="rest"){
      for(let i=0;i<N;i++){
        const p=P[i];
        p.x=S.hx[i]; p.y=S.hy[i]+S.bobY; p.z=S.hz[i];
      }
    }
    else if(S.mode==="dissolving"){
      S.holdT+=dt;
      const k=Math.min(1,S.holdT/CFG.dissolveTime), e=easeInOut(k);
      for(let i=0;i<N;i++){
        const p=P[i];
        p.x=S.hx[i]+(S.sx[i]-S.hx[i])*e;
        p.y=S.hy[i]+S.bobY+(S.sy[i]-(S.hy[i]+S.bobY))*e;
        p.z=S.hz[i]+(S.sz[i]-S.hz[i])*e;
      }
      if(k>=1){ S.mode="scattered"; S.holdT=0; }
    }
    else if(S.mode==="scattered"){
      S.holdT+=dt;
      const tt=S.holdT;
      for(let i=0;i<N;i++){
        const p=P[i], sd=S.seed[i];
        const ang=tt*0.05;                      // gentle swirl
        const cx=S.sx[i], cz=S.sz[i];
        p.x=cx*Math.cos(ang)-cz*Math.sin(ang)+Math.sin(tt*1.5+sd)*0.02;
        p.z=cx*Math.sin(ang)+cz*Math.cos(ang)+Math.sin(tt*1.3+sd)*0.015;
        p.y=S.sy[i]+Math.sin(tt*1.1+sd)*0.03+tt*CFG.gravity*0.5;
      }
      if(tt>CFG.holdTime){
        S.mode="reforming"; S.holdT=0;
        for(let i=0;i<N;i++){ S.fx[i]=P[i].x; S.fy[i]=P[i].y; S.fz[i]=P[i].z; }
      }
    }
    else if(S.mode==="reforming"){
      S.holdT+=dt;
      const k=Math.min(1,S.holdT/CFG.reformTime), e=easeOut(k);
      for(let i=0;i<N;i++){
        const p=P[i];
        p.x=S.fx[i]+(S.hx[i]-S.fx[i])*e;
        p.y=S.fy[i]+((S.hy[i]+S.bobY)-S.fy[i])*e;
        p.z=S.fz[i]+(S.hz[i]-S.fz[i])*e;
      }
      if(k>=1){
        S.mode="rest"; S.holdT=0; S.dissolved=false;
        for(let i=0;i<N;i++) S.orbiters[i]=0;
        document.body.classList.remove("dissolving");
        hint.textContent = "Hover or tap to release the embers";
      }
    }
  }

  // ------------------------------------------------------------------ draw
  function draw(){
    ctx.clearRect(0,0,S.w,S.h);
    const N=S.n, P=S.P;
    const scattering = S.mode!=="rest";

    ctx.globalCompositeOperation="lighter";

    // pass 1 — glow halos
    for(let i=0;i<N;i++){
      const p=P[i];
      const o=project(p.x,p.y,p.z);
      const warm=S.orbiters[i]===1;
      let a = warm ? 0.85 : CFG.glowAlpha*(0.35+0.35*(0.5+0.5*Math.sin(S.seed[i])));
      if(scattering) a = (warm?0.9:CFG.glowAlpha)*(0.5+0.6*Math.random());
      const rad=CFG.glowSize*o.d*(warm?1.25:1);
      drawSprite(warm?SPR_WARM:SPR_RED, o.x, o.y, rad, a);
    }

    // pass 2 — bright cores
    for(let i=0;i<N;i++){
      const p=P[i];
      const o=project(p.x,p.y,p.z);
      const warm=S.orbiters[i]===1;
      let a = S.bright[i]*(warm?1:0.9);
      if(scattering) a = 0.7+0.4*Math.random();
      const r = CFG.size*o.d*(warm?1.5:1)*(0.6+(S.seed[i]%1)*0.7);
      const shade=0.5+0.5*o.d;
      // red core; warm embers lean orange
      if(warm){
        drawSprite(SPR_CORE, o.x, o.y, r*3, a*0.9);
      } else {
        ctx.globalAlpha=a*shade;
        ctx.fillStyle=`rgb(${Math.round(236*shade)},${Math.round(52*shade+20)},${Math.round(44*shade+18)})`;
        ctx.beginPath(); ctx.arc(o.x,o.y,r,0,Math.PI*2); ctx.fill();
      }
    }

    // orbiting embers with faint light trails (only while settled)
    if(!scattering && S.orbitIdx.length){
      const on=S.orbitIdx.length;
      for(let j=0;j<on;j++){
        const idx=S.orbitIdx[j]; if(idx>=N) continue;
        const ph=S.t*CFG.orbitSpeed+j*0.83;
        const rad=0.95+0.22*Math.sin(j*1.7);
        const o=project(Math.cos(ph)*rad, -0.22+0.34*Math.sin(ph*1.4+j), Math.sin(ph)*rad);
        // trail
        ctx.globalAlpha=1;
        ctx.strokeStyle="rgba(255,150,120,";
        ctx.lineCap="round";
        let prevX=o.x, prevY=o.y, prevD=o.d;
        for(let k=1;k<=7;k++){
          const ph2=ph-k*0.03;
          const t2=project(Math.cos(ph2)*rad, -0.22+0.34*Math.sin(ph2*1.4+j), Math.sin(ph2)*rad);
          const a=(1-k/8)*0.18;
          ctx.globalAlpha=1;
          ctx.strokeStyle=`rgba(255,150,120,${a})`;
          ctx.lineWidth=1.7*(1-k/8)*prevD;
          ctx.beginPath(); ctx.moveTo(prevX,prevY); ctx.lineTo(t2.x,t2.y); ctx.stroke();
          prevX=t2.x; prevY=t2.y; prevD=t2.d;
        }
        drawSprite(SPR_WARM, o.x, o.y, 9*o.d, 0.6);
        drawSprite(SPR_CORE, o.x, o.y, 2*o.d, 0.95);
      }
    }

    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=1;
  }

  // ---------------------------------------------------------------- loop
  let last=performance.now();
  function frame(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // --------------------------------------------------------- interaction
  function release(){
    if(reduced.matches){
      S.spinTarget=CFG.reducedSpin;   // gentle: no dissolve under reduced motion
      return;
    }
    if(S.dissolved || S.mode!=="rest") return;
    S.dissolved=true;
    S.mode="dissolving"; S.holdT=0;
    scatter();
    document.body.classList.add("dissolving");
    hint.textContent="The embers drift…";
  }

  stage.addEventListener("pointerenter", release);
  stage.addEventListener("pointerdown", release);
  stage.addEventListener("keydown", e=>{
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); release(); }
  });

  // ----------------------------------------------------------------- init
  function init(){
    resize();
    if(reduced.matches){
      S.spinTarget=CFG.reducedSpin;
      S.spin=CFG.reducedSpin;
      hint.textContent="Motion reduced";
    }
    requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener("resize", ()=>{
    clearTimeout(rt);
    rt=setTimeout(()=>{ resize(); }, 120);
  });

  init();
})();
</script>
</body>
</html>
