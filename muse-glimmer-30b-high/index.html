<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Red Fedora • Dark Hero</title>
<style>
  :root{
    --bg:#050507;
    --fg:#e8e8ec;
    --accent:#e53e3e;
    --accent-glow:rgba(229,62,62,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 50% 30%,#0f0f14 0%,#07070b 40%,#000 100%);
    color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
    display:grid;
    place-items:center;
    overflow:hidden;
  }
  .scene{
    position:relative;
    width:min(92vw,720px);
    height:min(92vh,720px);
    display:grid;
    place-items:center;
  }
  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
  }
  .hat-wrap{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    perspective:1200px;
  }
  .hat{
    width:320px;
    height:320px;
    transform-style:preserve-3d;
    transform:rotateX(18deg) rotateY(var(--angle,0deg));
    transition:opacity .6s ease;
    will-change:transform,opacity;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.65)) drop-shadow(0 0 40px var(--accent-glow));
  }
  .hat svg{
    width:100%;
    height:100%;
    display:block;
  }
  .caption{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(12px,1.6vw,16px);
    letter-spacing:.18em;
    text-transform:uppercase;
    opacity:.7;
    pointer-events:none;
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){
    .hat{animation:none !important}
  }
</style>
</head>
<body>
<div class="scene">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hat-wrap" id="wrap">
      <div class="hat" id="hat">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <defs>
            <radialGradient id="g" cx="50%" cy="40%">
              <stop offset="0%" stop-color="#ff6b6b"/>
              <stop offset="60%" stop-color="#c41e3a"/>
              <stop offset="100%" stop-color="#7a0f1a"/>
            </radialGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- brim -->
          <ellipse cx="150" cy="190" rx="120" ry="38" fill="url(#g)" filter="url(#glow)"/>
          <!-- crown -->
          <ellipse cx="150" cy="125" rx="58" ry="72" fill="url(#g)" filter="url(#glow)"/>
          <!-- subtle indent -->
          <ellipse cx="150" cy="85" rx="28" ry="18" fill="#000" opacity=".25"/>
        </svg>
      </div>
    </div>
    <p class="caption">Red Hat Fedora — hover to dissolve</p>
  </div>
</div>
<script>
(() => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:true });
  const hat = document.getElementById('hat');
  const wrap = document.getElementById('wrap');

  let w = 0, h = 0, cx = 0, cy = 0;
  function resize(){
    w = canvas.width = canvas.offsetWidth * devicePixelRatio;
    h = canvas.height = canvas.offsetHeight * devicePixelRatio;
    canvas.style.width = canvas.offsetWidth+'px';
    canvas.style.height = canvas.offsetHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    cx = canvas.offsetWidth/2;
    cy = canvas.offsetHeight/2;
  }
  new ResizeObserver(resize).observe(document.querySelector('.stage'));
  resize();

  // generate hat points in local space
  const COUNT = 1800;
  const points = [];
  for(let i=0;i<COUNT;i++){
    const isBrim = Math.random()<0.62;
    if(isBrim){
      const rx=110, ry=34, offY=32;
      const r=Math.sqrt(Math.random());
      const t=Math.random()*Math.PI*2;
      points.push({
        lx: rx*r*Math.cos(t),
        ly: ry*r*Math.sin(t)+offY,
        isOrbiter: Math.random()<0.035
      });
    }else{
      const rx=58, ry=70, offY=-18;
      const r=Math.sqrt(Math.random());
      const t=Math.random()*Math.PI*2;
      points.push({
        lx: rx*r*Math.cos(t),
        ly: ry*r*Math.sin(t)+offY,
        isOrbiter: Math.random()<0.035
      });
    }
  }

  let angleDeg = 0;
  let paused = false;
  let state = 'idle'; // idle | dissolve | reform | orbit
  let stateStart = 0;
  const DISSOLVE = 900;
  const HOLD = 600;
  const REFORM = 1000;

  // per particle runtime
  points.forEach(p=>{
    p.baseX=0; p.baseY=0;
    p.x=0; p.y=0;
    p.angle0=0; p.dist0=0;
    p.offsetR=60+Math.random()*140;
    p.swirlOff=Math.random()*Math.PI*2;
  });

  function projectLocal(p, angRad){
    const c=Math.cos(angRad), s=Math.sin(angRad);
    const x = p.lx*c - p.ly*s;
    const y = p.lx*s + p.ly*c;
    // gentle perspective squash
    const scale = 1;
    return {x: cx + x*scale, y: cy + y*scale};
  }

  function startDissolve(){
    if(reduced || state!=='idle') return;
    paused = true;
    state = 'dissolve';
    stateStart = performance.now();
    hat.style.opacity = '0';
    const angRad = angleDeg*Math.PI/180;
    for(const p of points){
      const pr = projectLocal(p, angRad);
      p.baseX = pr.x;
      p.baseY = pr.y;
      p.x = pr.x;
      p.y = pr.y;
      p.angle0 = Math.atan2(p.y - cy, p.x - cx);
      p.dist0 = Math.hypot(p.x - cx, p.y - cy);
    }
  }

  let last = performance.now();
  function loop(now){
    const dt = now - last;
    last = now;
    if(!paused && !reduced){
      angleDeg += dt*0.025;
      hat.style.setProperty('--angle', angleDeg.toFixed(2)+'deg');
    }
    // clear
    ctx.clearRect(0,0,canvas.offsetWidth,canvas.offsetHeight);
    if(state!=='idle'){
      const elapsed = now - stateStart;
      // draw particles
      ctx.lineCap='round';
      for(const p of points){
        if(state==='dissolve'){
          const t = Math.min(1, elapsed/DISSOLVE);
          const e = 1 - Math.pow(1-t,3);
          const sw = Math.sin(now*0.003 + p.swirlOff)*0.45;
          const ang = p.angle0 + sw*e;
          const rad = p.dist0 + p.offsetR*e;
          p.x = cx + Math.cos(ang)*rad;
          p.y = cy + Math.sin(ang)*rad;
          if(t>=1){
            state='hold';
            stateStart=now;
            for(const q of points){ q.startX=q.x; q.startY=q.y; }
          }
        } else if(state==='hold'){
          const sw = Math.sin(now*0.0025 + p.swirlOff)*0.35;
          const ang = p.angle0 + sw;
          const rad = p.dist0 + p.offsetR*(0.85+0.15*Math.sin(now*0.001));
          p.x = cx + Math.cos(ang)*rad;
          p.y = cy + Math.sin(ang)*rad;
          if(elapsed>HOLD){
            state='reform';
            stateStart=now;
          }
        } else if(state==='reform'){
          const t = Math.min(1, elapsed/REFORM);
          const e = t*t*(3-2*t);
          p.x += (p.baseX - p.x)*0.12;
          p.y += (p.baseY - p.y)*0.12;
          // ease towards base
          // small swirl damp
          if(t>=1){
            state='orbit';
            stateStart=now;
            hat.style.opacity = '1';
            // resume spin after short pause
            setTimeout(()=>{paused=false;}, 400);
          }
        } else if(state==='orbit'){
          if(p.isOrbiter){
            const oa = now*0.0006 + p.swirlOff;
            const or = 14 + Math.sin(now*0.0012 + p.swirlOff)*8;
            p.x = p.baseX + Math.cos(oa)*or;
            p.y = p.baseY + Math.sin(oa)*or;
          }else{
            p.x += Math.sin(now*0.001 + p.swirlOff)*0.02;
            p.y += Math.cos(now*0.001 + p.swirlOff)*0.02;
          }
        }
        // draw
        const alpha = state==='orbit' && !p.isOrbiter ? 0.35 : 0.9;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.isOrbiter?1.8:1.4, 0, Math.PI*2);
        ctx.fillStyle = `rgba(229,62,62,${alpha})`;
        ctx.shadowColor = '#ff6b6b';
        ctx.shadowBlur = 8;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  const onEnter = (e)=>{
    if(e.pointerType==='mouse' || e.pointerType==='pen'){
      startDissolve();
    }
  };
  const onTap = (e)=>{
    if(e.pointerType==='touch'){
      startDissolve();
    }
  };
  wrap.addEventListener('pointerenter', onEnter);
  wrap.addEventListener('pointerdown', onTap);

  // reset on leave for quick re-trigger
  wrap.addEventListener('pointerleave', ()=>{
    // allow retrigger after animation finishes
    if(state==='idle') return;
    // keep animation running to completion
  });
})();
</script>
</body>
</html>
