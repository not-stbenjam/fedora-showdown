<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fedora — Particles</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden;background:#05070b}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.scene{position:relative;display:grid;place-items:center;min-height:100svh;isolation:isolate;background:
 radial-gradient(ellipse at 50% 38%,#16202d 0,#0d141e 30%,#070a10 66%,#030406 100%)}
.scene:before{content:"";position:absolute;inset:0;opacity:.28;background-image:
 linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000,transparent 72%)}
.stage{position:relative;width:min(90vw,760px);height:min(78svh,620px);display:grid;place-items:center}
.halo{position:absolute;width:min(68vw,480px);height:min(38vw,260px);border-radius:50%;background:#85b8e820;filter:blur(55px);transform:translateY(10%);z-index:-1}
.hat-wrap{position:relative;width:min(76vw,540px);height:min(56vw,370px);perspective:1000px;cursor:pointer;touch-action:manipulation}
.hat{position:absolute;inset:0;transform-style:preserve-3d;animation:turn 13s linear infinite;transition:transform 1.2s cubic-bezier(.2,.8,.2,1),filter 1s}
.hat-wrap:hover .hat,.hat-wrap:focus-visible .hat{animation-duration:30s;filter:brightness(1.12)}
.crown{position:absolute;left:22%;top:8%;width:56%;height:64%;border-radius:46% 46% 25% 25% / 34% 34% 16% 16%;background:
 radial-gradient(ellipse at 50% 20%,#3f5668 0,#1f2d3a 27%,#111a24 67%,#080d14 100%);
 box-shadow:inset 14px 13px 20px #a9d4ed18,inset -20px -22px 28px #000b,0 24px 30px #000b;transform:translateZ(12px);overflow:hidden}
.crown:after{content:"";position:absolute;left:8%;right:8%;top:15%;height:28%;border-radius:50%;background:radial-gradient(ellipse,#b9ddf517,transparent 70%);filter:blur(4px)}
.band{position:absolute;left:16%;top:51%;width:68%;height:14%;border-radius:50%;background:linear-gradient(180deg,#101923,#070b10 52%,#1c2d3b);box-shadow:0 4px 7px #0008;transform:translateZ(22px)}
.band:after{content:"";position:absolute;right:12%;top:-2%;width:17%;height:108%;border-left:1px solid #a8d2ed35;border-right:1px solid #0008}
.brim{position:absolute;left:4%;top:56%;width:92%;height:37%;border-radius:50% 50% 46% 46% / 42% 42% 58% 58%;background:
 radial-gradient(ellipse at 50% 30%,#344b5c 0,#182632 31%,#0b121a 66%,#05080c 100%);
 box-shadow:inset 0 12px 16px #9bc5df16,inset 0 -14px 25px #000b,0 25px 30px #000b;transform:rotateX(9deg) translateZ(2px)}
.brim:after{content:"";position:absolute;inset:12% 8%;border-radius:50%;border-top:1px solid #a8d2ed18;filter:blur(1px)}
.emitter{position:absolute;inset:-8%;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.caption{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);color:#9cabb9;font-size:clamp(.7rem,1.5vw,.84rem);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 15px #000;opacity:.86}
@keyframes turn{from{transform:rotateY(0deg) rotateX(2deg)}to{transform:rotateY(360deg) rotateX(2deg)}}
@media(prefers-reduced-motion:reduce){
 .hat{animation:none}.hat-wrap:hover .hat,.hat-wrap:focus-visible .hat{animation:none}
}
</style>
</head>
<body>
<main class="scene">
  <div class="stage">
    <div class="halo"></div>
    <div class="hat-wrap" tabindex="0" role="button" aria-label="Activate the glowing particle effect">
      <div class="hat" aria-hidden="true">
        <div class="crown"></div><div class="band"></div><div class="brim"></div>
      </div>
      <div class="emitter"><canvas></canvas></div>
    </div>
    <div class="caption">Hover or tap to awaken the light</div>
  </div>
</main>
<script>
const wrap=document.querySelector('.hat-wrap'),hat=document.querySelector('.hat'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let W,H,dpr,particles=[],active=false,entered=false,raf=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!particles.length)init()}
function init(){particles=[];for(let i=0;i<2600;i++){let a=Math.random()*Math.PI*2,r=Math.random(),x=(.1+.8*r)*W,y=(.34+.27*Math.random())*H;if(Math.random()<.62){x=W*(.18+.64*Math.random());y=H*(.2+.55*Math.random())}particles.push({x,y,ox:x,oy:y,vx:0,vy:0,life:Math.random(),seed:Math.random()*99,size:.45+Math.random()*1.2})}}
function explode(){if(reduced)return;active=true;entered=true}
function animate(t=0){ctx.clearRect(0,0,W,H);for(const p of particles){let dx=p.ox-W/2,dy=p.oy-H*.48,spread=active?1:0;let targetX=p.ox+dx*.24*spread+Math.sin(t*.001+p.seed)*18*spread,targetY=p.oy+dy*.18*spread+Math.cos(t*.0012+p.seed)*14*spread;if(active&&p.life<.12){targetX=W/2+Math.cos(t*.0007+p.seed)*Math.min(W,H)*.38;targetY=H*.48+Math.sin(t*.0009+p.seed)*Math.min(W,H)*.3}
p.vx+=(targetX-p.x)*.006-p.vx*.035;p.vy+=(targetY-p.y)*.006-p.vy*.035;p.x+=p.vx;p.y+=p.vy;
let alpha=.16+.5*(.5+.5*Math.sin(t*.003+p.seed));ctx.fillStyle=`rgba(143,207,255,${alpha})`;ctx.shadowBlur=active?8:5;ctx.shadowColor='#8bd4ff';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}
if(active){hat.style.opacity='.08';setTimeout(()=>{active=false;hat.style.opacity='1'},2200)}
raf=requestAnimationFrame(animate)}
wrap.addEventListener('mouseenter',explode);wrap.addEventListener('focus',explode);wrap.addEventListener('touchstart',explode,{passive:true});wrap.addEventListener('click',explode);addEventListener('resize',resize);resize();animate();
</script>
</body>
</html>
