<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Red Hat Fedora</title>
<style>
  html,body{margin:0;height:100%;background:#070709;color:#e8e8e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(1200px 800px at 50% 30%,#14151b 0%,#070709 60%,#050506 100%);}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
  .caption{position:relative;z-index:2;pointer-events:none;margin-top:22vh;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;mix-blend-mode:soft-light}
  @media (prefers-reduced-motion:reduce){.caption{opacity:.45}}
</style>
</head>
<body>
<div class="hero">
  <canvas id="c"></canvas>
  <div class="caption">Hover or tap to dissolve</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w=0,h=0,cx=0,cy=0;
  function resize(){
    const dpr = window.devicePixelRatio||1;
    w = innerWidth; h = innerHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx = w*0.5; cy = h*0.5 - 40;
  }
  addEventListener('resize', resize); resize();

  const f = 520, camDist = 320;
  const brimR = 100, crownR = 46, crownH = 72;

  const particles = [];
  function makeParticles(){
    const arr=[];
    const push = (x,y,z,orbitChance=0)=>{
      const p={base:{x,y,z},pos:{x,y,z},vel:{x:0,y:0,z:0},orbit:false,orbitPhase:Math.random()*Math.PI*2};
      if(Math.random()<orbitChance) p.orbit=true;
      arr.push(p);
    };
    // brim band
    for(let i=0;i<900;i++){
      const t=Math.random()*Math.PI*2;
      const r=brimR*(0.92+Math.random()*0.12);
      const y=(Math.random()-0.5)*7;
      const zr=(Math.random()-0.5)*6;
      push(Math.cos(t)*r, y, Math.sin(t)*r + zr, 0.02);
    }
    // crown sides
    for(let i=0;i<1100;i++){
      const t=Math.random()*Math.PI*2;
      const r=crownR*(0.85+Math.random()*0.2);
      const y=Math.random()*crownH;
      push(Math.cos(t)*r, y, Math.sin(t)*r, 0.02);
    }
    // crown top
    for(let i=0;i<300;i++){
      const t=Math.random()*Math.PI*2;
      const r=Math.random()*crownR*0.6;
      push(Math.cos(t)*r, crownH+ (Math.random()-0.5)*4, Math.sin(t)*r, 0.02);
    }
    return arr;
  }
  const pts = makeParticles();

  let angle=0;
  let angularVel = prefersReduced?0:0.65;
  let dissolving=false;
  let startTime=0;

  function trigger(){
    if(prefersReduced || dissolving) return;
    dissolving=true;
    startTime=performance.now();
    angularVel = 0.25;
    for(const p of pts){
      if(p.orbit) continue;
      const bx=p.base.x, by=p.base.y, bz=p.base.z;
      const len=Math.hypot(bx,by,bz)||1;
      const nx=bx/len, ny=by/len, nz=bz/len;
      const speed=28+Math.random()*52;
      const j=Math.random()*0.5-0.25;
      p.vel.x = nx*speed + (Math.random()-0.5)*22;
      p.vel.y = ny*speed*0.6 + (Math.random()-0.5)*18 + 10;
      p.vel.z = nz*speed + (Math.random()-0.5)*22;
    }
  }

  canvas.addEventListener('pointerenter', trigger);
  canvas.addEventListener('pointerdown', trigger);

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.033,(now-last)/1000); last=now;

    // update
    if(!prefersReduced){
      if(dissolving){
        const t=now-startTime;
        if(t<1800){
          // disperse
          for(const p of pts){
            if(p.orbit) continue;
            p.pos.x += p.vel.x*dt;
            p.pos.y += p.vel.y*dt;
            p.pos.z += p.vel.z*dt;
            p.vel.x*=0.985; p.vel.y*=0.985; p.vel.z*=0.985;
            p.vel.x += (Math.random()-0.5)*2;
            p.vel.z += (Math.random()-0.5)*2;
          }
        }else if(t<3200){
          for(const p of pts){
            if(p.orbit) continue;
            p.pos.x += p.vel.x*dt*0.4;
            p.pos.y += p.vel.y*dt*0.4;
            p.pos.z += p.vel.z*dt*0.4;
          }
        }else if(t<5000){
          const spring=3.2;
          for(const p of pts){
            const dx=p.base.x-p.pos.x;
            const dy=p.base.y-p.pos.y;
            const dz=p.base.z-p.pos.z;
            p.pos.x += dx*spring*dt;
            p.pos.y += dy*spring*dt;
            p.pos.z += dz*spring*dt;
          }
        }else{
          dissolving=false;
          angularVel=0.65;
        }
        angularVel *= 0.996;
      }else{
        angularVel += (0.65 - angularVel)*0.02;
      }
      angle += angularVel*dt;
    }

    // orbiters after reform
    if(!dissolving || performance.now()-startTime>5000){
      for(const p of pts){
        if(!p.orbit) continue;
        p.orbitPhase += dt*0.7;
        const rad=18+Math.sin(p.orbitPhase*0.3)*4;
        const ox=Math.cos(p.orbitPhase)*rad;
        const oz=Math.sin(p.orbitPhase)*rad;
        const bx=p.base.x, by=p.base.y, bz=p.base.z;
        const dx=bx-p.pos.x, dy=by-p.pos.y, dz=bz-p.pos.z;
        p.pos.x = bx + dx*0.15 + ox;
        p.pos.y = by + dy*0.15 + Math.sin(p.orbitPhase*1.3)*2;
        p.pos.z = bz + dz*0.15 + oz;
      }
    }

    // render
    ctx.clearRect(0,0,w,h);
    // vignette
    const g=ctx.createRadialGradient(cx,cy,100,cx,cy,Math.max(w,h)*0.7);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    // soft shadow
    ctx.save();
    ctx.globalAlpha=0.18;
    ctx.fillStyle='#ff6a4a';
    ctx.beginPath();
    ctx.ellipse(cx, cy+130, 140, 28, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    const cosY=Math.cos(angle), sinY=Math.sin(angle);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.shadowColor='rgba(255,110,80,0.35)';
    ctx.shadowBlur=14;
    for(const p of pts){
      const x=p.pos.x*cosY + p.pos.z*sinY;
      const z=-p.pos.x*sinY + p.pos.z*cosY;
      const y=p.pos.y;
      const scale=f/(f+z+camDist);
      if(scale<=0.01) continue;
      const sx=x*scale*0.9;
      const sy=y*scale*0.9;
      const s=Math.max(1,1.8*scale);
      ctx.beginPath();
      ctx.arc(sx,sy,s,0,Math.PI*2);
      ctx.fillStyle='rgba(255,130,100,'+(0.6+0.4*scale)+')';
      ctx.fill();
    }
    ctx.restore();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
