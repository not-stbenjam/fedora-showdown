<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ember Fedora — one-file hero</title>
<style>
  :root{
    --red:#e3282f;
    --ink:#f2f1f5;
    --mut:#9b9aa4;
    --dim:#5c5b66;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    color:var(--ink);
    background:#060609;
    background:
      radial-gradient(120vmax 85vmax at 50% 36%, #16161e 0%, #0c0c12 46%, #060609 100%);
    font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    position:fixed; inset:0;
    outline:none;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    cursor:default;
  }
  .stage.arm{cursor:pointer}
  .stage:focus-visible{box-shadow:inset 0 0 0 1px rgba(227,40,47,.4)}
  #scene{position:absolute; inset:0; width:100%; height:100%; display:block}
  .copy{
    position:absolute; left:50%; top:73%;
    transform:translate(-50%,-50%);
    width:min(92vw,600px);
    text-align:center;
    pointer-events:none;
    animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .15s both;
  }
  .copy h1{
    margin:0;
    font-size:clamp(14px, .8vmin + 10px, 19px);
    font-weight:600;
    letter-spacing:.42em; text-indent:.42em;
    text-transform:uppercase;
    color:#e9e8ee;
  }
  .copy .rule{
    width:36px; height:1px; margin:12px auto;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
  }
  .copy p{
    margin:0;
    color:var(--mut);
    font-size:clamp(12px, .7vmin + 9px, 14px);
    line-height:1.65;
    letter-spacing:.04em;
  }
  .copy .hint{
    margin-top:12px;
    color:var(--dim);
    font-size:10px;
    letter-spacing:.3em; text-indent:.3em;
    text-transform:uppercase;
  }
  @keyframes rise{
    from{opacity:0; transform:translate(-50%, calc(-50% + 16px))}
    to  {opacity:1; transform:translate(-50%, -50%)}
  }
  .fallback{
    position:absolute; left:50%; top:43%;
    transform:translate(-50%,-50%);
    width:min(58vmin, 420px);
    display:none;
    text-align:center;
  }
  .fallback.on{display:block}
  .fallback svg{width:100%; height:auto; display:block; filter:drop-shadow(0 26px 30px rgba(0,0,0,.55))}
  .fallback .msg{margin-top:14px; color:var(--dim); font-size:11px; letter-spacing:.24em; text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){
    .copy{animation:none}
  }
  @media (max-width:640px){ .copy{top:76%} }
  @media (max-height:560px){ .copy{top:81%} .copy .hint{margin-top:6px} }
</style>
</head>
<body>
  <div class="stage" id="stage" tabindex="0" role="button"
       aria-label="Fedora emblem. Press Enter or Space to watch it dissolve into embers and reform.">
    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="fallback" id="fallback" aria-hidden="true">
      <svg viewBox="0 0 220 150">
        <defs>
          <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2413c"/><stop offset="1" stop-color="#8c0b12"/>
          </linearGradient>
          <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c22026"/><stop offset="1" stop-color="#6f080e"/>
          </linearGradient>
        </defs>
        <ellipse cx="110" cy="104" rx="96" ry="22" fill="#57060b"/>
        <ellipse cx="110" cy="100" rx="96" ry="22" fill="url(#gb)"/>
        <path d="M66 100 C64 72 72 46 84 40 C94 34 126 34 136 40 C148 46 156 72 154 100 C140 108 80 108 66 100 Z" fill="url(#gc)"/>
        <path d="M84 40 C92 45 128 45 136 40 C126 33 94 33 84 40 Z" fill="#4a0408" opacity=".4"/>
        <path d="M67 88 C90 96 130 96 153 88 L154 100 C140 108 80 108 66 100 Z" fill="#2d0406" opacity=".92"/>
        <ellipse cx="95" cy="62" rx="9" ry="21" fill="#ffffff" opacity=".07" transform="rotate(-14 95 62)"/>
      </svg>
      <div class="msg">static emblem — webgl unavailable</div>
    </div>

    <div class="copy">
      <h1>The Ember Fedora</h1>
      <div class="rule"></div>
      <p id="caption">Hover or tap the hat — it slow-spins, drifts apart into thousands of glowing embers, then finds its way back together.</p>
      <div class="hint" id="hint">hands on glass · no libraries attached</div>
    </div>
  </div>

<script id="app">
(function(){
"use strict";

/* ---------- prefers-reduced-motion ---------- */
var rmq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
var rm  = !!rmq.matches;
if (rmq.addEventListener) rmq.addEventListener("change", function(e){ setRM(e.matches); });
else if (rmq.addListener) rmq.addListener(function(e){ setRM(e.matches); });

var captionEl = document.getElementById("caption");
var hintEl    = document.getElementById("hint");
function setRM(v){
  rm = v;
  document.body.classList.toggle("rm", v);
  if (v){
    hintEl.textContent = "motion reduced · enjoying the still";
    captionEl.textContent = "A red fedora, quietly at rest. (Your system asked for reduced motion.)";
  } else {
    hintEl.textContent = "hands on glass · no libraries attached";
    captionEl.textContent = "Hover or tap the hat — it slow-spins, drifts apart into thousands of glowing embers, then finds its way back together.";
  }
}
if (rm) setRM(true);

/* ---------- tiny math ---------- */
function persp(fov, asp, n, f){
  var t = 1/Math.tan(fov/2), m = new Float32Array(16);
  m[0]=t/asp; m[5]=t; m[10]=(f+n)/(n-f); m[11]=-1; m[14]=2*f*n/(n-f);
  return m;
}
function lookAt(ex,ey,ez, tx,ty,tz){
  var fx=tx-ex, fy=ty-ey, fz=tz-ez, fl=Math.hypot(fx,fy,fz);
  fx/=fl; fy/=fl; fz/=fl;
  var sx=fy*0 - fz*1, sy=fz*0 - fx*0, sz=fx*1 - fy*0; // cross(f, up=(0,1,0))
  var sl=Math.hypot(sx,sy,sz); sx/=sl; sy/=sl; sz/=sl;
  var ux=sy*fz - sz*fy, uy=sz*fx - sx*fz, uz=sx*fy - sy*fx;
  var m = new Float32Array(16);
  m[0]=sx; m[1]=ux; m[2]=-fx;  m[3]=0;
  m[4]=sy; m[5]=uy; m[6]=-fy;  m[7]=0;
  m[8]=sz; m[9]=uz; m[10]=-fz; m[11]=0;
  m[12]=-(sx*ex+sy*ey+sz*ez);
  m[13]=-(ux*ex+uy*ey+uz*ez);
  m[14]=  (fx*ex+fy*ey+fz*ez);
  m[15]=1;
  return m;
}
function mul4(a,b){
  var o=new Float32Array(16);
  for(var c=0;c<4;c++)for(var r=0;r<4;r++){
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  }
  return o;
}
function xf(m,x,y,z){
  return [
    m[0]*x+m[4]*y+m[8]*z+m[12],
    m[1]*x+m[5]*y+m[9]*z+m[13],
    m[2]*x+m[6]*y+m[10]*z+m[14],
    m[3]*x+m[7]*y+m[11]*z+m[15]
  ];
}

/* ---------- deterministic random ---------- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* ---------- fedora geometry (surface of revolution) ---------- */
function buildKnots(){
  var K=[];
  function pushCurve(fn,steps,tilt){
    var pts=[],i,s,p;
    for(i=0;i<=steps;i++) pts.push(fn(i/steps));
    for(i=0;i<=steps;i++){
      p=pts[i];
      var dx,dy;
      if(i===0){dx=pts[1][0]-p[0]; dy=pts[1][1]-p[1];}
      else if(i===steps){dx=p[0]-pts[i-1][0]; dy=p[1]-pts[i-1][1];}
      else {dx=pts[i+1][0]-pts[i-1][0]; dy=pts[i+1][1]-pts[i-1][1];}
      var L=Math.hypot(dx,dy)||1;
      var nx=dy/L, ny=-dx/L;
      if(nx<0){nx=-nx; ny=-ny;}
      if(tilt){ // tilt normal inward (toward axis) — for brim underside
        var c=Math.cos(tilt), s2=Math.sin(tilt);
        var rx=nx*c - ny*s2, ry=nx*s2 + ny*c;
        nx=rx; ny=ry;
      }
      K.push({r:p[0], y:p[1], nx:nx, ny:ny});
    }
  }
  // crown dome (axis → shoulder)
  pushCurve(function(s){
    var th=s*Math.PI/2;
    return [0.55*Math.sin(th), 0.505+0.205*Math.cos(th)];
  },7,0);
  // crown side, slight outward flare into the brim
  pushCurve(function(s){
    return [0.55+0.075*Math.pow(s,1.3), 0.505-0.385*Math.pow(s,1.05)];
  },8,0);
  // brim top: gentle dip, then a lift at the edge
  pushCurve(function(s){
    var u=1-s;
    return [0.625+s*(1.42-0.625), u*u*0.125 + 2*u*s*0.068 + s*s*0.168];
  },9,0);
  // rounded brim edge
  pushCurve(function(s){
    var th=s*Math.PI/2;
    return [1.42+0.024*Math.sin(th), 0.115+0.053*Math.cos(th)];
  },4,0);
  // brim underside, tilted a touch so light reads under it
  pushCurve(function(s){
    var u=1-s;
    return [1.438-s*(1.438-0.625), u*u*0.105 + 2*u*s*0.02 + s*s*0.075];
  },9,0.16);
  // close the bottom
  pushCurve(function(s){
    return [0.625*(1-s), 0.075+0.028*s];
  },4,0.2);
  return K;
}

var SEG = 48;

function buildMeshClean(knots){
  var P=[],I=[], prev=null, prevSingle=false, k,j;
  function tri(a,b,c){
    var ax=P[a*3],ay=P[a*3+1],az=P[a*3+2];
    var e1x=P[b*3]-ax,e1y=P[b*3+1]-ay,e1z=P[b*3+2]-az;
    var e2x=P[c*3]-ax,e2y=P[c*3+1]-ay,e2z=P[c*3+2]-az;
    var nx=e1y*e2z-e1z*e2y, ny=e1z*e2x-e1x*e2z, nz=e1x*e2y-e1y*e2x;
    // reference: outward = away from axis, or upward near axis
    var dot = (Math.hypot(ax,az)>0.2) ? (nx*ax+nz*az) : ny;
    if(dot<0) I.push(a,c,b); else I.push(a,b,c);
  }
  for(k=0;k<knots.length;k++){
    var kn=knots[k];
    if(kn.r<1e-4){
      var vi=P.length/3;
      P.push(0,kn.y,0, kn.nx,kn.ny,0);
      if(prev!==null && !prevSingle){
        for(j=0;j<SEG;j++){
          tri(vi, prev+(j+1)%SEG, prev+j);
        }
      }
      prev=vi; prevSingle=true;
    } else {
      var base=P.length/3;
      for(j=0;j<SEG;j++){
        var ang=(j/SEG)*Math.PI*2;
        var c=Math.sin(ang), d=Math.cos(ang);
        P.push(kn.r*c, kn.y, kn.r*d, kn.nx*c, kn.ny, kn.nx*d);
      }
      if(prev!==null){
        if(prevSingle){
          for(j=0;j<SEG;j++) tri(prev, base+j, base+(j+1)%SEG);
        } else {
          for(j=0;j<SEG;j++){
            var p0=prev+j, p1=prev+(j+1)%SEG, c0=base+j, c1=base+(j+1)%SEG;
            tri(p0,c0,c1); tri(p0,c1,p1);
          }
        }
        prevSingle=false;
      }
      prev=base;
    }
  }
  return {
    verts:new Float32Array(P),
    idx:(P.length/3>65535)?new Uint32Array(I):new Uint16Array(I),
    big:(P.length/3>65535)
  };
}

function buildBand(){
  var knots=[], i;
  function pt(s){
    return { r:0.55+0.075*Math.pow(s,1.3)+0.014, y:0.505-0.385*Math.pow(s,1.05) };
  }
  var steps=3;
  for(i=0;i<=steps;i++){
    var s=0.62+(i/steps)*0.36;
    var p=pt(s);
    knots.push({r:p.r, y:p.y, nx:0.32, ny:0.05}); // mostly-radial normal
  }
  return buildMeshClean(knots);
}

/* ---------- shaders ---------- */
var VS_HAT = [
"precision highp float;",
"attribute vec3 aP; attribute vec3 aN;",
"uniform mat4 uVP;",
"uniform float uRotY; uniform float uBob;",
"varying vec3 vN; varying vec3 vW;",
"void main(){",
"  float c=cos(uRotY), s=sin(uRotY);",
"  vec3 w=vec3(c*aP.x+s*aP.z, aP.y+uBob, -s*aP.x+c*aP.z);",
"  vN=vec3(c*aN.x+s*aN.z, aN.y, -s*aN.x+c*aN.z);",
"  vW=w;",
"  gl_Position=uVP*vec4(w,1.0);",
"}"].join("\n");

var FS_HAT = [
"precision mediump float;",
"varying vec3 vN; varying vec3 vW;",
"uniform vec3 uEye; uniform float uFade; uniform float uBand; uniform float uGlow;",
"void main(){",
"  vec3 N=normalize(vN);",
"  vec3 V=normalize(uEye-vW);",
"  vec3 L1=normalize(vec3(0.45,0.85,0.5));                 // warm key",
"  vec3 L2=normalize(vec3(-0.7,0.3,0.35));                 // cool fill",
"  vec3 base=mix(vec3(0.80,0.07,0.09), vec3(0.13,0.012,0.017), uBand);",
"  base*=mix(0.5,1.0,smoothstep(-0.6,0.2,N.y));            // under-brim shade",
"  vec3 col=base*(vec3(1.0,0.96,0.9)*max(dot(N,L1),0.0)*1.15",
"               + vec3(0.5,0.58,0.8)*max(dot(N,L2),0.0)*0.35",
"               + vec3(0.16,0.05,0.05)*max(dot(N,vec3(0.0,-1.0,0.0)),0.0));",
"  vec3 H=normalize(L1+V);",
"  col+=vec3(1.0,0.95,0.9)*pow(max(dot(N,H),0.0),48.0)*0.38*(1.0-0.7*uBand);",
"  float fr=pow(1.0-max(dot(N,V),0.0),3.0);",
"  col+=vec3(1.0,0.5,0.38)*fr*0.32;",
"  col*=uGlow;",
"  col=col/(1.0+col*0.35);",
"  gl_FragColor=vec4(col,uFade);",
"}"].join("\n");

var VS_SHADOW = [
"precision highp float;",
"attribute vec2 aQ;",
"uniform mat4 uVP; uniform float uSc;",
"varying vec2 vUv;",
"void main(){",
"  vUv=aQ;",
"  vec3 w=vec3(aQ.x*1.95*uSc, -0.42, aQ.y*1.62*uSc);",
"  gl_Position=uVP*vec4(w,1.0);",
"}"].join("\n");

var FS_SHADOW = [
"precision mediump float;",
"varying vec2 vUv; uniform float uA;",
"void main(){",
"  float r=length(vUv);",
"  float a=uA*pow(max(0.0,1.0-r),1.7);",
"  gl_FragColor=vec4(0.0,0.0,0.0,a);",
"}"].join("\n");

var VS_PTS = [
"precision highp float;",
"attribute vec3 aHome; attribute vec4 aRnd;",
"uniform mat4 uVP;",
"uniform float uRotY; uniform float uBob; uniform float uMorph; uniform float uSwirlT; uniform float uPS;",
"varying vec3 vCol; varying float vA;",
"const float TAU=6.28318530718;",
"void main(){",
"  float d=aRnd.x*0.5;",
"  float p=smoothstep(d,d+0.5,uMorph);",
"  float r0=length(aHome.xz);",
"  float a0=atan(aHome.z,aHome.x);",
"  float ang=a0 + p*(0.9+aRnd.z*1.7) + p*uSwirlT*(0.35+0.5*aRnd.w);",
"  float rr=r0*(1.0+0.3*p) + p*(0.9+1.6*aRnd.y);",
"  vec3 q=vec3(cos(ang)*rr, 0.0, sin(ang)*rr);",
"  q.y=aHome.y + p*(0.18+0.95*aRnd.w) + p*p*0.45*(0.4+0.6*aRnd.y);",
"  q.y+=p*0.08*sin(uSwirlT*2.3+aRnd.y*TAU);",
"  q.x+=p*0.09*sin(uSwirlT*1.7+aRnd.x*TAU);",
"  q.z+=p*0.09*cos(uSwirlT*2.0+aRnd.z*TAU);",
"  float c=cos(uRotY), s=sin(uRotY);",
"  vec3 w=vec3(c*q.x+s*q.z, q.y+uBob, -s*q.x+c*q.z);",
"  gl_Position=uVP*vec4(w,1.0);",
"  float sz=(0.020+0.030*aRnd.w)*(0.55+0.8*p);",
"  gl_PointSize=max(1.0, sz*uPS/max(0.1,gl_Position.w));",
"  vA=p;",
"  vCol=mix(vec3(1.0,0.35,0.14), vec3(1.0,0.74,0.40), clamp(aRnd.y*aRnd.z*1.4,0.0,1.0));",
"}"].join("\n");

var VS_ORB = [
"precision highp float;",
"attribute vec4 aB; attribute vec4 aA;", // (radius, height, speed, phase) | (size, seed, k, spare)
"uniform mat4 uVP; uniform float uOT; uniform float uPS; uniform float uBob;",
"varying vec3 vCol; varying float vA;",
"const float TAU=6.28318530718;",
"void main(){",
"  float k=aA.z;",
"  float th=aB.w + uOT*aB.z - k*0.10*(1.0+aB.z*0.4);",
"  vec3 w=vec3(cos(th)*aB.x, aB.y+0.06*sin(uOT*0.6+aA.y*TAU)+uBob*0.5, sin(th)*aB.x);",
"  gl_Position=uVP*vec4(w,1.0);",
"  float sz=aA.x*(1.0-0.6*k);",
"  gl_PointSize=max(1.0, sz*uPS/max(0.1,gl_Position.w));",
"  vA=pow(1.0-k,2.2);",
"  vCol=mix(vec3(1.0,0.62,0.32), vec3(1.0,0.85,0.55), aA.y);",
"}"].join("\n");

var FS_PTS = [
"precision mediump float;",
"varying vec3 vCol; varying float vA;",
"void main(){",
"  vec2 c=gl_PointCoord*2.0-1.0;",
"  float r2=dot(c,c);",
"  if(r2>1.0) discard;",
"  float a=exp(-3.2*r2)*vA;",
"  vec3 col=vCol + vec3(0.55,0.42,0.30)*smoothstep(0.4,0.0,r2)*0.55;",
"  gl_FragColor=vec4(col*a, a);",
"}"].join("\n");

/* ---------- boot ---------- */
var canvas=document.getElementById("scene");
var stage=document.getElementById("stage");
var fallback=document.getElementById("fallback");

function showFallback(){
  canvas.style.display="none";
  fallback.classList.add("on");
  fallback.setAttribute("aria-hidden","false");
}

var gl=null;
try{
  gl=canvas.getContext("webgl",{alpha:true,antialias:true,premultipliedAlpha:true,powerPreference:"high-performance"})
    || canvas.getContext("experimental-webgl");
}catch(e){ gl=null; }
if(!gl){ showFallback(); return; }

var ext32=null;
try{ ext32=gl.getExtension("OES_element_index_uint"); }catch(e){}

function compile(type,src){
  var sh=gl.createShader(type);
  gl.shaderSource(sh,src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}
function program(vs,fs){
  var p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

var prHat, prShadow, prPts, prOrb;
try{
  prHat   = program(VS_HAT, FS_HAT);
  prShadow= program(VS_SHADOW, FS_SHADOW);
  prPts   = program(VS_PTS, FS_PTS);
  prOrb   = program(VS_ORB, FS_PTS);
}catch(e){ showFallback(); return; }

function U(p,n){ return gl.getUniformLocation(p,n); }
function A(p,n){ return gl.getAttribLocation(p,n); }

/* ---------- geometry → buffers ---------- */
var hat, band, hatCount, bandCount;
try{
  hat  = buildMeshClean(buildKnots());
  band = buildBand();
}catch(e){ showFallback(); return; }
if(hat.big && !ext32){ // rebuild with fewer segments
  SEG=32;
  try{ hat=buildMeshClean(buildKnots()); band=buildBand(); }catch(e2){ showFallback(); return; }
}
hatCount=hat.idx.length; bandCount=band.idx.length;

function makeBuf(data){
  var b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
  return b;
}
var bufHat=makeBuf(hat.verts), bufBand=makeBuf(band.verts);
var idxHat=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxHat);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,hat.idx,gl.STATIC_DRAW);
var idxBand=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBand);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,band.idx,gl.STATIC_DRAW);
var idxType = hat.big ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
var idxTypeB= band.big? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;

var bufShadow=makeBuf(new Float32Array([-1,-1, 1,-1, 1,1, -1,1]));
var idxShadow=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxShadow);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);

/* particles sampled from the hat surface */
var rng=mulberry32(20250425);
var NPTS=6500;
if((navigator.hardwareConcurrency||8)<=4) NPTS=4200;

var triArea=[], triVert=[];
(function(){
  var V=hat.verts, I=hat.idx, i;
  for(i=0;i<hatCount;i+=3){
    var a=I[i]*3,b=I[i+1]*3,c=I[i+2]*3;
    var abx=V[b]-V[a],aby=V[b+1]-V[a+1],abz=V[b+2]-V[a+2];
    var acx=V[c]-V[a],acy=V[c+1]-V[a+1],acz=V[c+2]-V[a+2];
    var cx=aby*acz-abz*acy, cy=abz*acx-abx*acz, cz=abx*acy-aby*acx;
    var ar=0.5*Math.hypot(cx,cy,cz);
    triArea.push(ar); triVert.push(i,i+1,i+2);
  }
})();
var cum=new Float32Array(triArea.length), tot=0;
for(var ti=0;ti<triArea.length;ti++){ tot+=triArea[ti]; cum[ti]=tot; }
function pickTri(){
  var t=rng()*tot, lo=0, hi=cum.length-1;
  while(lo<hi){ var mid=(lo+hi)>>1; if(cum[mid]<t) lo=mid+1; else hi=mid; }
  return lo;
}
var pts=new Float32Array(NPTS*7);
for(var pi=0;pi<NPTS;pi++){
  var t3=pickTri()*3;
  var ia=hat.idx[t3]*3, ib=hat.idx[t3+1]*3, ic=hat.idx[t3+2]*3;
  var r1=rng(), r2=rng();
  if(r1+r2>1){ r1=1-r1; r2=1-r2; }
  var w0=1-r1-r2;
  var px=hat.verts[ia]*w0+hat.verts[ib]*r1+hat.verts[ic]*r2;
  var py=hat.verts[ia+1]*w0+hat.verts[ib+1]*r1+hat.verts[ic+1]*r2;
  var pz=hat.verts[ia+2]*w0+hat.verts[ib+2]*r1+hat.verts[ic+2]*r2;
  var o=pi*7;
  pts[o]=px; pts[o+1]=py; pts[o+2]=pz;
  pts[o+3]=rng(); pts[o+4]=rng(); pts[o+5]=rng(); pts[o+6]=rng();
}
var bufPts=makeBuf(pts);
var drawN=NPTS; // adaptive quality may lower this

/* orbiting embers + trails */
var MORB=20, NORB=12;
var orb=new Float32Array(MORB*NORB*8);
(function(){
  var idx=0;
  for(var m=0;m<MORB;m++){
    var rad=1.75+rng()*1.0;
    var h=0.12+rng()*0.85;
    var sp=0.35+rng()*0.6;
    var ph=rng()*Math.PI*2;
    var sz=0.022+rng()*0.014;
    var seed=rng();
    for(var n=0;n<NORB;n++){
      orb[idx++]=rad; orb[idx++]=h; orb[idx++]=sp; orb[idx++]=ph;
      orb[idx++]=sz; orb[idx++]=seed; orb[idx++]=n/(NORB-1); orb[idx++]=0;
    }
  }
})();
var bufOrb=makeBuf(orb);

/* ---------- attribute / uniform locations ---------- */
var L={
  hat:{ aP:A(prHat,"aP"), aN:A(prHat,"aN"),
        uVP:U(prHat,"uVP"), uRotY:U(prHat,"uRotY"), uBob:U(prHat,"uBob"),
        uSquash:U(prHat,"uSquash"), uEye:U(prHat,"uEye"), uFade:U(prHat,"uFade"),
        uBand:U(prHat,"uBand"), uGlow:U(prHat,"uGlow") },
  sh:{ aQ:A(prShadow,"aQ"), uVP:U(prShadow,"uVP"), uSc:U(prShadow,"uSc"), uA:U(prShadow,"uA") },
  /* (hat uniforms listed above with no squash — kept simple) */
  pt:{ aHome:A(prPts,"aHome"), aRnd:A(prPts,"aRnd"),
       uVP:U(prPts,"uVP"), uRotY:U(prPts,"uRotY"), uBob:U(prPts,"uBob"),
       uMorph:U(prPts,"uMorph"), uSwirlT:U(prPts,"uSwirlT"), uPS:U(prPts,"uPS") },
  ob:{ aB:A(prOrb,"aB"), aA:A(prOrb,"aA"),
       uVP:U(prOrb,"uVP"), uOT:U(prOrb,"uOT"), uPS:U(prOrb,"uPS"), uBob:U(prOrb,"uBob") }
};

/* ---------- state ---------- */
var FOV=34*Math.PI/180;
var vp=new Float32Array(16);
var eye=[0,1.1,5.4];
var dist=5.4;
var uPS=1000;
var dpr=1;

var hatC=[0,0]; var hatR=120;
var mx=-9999,my=-9999, hover=false, armed=true;
var angle=0.6, speed=0.55, bob=0;
var phase=0, phT=0, morph=0, swirlT=0;
var orbA=0, orbT=0, tRun=0;
var last=performance.now();
var emaMs=16, emaN=0;

var DUR_OUT=0.9, DUR_HOLD=1.7, DUR_IN=1.05;

function easeInOut(t){ t=Math.min(1,Math.max(0,t)); return t*t*(3-2*t); }

function trigger(){
  if(rm || phase!==0) return;
  phase=1; phT=0; armed=false;
  stage.classList.remove("arm");
}

function setRM(v){
  rm=v;
  document.body.classList.toggle("rm",v);
  if(v){
    phase=0; morph=0; orbA=0;
    angle=0.62;
    hintEl.textContent="motion reduced · enjoying the still";
    captionEl.textContent="A red fedora, quietly at rest. (Your system asked for reduced motion.)";
  } else {
    hintEl.textContent="hands on glass · no libraries attached";
    captionEl.textContent="Hover or tap the hat — it slow-spins, drifts apart into thousands of glowing embers, then finds its way back together.";
  }
}

/* ---------- layout ---------- */
function resize(){
  dpr=Math.min(2, window.devicePixelRatio||1);
  var w=window.innerWidth, h=window.innerHeight;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
  var asp=w/h;
  dist=5.2/Math.max(0.34,Math.min(1,asp*0.78));
  dist=Math.min(dist,13.5);
  eye=[0,1.1,dist];
  vp=mul4(persp(FOV,asp,0.1,40), lookAt(eye[0],eye[1],eye[2], 0,0,0));
  uPS=(canvas.height)/(2*Math.tan(FOV/2))*1.05;
}
window.addEventListener("resize",resize);
resize();

/* ---------- input ---------- */
stage.addEventListener("pointermove",function(e){
  mx=e.clientX; my=e.clientY;
},{passive:true});
stage.addEventListener("pointerdown",function(e){
  mx=e.clientX; my=e.clientY;
  if(!rm) trigger();
},{passive:true});
stage.addEventListener("pointerleave",function(){ mx=my=-9999; hover=false; });
stage.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); trigger(); }
});

/* ---------- render loop ---------- */
gl.enable(gl.DEPTH_TEST);
gl.depthFunc(gl.LEQUAL);
gl.clearColor(0,0,0,0);

function project(x,y,z){
  var c=xf(vp,x,y,z);
  return [ (c[0]/c[3]*0.5+0.5)*window.innerWidth,
           (1-(c[1]/c[3]*0.5+0.5))*window.innerHeight ];
}

function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  tRun+=dt;

  /* adaptive particle budget */
  emaMs=emaMs*0.92+dt*1000*0.08;
  if(++emaN===90){
    emaN=0;
    if(emaMs>24 && drawN>3000) drawN=Math.max(3000,Math.floor(drawN*0.72));
  }

  /* hover hit-test around the projected hat */
  var pc=project(0,0.3+bob,0);
  var pe=project(1.45,0.05,0);
  var pe2=project(0,0.05,1.45);
  hatC=pc;
  hatR=Math.max(Math.abs(pe[0]-pc[0]),Math.abs(pe[1]-pc[1]),
                Math.abs(pe2[0]-pc[0]),Math.abs(pe[1]? pe2[1]-pc[1]:0))+26;
  hover=(mx>-9000) && (Math.hypot(mx-pc[0],my-pc[1])<hatR);
  var canPlay=!rm && phase===0;
  if(!hover && phase===0) armed=true;
  stage.classList.toggle("arm", hover && canPlay && armed);

  /* spin — slows while engaged or mid-cycle */
  var slow=(hover&&canPlay)||(phase!==0);
  var targetS=rm?0:(slow?0.13:0.5);
  speed+=(targetS-speed)*Math.min(1,dt*2.2);
  angle+=speed*dt;
  bob=rm?0:Math.sin(tRun*0.9)*0.045;

  /* ember timeline */
  if(phase===1){
    phT+=dt;
    morph=easeInOut(phT/DUR_OUT);
    if(phT>=DUR_OUT){ phase=2; phT=0; morph=1; }
  } else if(phase===2){
    phT+=dt; morph=1;
    if(phT>=DUR_HOLD){ phase=3; phT=0; }
  } else if(phase===3){
    phT+=dt;
    morph=1-easeInOut(phT/DUR_IN);
    if(phT>=DUR_IN){ phase=0; morph=0; armed=!hover; }
  }
  if(morph>0.03) swirlT+=dt*(0.5+0.55*morph);
  orbT=tRun;

  var orbTarget=(phase===0 && !rm)?1:0;
  orbA+=(orbTarget-orbA)*Math.min(1,dt*2.0);

  var hatFade=1-Math.min(1,Math.max(0,(morph-0.06)/0.38));
  var ptGlow=Math.min(1,morph*3.5);

  /* ---- draw ---- */
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  /* shadow blob */
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(prShadow);
  gl.uniformMatrix4fv(L.sh.uVP,false,vp);
  gl.uniform1f(L.sh.uSc, 1.0+morph*0.18);
  gl.uniform1f(L.sh.uA, 0.5*(1-0.4*morph)*hatFade+0.001);
  gl.bindBuffer(gl.ARRAY_BUFFER,bufShadow);
  gl.enableVertexAttribArray(L.sh.aQ);
  gl.vertexAttribPointer(L.sh.aQ,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxShadow);
  gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);
  gl.depthMask(true);

  /* fedora (crown+brim, then the band) */
  if(hatFade>0.004){
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(prHat);
    gl.uniformMatrix4fv(L.hat.uVP,false,vp);
    gl.uniform1f(L.hat.uRotY,angle);
    gl.uniform1f(L.hat.uBob,bob);
    gl.uniform1f(L.hat.uSquash,1.0);
    gl.uniform3f(L.hat.uEye,eye[0],eye[1],eye[2]);
    gl.uniform1f(L.hat.uFade,hatFade);
    gl.uniform1f(L.hat.uGlow,1.0+0.12*Math.sin(tRun*0.5));
    gl.enableVertexAttribArray(L.hat.aP);
    gl.enableVertexAttribArray(L.hat.aN);

    gl.bindBuffer(gl.ARRAY_BUFFER,bufHat);
    gl.vertexAttribPointer(L.hat.aP,3,gl.FLOAT,false,24,0);
    gl.vertexAttribPointer(L.hat.aN,3,gl.FLOAT,false,24,12);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxHat);
    gl.uniform1f(L.hat.uBand,0.0);
    gl.drawElements(gl.TRIANGLES,hatCount,idxType,0);

    gl.bindBuffer(gl.ARRAY_BUFFER,bufBand);
    gl.vertexAttribPointer(L.hat.aP,3,gl.FLOAT,false,24,0);
    gl.vertexAttribPointer(L.hat.aN,3,gl.FLOAT,false,24,12);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBand);
    gl.uniform1f(L.hat.uBand,1.0);
    gl.drawElements(gl.TRIANGLES,bandCount,idxTypeB,0);
    gl.disable(gl.CULL_FACE);
  }

  /* dissolving embers */
  if(morph>0.002 && !rm){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false);
    gl.useProgram(prPts);
    gl.uniformMatrix4fv(L.pt.uVP,false,vp);
    gl.uniform1f(L.pt.uRotY,angle);
    gl.uniform1f(L.pt.uBob,bob);
    gl.uniform1f(L.pt.uMorph,morph);
    gl.uniform1f(L.pt.uSwirlT,swirlT);
    gl.uniform1f(L.pt.uPS,uPS*(ptGlow>0?1:1));
    gl.bindBuffer(gl.ARRAY_BUFFER,bufPts);
    gl.enableVertexAttribArray(L.pt.aHome);
    gl.enableVertexAttribArray(L.pt.aRnd);
    gl.vertexAttribPointer(L.pt.aHome,3,gl.FLOAT,false,28,0);
    gl.vertexAttribPointer(L.pt.aRnd,4,gl.FLOAT,false,28,12);
    gl.drawArrays(gl.POINTS,0,Math.min(drawN,NPTS));
    gl.depthMask(true);
  }

  /* orbiting embers with light trails */
  if(orbA>0.01 && !rm){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false);
    gl.useProgram(prOrb);
    gl.uniformMatrix4fv(L.ob.uVP,false,vp);
    gl.uniform1f(L.ob.uOT,orbT);
    gl.uniform1f(L.ob.uPS,uPS);
    gl.uniform1f(L.ob.uBob,bob);
    gl.bindBuffer(gl.ARRAY_BUFFER,bufOrb);
    gl.enableVertexAttribArray(L.ob.aB);
    gl.enableVertexAttribArray(L.ob.aA);
    gl.vertexAttribPointer(L.ob.aB,4,gl.FLOAT,false,32,0);
    gl.vertexAttribPointer(L.ob.aA,4,gl.FLOAT,false,32,16);
    gl.drawArrays(gl.POINTS,0,MORB*NORB);
    gl.depthMask(true);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(function(t){ last=t; requestAnimationFrame(frame); });

})();
</script>
</body>
</html>
