<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Hat Fedora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-red: #CC0000;
            --dark-bg: #0a0a0a;
            --darker-bg: #050505;
            --glow-color: rgba(204, 0, 0, 0.6);
            --particle-glow: rgba(204, 0, 0, 0.8);
            --text-color: #ffffff;
            --caption-color: rgba(255, 255, 255, 0.8);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        
        .canvas-container {
            width: 300px;
            height: 300px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .canvas-container:hover {
            transform: scale(1.05);
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .caption {
            margin-top: 2rem;
            font-size: 1.2rem;
            color: var(--caption-color);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        /* Background particles */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        /* Floating animation for particles */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--particle-glow);
            box-shadow: 0 0 10px var(--particle-glow), 0 0 20px var(--particle-grow);
            animation: float 10s infinite;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="canvas-container" id="hatContainer">
            <canvas id="hatCanvas"></canvas>
        </div>
        <div class="caption">Red Hat Fedora</div>
    </div>
    
    <div class="bg-particles" id="bgParticles"></div>
    
    <script>
        // Configuration
        const config = {
            speed: 0.002,
            reducedSpeed: 0.0005,
            particleCount: 100,
            dissolveDuration: 1000,
            reformDuration: 1000,
            orbitCount: 8,
            glowIntensity: 0.6,
            reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
        };
        
        // State management
        let state = {
            spinning: true,
            dissolving: false,
            particles: [],
            hatParticles: [],
            time: 0,
            lastTimestamp: 0,
            reformed: false
        };
        
        // DOM elements
        const canvas = document.getElementById('hatCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const container = document.getElementById('hatContainer');
        const bgParticlesContainer = document.getElementById('bgParticles');
        
        // Initialize canvas size
        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        // Create background particles
        function createBgParticles() {
            const particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    life: Math.random() * 5 + 5,
                    angle: Math.random() * Math.PI * 2
                });
            }
            return particles;
        }
        
        // Create hat particle system
        function createHatParticles() {
            const particles = [];
            const radius = 60;
            const count = 200;
            
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2 - 0.1;
                const distance = radius + Math.random() * 30;
                particles.push({
                    angle: angle,
                    distance: distance,
                    offset: Math.random() * Math.PI * 2,
                    speed: (Math.random() - 0.5) * 0.02,
                    size: Math.random() * 3 + 1,
                    glow: Math.random() * 0.3 + 0.2,
                    orbiting: false,
                    orbitAngle: 0,
                    orbitSpeed: (Math.random() - 0.5) * 0.005
                });
            }
            return particles;
        }
        
        state.particles = createBgParticles();
        state.hatParticles = createHatParticles();
        
        // Event listeners for interaction
        function handleInteraction() {
            if (state.dissolving || state.reformed) return;
            
            state.dissolving = true;
            state.spinning = false;
            
            // Trigger dissolve animation
            dissolve();
        }
        
        container.addEventListener('mouseenter', handleInteraction);
        container.addEventListener('mouseleave', reform);
        container.addEventListener('click', handleInteraction);
        
        // Check for reduced motion on load
        if (config.reducedMotion) {
            config.speed = config.reducedSpeed;
        }
        
        // Animation loop
        function animate(timestamp) {
            if (!state.lastTimestamp) state.lastTimestamp = timestamp;
            const deltaTime = timestamp - state.lastTimestamp;
            state.lastTimestamp = timestamp;
            state.time += deltaTime;
            
            // Clear canvas
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!state.dissolving) {
                // Draw the hat
                drawHat(timestamp);
            } else {
                // Draw dissolving particles
                drawDissolvingParticles(timestamp);
                
                // Check if dissolve complete
                if (state.hatParticles.every(p => p.distance > 100)) {
                    state.dissolving = false;
                    state.reformed = false;
                    // Create orbiting particles
                    createOrbitingParticles();
                }
            }
            
            // Draw background particles
            drawBgParticles(deltaTime);
            
            requestAnimationFrame(animate);
        }
        
        // Draw the Red Hat fedora
        function drawHat(timestamp) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 60;
            const brimRadius = 80;
            
            // Create gradients
            const gradient = ctx.createRadialGradient(cx, cy - 20, 0, cx, cy - 20, radius);
            gradient.addColorStop(0, '#CC0000');
            gradient.addColorStop(0.5, '#AA0000');
            gradient.addColorStop(1, '#8B0000');
            
            const brimGradient = ctx.createRadialGradient(cx, cy - 30, 0, cx, cy - 30, brimRadius);
            brimGradient.addColorStop(0, 'rgba(204, 0, 0, 0.9)');
            brimGradient.addColorStop(0.7, 'rgba(204, 0, 0, 0.7)');
            brimGradient.addColorStop(1, 'rgba(204, 0, 0, 0.3)');
            
            // Draw brim shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(cx, cy, brimRadius + 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw brim
            ctx.fillStyle = brimGradient;
            ctx.beginPath();
            ctx.arc(cx, cy, brimRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw crown shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.arc(cx, cy + 15, radius - 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw crown
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy + 15, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Add band
            const bandGradient = ctx.createLinearGradient(cx - radius, cy + 5, cx + radius, cy + 5);
            bandGradient.addColorStop(0, '#333333');
            bandGradient.addColorStop(1, '#222222');
            
            ctx.fillStyle = bandGradient;
            ctx.fillRect(cx - radius, cy + 20, radius * 2, 8);
            
            // Add subtle highlights
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(cx, cy + 10, radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
            
            // Add glow effect
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(204, 0, 0, 0.5)';
            ctx.fillStyle = 'rgba(204, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(cx, cy + 15, radius * 1.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // Draw dissolving particles
        function drawDissolvingParticles(timestamp) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            state.hatParticles.forEach(p => {
                // Animate distance for dissolve effect
                if (state.dissolving) {
                    p.distance = Math.max(p.distance - 0.3, 20);
                }
                
                const x = cx + Math.cos(p.angle + timestamp * p.speed) * p.distance;
                const y = cy + Math.sin(p.angle + timestamp * p.speed) * p.distance;
                
                const size = p.size * (p.distance / 100);
                const glow = Math.min(1, p.glow + (Math.sin(timestamp * 0.01) * 0.1));
                
                ctx.fillStyle = `rgba(255, 100, 100, ${glow * 0.8})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `rgba(255, 100, 100, ${glow * 0.5})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }
        
        // Draw background particles
        function drawBgParticles(deltaTime) {
            state.particles.forEach(p => {
                p.x += p.vx * deltaTime * 0.016;
                p.y += p.vy * deltaTime * 0.016;
                
                // Bounce off edges
                if (p.x < 0 || p.x > window.innerWidth) p.vx *= -1;
                if (p.y < 0 || p.y > window.innerHeight) p.vy *= -1;
                
                p.life -= deltaTime * 0.016;
                if (p.life <= 0) {
                    // Respawn
                    p.x = Math.random() * window.innerWidth;
                    p.y = Math.random() * window.innerHeight;
                    p.life = Math.random() * 5 + 5;
                    p.vx = (Math.random() - 0.5) * 0.5;
                    p.vy = (Math.random() - 0.5) * 0.5;
                }
                
                const alpha = Math.max(0, p.life / 5);
                ctx.fillStyle = `rgba(204, 0, 0, ${alpha * 0.3})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Create orbiting particles after dissolve
        function createOrbitingParticles() {
            for (let i = 0; i < config.orbitCount; i++) {
                const angle = (Math.PI * 2 * i) / config.orbitCount;
                state.hatParticles.push({
                    angle: angle,
                    distance: 80,
                    offset: 0,
                    speed: 0,
                    size: 2,
                    glow: 0.5,
                    orbiting: true,
                    orbitAngle: angle,
                    orbitSpeed: 0.002
                });
            }
        }
        
        // Reform the hat
        function reform() {
            if (state.reformed || !state.dissolving) return;
            
            state.reformed = true;
            // Reset particles to form hat again
            state.hatParticles = createHatParticles();
            state.dissolving = false;
        }
        
        // Handle mouse movement for interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        // Add subtle mouse-following effect
        function updateMouseEffect() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const dx = mouseX - cx;
            const dy = mouseY - cy;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 150) {
                // Rotate hat towards mouse
                const angle = Math.atan2(dy, dx);
                state.hatParticles.forEach(p => {
                    if (!p.orbiting) {
                        p.angle += (angle - p.angle) * 0.02;
                    }
                });
            }
        }
        
        // Start animation
        requestAnimationFrame(animate);
        
        // Set up background particles visually
        for (let i = 0; i < state.particles.length; i++) {
            const p = state.particles[i];
            const particleEl = document.createElement('div');
            particleEl.className = 'particle';
            particleEl.style.left = p.x + 'px';
            particleEl.style.top = p.y + 'px';
            bgParticlesContainer.appendChild(particleEl);
        }
        
        // Update background particles positions in DOM
        function updateBgParticlesDOM() {
            const particles = state.particles;
            const particleElements = bgParticlesContainer.children;
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const el = particleElements[i];
                el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.angle}deg)`;
                el.style.opacity = p.life / 5;
            }
        }
        
        // Animation loop for background particles DOM update
        function bgParticlesDOMLoop(timestamp) {
            updateBgParticlesDOM();
            requestAnimationFrame(bgParticlesDOMLoop);
        }
        
        bgParticlesDOMLoop(0);
    </script>
</body>
</html>
