<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Georgia', serif; }
  .hero {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #15151e 0%, #0a0a0f 60%, #050508 100%);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .ambient-light {
    position: absolute;
    width: 60vmin; height: 60vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,60,40,0.08) 0%, transparent 70%);
    pointer-events: none;
    filter: blur(40px);
  }
  canvas {
    display: block;
    pointer-events: none;
    position: relative;
    z-index: 2;
  }
  .canvas-wrap {
    position: relative;
    width: 60vmin; height: 60vmin;
    display: flex; align-items: center; justify-content: center;
  }
  .ground-shadow {
    position: absolute;
    bottom: 8%;
    width: 40vmin; height: 3vmin;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
    filter: blur(12px);
    z-index: 1;
  }
  .caption {
    position: relative;
    z-index: 3;
    margin-top: 2vmin;
    color: rgba(200, 180, 160, 0.55);
    font-size: clamp(12px, 2vmin, 18px);
    font-style: italic;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.8;
    transition: opacity 0.6s ease;
  }
  .hero:hover .caption { opacity: 1; }
  .hint {
    position: absolute;
    bottom: 4vmin;
    color: rgba(255,255,255,0.25);
    font-size: clamp(10px, 1.6vmin, 14px);
    letter-spacing: 0.15em;
    z-index: 3;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; opacity: 0.5; }
  }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="ambient-light"></div>
  <div class="canvas-wrap">
    <div class="ground-shadow"></div>
    <canvas id="canvas"></canvas>
  </div>
  <div class="caption">Classics never fade</div>
  <div class="hint">Hover to dissolve · Tap to transform</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const hero = document.getElementById('hero');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, dpr;
  function resize() {
    const wrap = canvas.parentElement;
    const size = Math.min(wrap.clientWidth, wrap.clientHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = size * dpr;
    H = size * dpr;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Hat geometry generation ---
  // Points that form a fedora hat
  const hatPoints = [];

  function generateHat() {
    hatPoints.length = 0;
    const crownHeight = 0.55;
    const crownTopRadius = 0.42;
    const crownBottomRadius = 0.48;
    const brimInnerRadius = 0.48;
    const brimOuterRadius = 0.95;
    const brimCurveHeight = 0.08;
    const bandHeight = 0.12;
    const bandY = -0.15;
    const indentDepth = 0.12;

    // Crown vertical rings
    const crownRings = 14;
    const crownSegs = 48;
    for (let i = 0; i < crownRings; i++) {
      const t = i / (crownRings - 1);
      const y = -crownHeight / 2 + t * crownHeight;
      // Radius with slight bulge and top pinch
      let r;
      if (t < 0.15) {
        // Bottom flare
        const bt = t / 0.15;
        r = crownBottomRadius * (0.92 + 0.08 * bt);
      } else if (t > 0.85) {
        // Top curve
        const tt = (t - 0.85) / 0.15;
        r = crownTopRadius + (crownBottomRadius - crownTopRadius) * (1 - tt * tt);
      } else {
        const mt = (t - 0.15) / 0.7;
        r = crownBottomRadius * (0.98 - 0.06 * mt * mt);
      }
      // Top indent (pinch)
      if (t > 0.6) {
        const indentT = (t - 0.6) / 0.4;
        const indent = indentDepth * indentT * indentT;
        for (let j = 0; j < crownSegs; j++) {
          const angle = (j / crownSegs) * Math.PI * 2;
          // Elliptical indent - front and back pinched more
          const indentFactor = Math.abs(Math.sin(angle)) * 0.6 + 0.4;
          const pr = r - indent * indentFactor;
          hatPoints.push({
            x: Math.cos(angle) * pr,
            y: y,
            z: Math.sin(angle) * pr,
            baseX: 0, baseY: 0, baseZ: 0,
            type: 'crown',
            shade: t > 0.7 ? 0.75 : (t < 0.2 ? 0.85 : 0.9),
            size: 1.8
          });
        }
      } else {
        for (let j = 0; j < crownSegs; j++) {
          const angle = (j / crownSegs) * Math.PI * 2;
          hatPoints.push({
            x: Math.cos(angle) * r,
            y: y,
            z: Math.sin(angle) * r,
            baseX: 0, baseY: 0, baseZ: 0,
            type: 'crown',
            shade: 0.9,
            size: 1.8
          });
        }
      }
    }

    // Crown top cap - filled with points
    const capRings = 6;
    for (let i = 1; i <= capRings; i++) {
      const rt = i / capRings;
      const r = crownTopRadius * rt;
      const segs = Math.floor(crownSegs * rt);
      const y = crownHeight / 2;
      // Slight dip on top
      const dip = indentDepth * 0.3 * (1 - rt * rt);
      for (let j = 0; j < segs; j++) {
        const angle = (j / segs) * Math.PI * 2;
        const indentFactor = Math.abs(Math.sin(angle)) * 0.5 + 0.5;
        hatPoints.push({
          x: Math.cos(angle) * r,
          y: y - dip * indentFactor,
          z: Math.sin(angle) * r,
          baseX: 0, baseY: 0, baseZ: 0,
          type: 'crown',
          shade: 0.65,
          size: 1.6
        });
      }
    }

    // Band (darker ring)
    const bandSegs = 52;
    for (let j = 0; j < bandSegs; j++) {
      const angle = (j / bandSegs) * Math.PI * 2;
      const r = crownBottomRadius + 0.01;
      for (let k = 0; k < 2; k++) {
        const yOff = (k - 0.5) * bandHeight * 0.5;
        hatPoints.push({
          x: Math.cos(angle) * r,
          y: bandY + yOff,
          z: Math.sin(angle) * r,
          baseX: 0, baseY: 0, baseZ: 0,
          type: 'band',
          shade: 0.4,
          size: 2.0
        });
      }
    }

    // Brim - multiple concentric rings with curve
    const brimRings = 18;
    const brimSegs = 64;
    for (let i = 0; i < brimRings; i++) {
      const t = i / (brimRings - 1);
      const r = brimInnerRadius + t * (brimOuterRadius - brimInnerRadius);
      // Brim curves down at edges
      const curve = -brimCurveHeight * Math.pow(t, 1.5);
      // Front brim dips slightly more
      for (let j = 0; j < brimSegs; j++) {
        const angle = (j / brimSegs) * Math.PI * 2;
        const frontDip = Math.max(0, Math.cos(angle)) * 0.04 * t;
        hatPoints.push({
          x: Math.cos(angle) * r,
          y: -crownHeight / 2 + curve - frontDip,
          z: Math.sin(angle) * r,
          baseX: 0, baseY: 0, baseZ: 0,
          type: 'brim',
          shade: t < 0.3 ? 0.85 : (t > 0.8 ? 0.7 : 0.78),
          size: 1.7
        });
      }
    }

    // Brim underside (darker)
    const undersideRings = 4;
    for (let i = 1; i <= undersideRings; i++) {
      const t = i / (undersideRings + 1);
      const r = brimInnerRadius * 0.9 + t * (brimOuterRadius - brimInnerRadius * 0.9);
      for (let j = 0; j < brimSegs; j++) {
        const angle = (j / brimSegs) * Math.PI * 2;
        hatPoints.push({
          x: Math.cos(angle) * r,
          y: -crownHeight / 2 - 0.02 - t * 0.02,
          z: Math.sin(angle) * r,
          baseX: 0, baseY: 0, baseZ: 0,
          type: 'brim',
          shade: 0.35,
          size: 1.5
        });
      }
    }

    // Store base positions
    for (const p of hatPoints) {
      p.baseX = p.x;
      p.baseY = p.y;
      p.baseZ = p.z;
    }
  }

  generateHat();

  // --- Orbiting particles (always present, subtle) ---
  const orbiters = [];
  const orbiterCount = 18;
  for (let i = 0; i < orbiterCount; i++) {
    orbiters.push({
      angle: Math.random() * Math.PI * 2,
      radius: 1.2 + Math.random() * 0.6,
      yOffset: (Math.random() - 0.5) * 0.8,
      speed: (Math.random() - 0.5) * 0.3 + 0.15,
      size: 0.8 + Math.random() * 1.2,
      tilt: Math.random() * Math.PI * 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }

  // --- Particle system for dissolve effect ---
  const particles = [];
  const particlePool = [];

  function getParticle() {
    if (particlePool.length > 0) return particlePool.pop();
    return {};
  }
  function returnParticle(p) {
    if (particlePool.length < 2000) particlePool.push(p);
  }

  // --- State management ---
  let state = 'spinning'; // spinning, dissolving, swarming, reforming, postglow
  let stateTime = 0;
  let hovered = false;
  let spinSpeed = prefersReducedMotion ? 0.2 : 0.6;
  let targetSpinSpeed = prefersReducedMotion ? 0.2 : 0.6;
  let rotationY = 0;
  let rotationX = -0.15;
  let targetRotX = -0.15;

  // Dissolve parameters
  const dissolveDuration = 1.2;
  const swarmDuration = 2.0;
  const reformDuration = 1.5;

  function triggerDissolve() {
    if (state !== 'spinning' && state !== 'postglow') return;
    state = 'dissolving';
    stateTime = 0;
    targetSpinSpeed = 0.05;

    // Create particles from hat points
    particles.length = 0;
    for (const p of hatPoints) {
      const pt = getParticle();
      pt.x = p.baseX;
      pt.y = p.baseY;
      pt.z = p.baseZ;
      pt.vx = (Math.random() - 0.5) * 0.3;
      pt.vy = Math.random() * 0.5 + 0.2;
      pt.vz = (Math.random() - 0.5) * 0.3;
      pt.baseX = p.baseX;
      pt.baseY = p.baseY;
      pt.baseZ = p.baseZ;
      pt.shade = p.shade;
      pt.size = p.size;
      pt.type = p.type;
      pt.life = 1;
      pt.swirlOffset = Math.random() * Math.PI * 2;
      pt.swirlRadius = 0.5 + Math.random() * 1.5;
      pt.swirlSpeed = (Math.random() - 0.5) * 2 + 1;
      particles.push(pt);
    }
  }

  function updateDissolving(dt) {
    const progress = stateTime / dissolveDuration;
    const ease = 1 - Math.pow(1 - progress, 3);

    for (const p of particles) {
      // Explosive outward
      p.x += p.vx * dt * 3 * ease;
      p.y += p.vy * dt * 3 * ease;
      p.z += p.vz * dt * 3 * ease;
      p.vy += 0.1 * dt; // slight upward drift
    }

    if (stateTime >= dissolveDuration) {
      state = 'swarming';
      stateTime = 0;
    }
  }

  function updateSwarming(dt) {
    const progress = stateTime / swarmDuration;
    // Swirl around center
    const centerX = 0, centerY = 0.2, centerZ = 0;

    for (const p of particles) {
      const angle = p.swirlOffset + stateTime * p.swirlSpeed;
      const targetX = centerX + Math.cos(angle) * p.swirlRadius;
      const targetY = centerY + Math.sin(angle * 0.7 + p.swirlOffset) * 0.3 + Math.sin(angle * 1.3) * 0.1;
      const targetZ = centerZ + Math.sin(angle) * p.swirlRadius;

      // Lerp toward swarm position
      const lerp = dt * 2;
      p.x += (targetX - p.x) * lerp;
      p.y += (targetY - p.y) * lerp;
      p.z += (targetZ - p.z) * lerp;

      // Add some random drift
      p.vx = (p.vx || 0) * 0.95 + (Math.random() - 0.5) * 0.02;
      p.vy = (p.vy || 0) * 0.95 + (Math.random() - 0.5) * 0.02;
      p.vz = (p.vz || 0) * 0.95 + (Math.random() - 0.5) * 0.02;
      p.x += p.vx;
      p.y += p.vy;
      p.z += p.vz;
    }

    if (stateTime >= swarmDuration) {
      state = 'reforming';
      stateTime = 0;
    }
  }

  function updateReforming(dt) {
    const progress = stateTime / reformDuration;
    // Ease out - fast start, slow finish
    const ease = 1 - Math.pow(1 - progress, 4);

    for (const p of particles) {
      // Flow back to original position
      const lerp = dt * 2 + ease * 0.1;
      p.x += (p.baseX - p.x) * lerp;
      p.y += (p.baseY - p.y) * lerp;
      p.z += (p.baseZ - p.z) * lerp;
    }

    if (stateTime >= reformDuration) {
      state = 'postglow';
      stateTime = 0;
      targetSpinSpeed = prefersReducedMotion ? 0.2 : 0.6;
    }
  }

  function updatePostglow(dt) {
    // Fade particles back into hat, keep a few orbiting
    const progress = Math.min(1, stateTime / 1.5);

    // Return particles to exact base positions
    for (const p of particles) {
      p.x = p.baseX;
      p.y = p.baseY;
      p.z = p.baseZ;
    }

    // After a delay, go back to normal spinning
    if (stateTime > 2) {
      state = 'spinning';
      stateTime = 0;
      // Release particles back to pool
      for (const p of particles) returnParticle(p);
      particles.length = 0;
    }
  }

  // --- Rendering ---
  function project(x, y, z) {
    // Rotate Y
    const cosY = Math.cos(rotationY);
    const sinY = Math.sin(rotationY);
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;

    // Rotate X
    const cosX = Math.cos(rotationX);
    const sinX = Math.sin(rotationX);
    const y1 = y * cosX - z1 * sinX;
    const z2 = y * sinX + z1 * cosX;

    // Perspective
    const focal = 3;
    const scale = focal / (focal + z2);
    return {
      sx: x1 * scale,
      sy: -y1 * scale,
      sz: z2,
      scale: scale
    };
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;
    const scale = Math.min(W, H) * 0.3;

    // Collect all renderable items with depth
    const renderList = [];

    // Hat points (or dissolved particles)
    if (particles.length > 0 && (state === 'dissolving' || state === 'swarming' || state === 'reforming' || state === 'postglow')) {
      for (const p of particles) {
        const proj = project(p.x, p.y, p.z);
        renderList.push({
          x: cx + proj.sx * scale,
          y: cy + proj.sy * scale,
          z: proj.sz,
          size: p.size * proj.scale * dpr * (state === 'swarming' ? 1.3 : 1),
          shade: p.shade,
          type: p.type,
          glow: state === 'dissolving' || state === 'swarming' ? 1 : (state === 'reforming' ? 0.5 : 0.1),
          isParticle: true
        });
      }
    } else {
      for (const p of hatPoints) {
        const proj = project(p.baseX, p.baseY, p.baseZ);
        renderList.push({
          x: cx + proj.sx * scale,
          y: cy + proj.sy * scale,
          z: proj.sz,
          size: p.size * proj.scale * dpr,
          shade: p.shade,
          type: p.type,
          glow: 0,
          isParticle: false
        });
      }
    }

    // Orbiting particles (always visible, subtle)
    const glowIntensity = (state === 'postglow' ? 1 : 0.3) + (hovered && state === 'spinning' ? 0.2 : 0);
    for (const o of orbiters) {
      const angle = o.angle + stateTime * o.speed;
      const r = o.radius;
      const px = Math.cos(angle) * r;
      const py = o.yOffset + Math.sin(angle * 0.5 + o.phase) * 0.15;
      const pz = Math.sin(angle) * r * Math.cos(o.tilt) + Math.sin(o.tilt) * o.yOffset;
      const proj = project(px, py, pz);
      renderList.push({
        x: cx + proj.sx * scale,
        y: cy + proj.sy * scale,
        z: proj.sz + 2, // always in front feel
        size: o.size * proj.scale * dpr * glowIntensity,
        shade: 1,
        type: 'ember',
        glow: glowIntensity,
        isEmber: true
      });
    }

    // Sort by z (back to front)
    renderList.sort((a, b) => b.z - a.z);

    // Draw
    for (const item of renderList) {
      if (item.size < 0.3) continue;

      let r, g, b, a;

      if (item.isEmber) {
        // Warm ember glow
        r = 255; g = 160 + Math.random() * 40; b = 60;
        a = 0.6 * Math.min(1, item.glow);
      } else if (item.type === 'band') {
        // Dark band
        const s = item.shade * (0.5 + 0.5 * (1 - item.z * 0.3));
        r = 140 * s; g = 20 * s; b = 10 * s;
        a = 0.95;
      } else {
        // Red hat felt
        const lightFactor = 0.5 + 0.5 * (1 - item.z * 0.35);
        const s = item.shade * lightFactor;
        r = 180 * s + 20;
        g = 30 * s;
        b = 15 * s;
        a = 0.92;
      }

      // Glow effect
      if (item.glow > 0.01) {
        const glowSize = item.size * (3 + item.glow * 4);
        const grad = ctx.createRadialGradient(item.x, item.y, 0, item.x, item.y, glowSize);
        if (item.isEmber || item.isParticle) {
          grad.addColorStop(0, `rgba(255, 180, 80, ${0.6 * item.glow})`);
          grad.addColorStop(0.3, `rgba(255, 100, 40, ${0.3 * item.glow})`);
          grad.addColorStop(1, 'rgba(255, 60, 20, 0)');
        } else {
          grad.addColorStop(0, `rgba(200, 50, 30, ${0.4 * item.glow})`);
          grad.addColorStop(1, 'rgba(200, 50, 30, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(item.x, item.y, glowSize, 0, Math.PI * 2);
        ctx.fill();
      }

      // Core dot
      ctx.fillStyle = `rgba(${r|0}, ${g|0}, ${b|0}, ${a})`;
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Animation loop ---
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    stateTime += dt;

    // Smooth spin speed
    spinSpeed += (targetSpinSpeed - spinSpeed) * dt * 2;

    // Rotation
    rotationY += spinSpeed * dt;
    rotationX += (targetRotX - rotationX) * dt * 2;

    // State updates
    if (state === 'dissolving') updateDissolving(dt);
    else if (state === 'swarming') updateSwarming(dt);
    else if (state === 'reforming') updateReforming(dt);
    else if (state === 'postglow') updatePostglow(dt);

    render();
    requestAnimationFrame(loop);
  }

  // --- Interaction ---
  let hoverTimer = null;

  function handleEnter() {
    hovered = true;
    if (prefersReducedMotion) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(triggerDissolve, 150);
  }

  function handleLeave() {
    hovered = false;
    clearTimeout(hoverTimer);
  }

  hero.addEventListener('mouseenter', handleEnter);
  hero.addEventListener('mouseleave', handleLeave);
  hero.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleEnter();
  }, { passive: false });
  hero.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleLeave();
  }, { passive: false });

  // Start
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
