<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fedora — Ember</title>
<style>
  :root{--bg:#08090c;--red:#e2231a;--red2:#ff4a3d;--ink:#f4f1ea;--muted:#9a958c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 520px at 50% 38%,rgba(226,35,26,.14),transparent 62%),
      radial-gradient(700px 500px at 72% 18%,rgba(255,150,90,.06),transparent 60%),
      radial-gradient(1200px 800px at 50% 110%,#14161c 0%,var(--bg) 55%);
    color:var(--ink);font-family:Inter,ui-sans-system,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  /* soft vignette + faint floor glow */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.55) 100%)}
  body::after{content:"";position:fixed;left:50%;top:62%;width:min(72vw,620px);height:120px;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(226,35,26,.16),transparent 70%);filter:blur(10px);pointer-events:none}
  main{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative;z-index:1}
  .hero{text-align:center;width:min(92vw,760px)}
  .eyebrow{letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-bottom:18px}
  h1{font-size:clamp(28px,5vw,52px);font-weight:650;letter-spacing:-.03em;line-height:1.05}
  h1 em{font-style:normal;color:var(--red2)}
  .scene{position:relative;height:clamp(280px,46svh,420px);display:grid;place-items:center;perspective:1100px;perspective-origin:50% 42%;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
  .scene:focus-visible{box-shadow:0 0 0 2px rgba(255,90,70,.7);border-radius:24px}
  /* floor shadow */
  .shadow{position:absolute;left:50%;top:72%;width:280px;height:34px;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);filter:blur(6px);transition:opacity .5s,transform .5s}
  .hat-wrap{width:clamp(240px,42vw,360px);transform-style:preserve-3d;will-change:transform,opacity;filter:drop-shadow(0 22px 22px rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(226,35,26,.12))}
  .hat-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .caption{margin-top:6px;color:var(--muted);font-size:14px;letter-spacing:.02em}
  .caption b{color:#d8d2c8;font-weight:600}
  .hint{margin-top:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#6f6a62}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
  @media (prefers-reduced-motion:reduce){
    .hint{display:none}
  }
</style>
</head>
<body>
<main>
  <section class="hero" aria-label="Fedora hero">
    <p class="eyebrow">Open &nbsp;·&nbsp; Elegant &nbsp;·&nbsp; Enduring</p>
    <h1>The <em>fedora</em>, reimagined<br>in light.</h1>

    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Fedora logo. Activate to dissolve into particles and reform.">
      <div class="shadow" id="shadow"></div>
      <div class="hat-wrap" id="hat">
        <!-- Red Hat–style fedora: red crown + wide brim, black band -->
        <svg viewBox="0 0 360 240" role="img" aria-label="Red fedora">
          <defs>
            <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff5a4e"/><stop offset=".45" stop-color="#e2231a"/><stop offset="1" stop-color="#a8120d"/>
            </linearGradient>
            <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f03328"/><stop offset="1" stop-color="#8f0f0a"/>
            </linearGradient>
            <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0c0c0f"/>
            </linearGradient>
            <radialGradient id="sheen" cx=".35" cy=".22" r=".8">
              <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- brim -->
          <ellipse cx="180" cy="168" rx="168" ry="42" fill="url(#brim)"/>
          <ellipse cx="180" cy="162" rx="168" ry="42" fill="url(#sheen)" opacity=".55"/>
          <ellipse cx="180" cy="168" rx="112" ry="26" fill="#7d0d08" opacity=".55"/>
          <!-- crown: classic fedora pinch -->
          <path d="M92 166 C92 108 108 58 142 48 C158 43 168 52 180 52 C192 52 202 43 218 48 C252 58 268 108 268 166 C268 176 92 176 92 166Z" fill="url(#crown)"/>
          <path d="M118 62 C132 84 136 108 132 150 L112 150 C112 112 112 84 118 62Z" fill="#000" opacity=".14"/>
          <path d="M242 62 C228 84 224 108 228 150 L248 150 C248 112 248 84 242 62Z" fill="#000" opacity=".14"/>
          <path d="M92 166 C92 108 108 58 142 48 C158 43 168 52 180 52 C192 52 202 43 218 48 C252 58 268 108 268 166 C268 176 92 176 92 166Z" fill="url(#sheen)"/>
          <!-- band -->
          <path d="M92 138 L268 138 L268 166 C268 176 92 176 92 166Z" fill="url(#band)"/>
          <rect x="252" y="140" width="10" height="22" rx="2" fill="#3a3a40"/>
        </svg>
      </div>
    </div>

    <p class="caption"><b>Fedora</b> &nbsp;—&nbsp; hover or tap the hat, and watch it become embers.</p>
    <p class="hint">Hover · Tap · Enter</p>
  </section>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  const scene = document.getElementById('scene');
  const hat = document.getElementById('hat');
  const shadow = document.getElementById('shadow');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize(); addEventListener('resize', resize);

  // ---- 3D spin (JS-driven so it can ease to a stop) ----
  let angle = -18, speed = 28, targetSpeed = 28; // deg / s
  let last = performance.now(), busy = false, hatOpacity = 1;

  function frame(now){
    const dt = Math.min((now - last) / 1000, .05); last = now;
    speed += (targetSpeed - speed) * Math.min(1, dt * 3.5);
    if (!reduced.matches) angle = (angle + speed * dt) % 360;
    const bob = reduced.matches ? 0 : Math.sin(now / 1400) * 5;
    hat.style.transform = `translateY(${bob}px) rotateX(-9deg) rotateY(${angle}deg)`;
    hat.style.opacity = hatOpacity;
    shadow.style.opacity = .55 + Math.cos(angle * Math.PI / 180) * .12;
    shadow.style.transform = `translateX(-50%) scaleX(${1 - Math.abs(Math.sin(angle*Math.PI/180))*.12})`;
    drawParticles(now / 1000, dt);
    requestAnimationFrame(frame);
  }

  // ---- Particle sampling from the hat silhouette ----
  function samplePoints(n){
    const c = document.createElement('canvas'); c.width = 360; c.height = 240;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#e2231a';
    g.beginPath(); g.ellipse(180, 168, 168, 42, 0, 0, Math.PI * 2); g.fill();
    g.beginPath();
    g.moveTo(92,166); g.bezierCurveTo(92,108,108,58,142,48); g.bezierCurveTo(158,43,168,52,180,52);
    g.bezierCurveTo(192,52,202,43,218,48); g.bezierCurveTo(252,58,268,108,268,166); g.closePath(); g.fill();
    const data = g.getImageData(0, 0, 360, 240).data, pts = [];
    let guard = n * 30;
    while (pts.length < n && guard-- > 0){
      const x = Math.random() * 360, y = Math.random() * 240;
      if (data[((y|0) * 360 + (x|0)) * 4 + 3] > 20) pts.push({ x: x - 180, y: y - 120 });
    }
    return pts;
  }

  // ---- Particles ----
  let particles = [], orbiters = [], dissolving = false;
  const COLORS = ['255,92,72','226,35,26','255,150,90','255,205,130','240,235,225'];

  function spawnDissolve(){
    const r = hat.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const scale = r.width / 360;
    const count = Math.min(3200, Math.max(1600, (innerWidth * innerHeight) / 650 | 0));
    particles = samplePoints(count).map(p => {
      const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 150;
      return {
        sx: cx + p.x * scale, sy: cy + p.y * scale,       // start (on hat)
        tx: cx + p.x * scale, ty: cy + p.y * scale,       // reform target (same)
        ex: cx + p.x * scale + Math.cos(a) * d,           // ember drift point
        ey: cy + p.y * scale + Math.sin(a) * d * .7 - 30 - Math.random() * 70,
        swirl: .6 + Math.random() * 1.6, phase: Math.random() * Math.PI * 2,
        size: .7 + Math.random() * 1.9, color: COLORS[Math.random() * COLORS.length | 0],
        delay: Math.random() * .12
      };
    });
    dissolving = true;
  }

  function spawnOrbiters(){
    const r = hat.getBoundingClientRect();
    orbiters = Array.from({ length: 26 }, (_, i) => ({
      a: (i / 26) * Math.PI * 2, rX: r.width * (.58 + Math.random() * .18),
      rY: 34 + Math.random() * 26, sp: .25 + Math.random() * .45,
      size: .8 + Math.random() * 1.4, color: COLORS[i % 3], trail: []
    }));
  }

  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const clamp01 = v => Math.max(0, Math.min(1, v));

  function drawParticles(t, dt){
    ctx.clearRect(0, 0, W, H);
    // orbiters (persist after reform)
    if (orbiters.length && !dissolving){
      const r = hat.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2 + 6;
      ctx.lineCap = 'round';
      for (const o of orbiters){
        o.a += o.sp * dt * (reduced.matches ? 0 : 1);
        const x = cx + Math.cos(o.a) * o.rX, y = cy + Math.sin(o.a) * o.rY;
        o.trail.push({x, y}); if (o.trail.length > 14) o.trail.shift();
        for (let i = 1; i < o.trail.length; i++){
          ctx.strokeStyle = `rgba(${o.color},${(i/o.trail.length)*.28})`;
          ctx.lineWidth = o.size * (i/o.trail.length);
          ctx.beginPath(); ctx.moveTo(o.trail[i-1].x, o.trail[i-1].y); ctx.lineTo(o.trail[i].x, o.trail[i].y); ctx.stroke();
        }
        ctx.fillStyle = `rgba(${o.color},.9)`;
        ctx.shadowColor = `rgba(${o.color},.8)`; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(x, y, o.size, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    if (!particles.length) return;

    const T = 4.6, e = dissolveT; // seconds total
    for (const p of particles){
      let x, y, alpha;
      const lt = clamp01((e - p.delay) / (T - .3));
      if (lt < .38){           // 1) drift apart like embers
        const k = ease(lt / .38);
        x = p.sx + (p.ex - p.sx) * k; y = p.sy + (p.ey - p.sy) * k - Math.sin(k*Math.PI)*14;
        alpha = .25 + k * .75;
      } else if (lt < .68){    // 2) swirl
        const k = (lt - .38) / .30, ang = k * Math.PI * 2 * p.swirl + p.phase;
        const rx = p.ex + Math.cos(ang) * 42, ry = p.ey + Math.sin(ang) * 26 - k * 12;
        x = rx; y = ry; alpha = 1;
      } else {                 // 3) flow back & reform
        const k = ease((lt - .68) / .32);
        const ang = p.phase + (1-k) * 2.2;
        const bx = p.ex + Math.cos(ang) * 42 * (1-k), by = p.ey + Math.sin(ang) * 26 * (1-k);
        x = bx + (p.tx - bx) * k; y = by + (p.ty - by) * k;
        alpha = 1 - Math.pow(k, 6) * .9;
      }
      const flicker = .75 + Math.sin(t * 9 + p.phase * 7) * .25;
      ctx.fillStyle = `rgba(${p.color},${(alpha * flicker).toFixed(3)})`;
      ctx.shadowColor = `rgba(${p.color},.75)`; ctx.shadowBlur = 7;
      ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // ---- Sequence ----
  let dissolveT = 0, rafT = 0;
  function dissolve(){
    if (busy || reduced.matches) return;
    busy = true; targetSpeed = 4;               // slow the spin first
    setTimeout(() => {
      hatOpacity = 0; shadow.style.opacity = 0; // hat dissolves…
      spawnDissolve(); dissolveT = 0;
      const t0 = performance.now();
      (function tick(now){
        dissolveT = (now - t0) / 1000;
        if (dissolveT >= 3.15 && hatOpacity === 0){ hatOpacity = 1; shadow.style.opacity = ''; targetSpeed = 28; }
        if (dissolveT < 4.6) requestAnimationFrame(tick);
        else { particles = []; dissolving = false; spawnOrbiters(); busy = false; }
      })(t0);
    }, 650);
  }

  scene.addEventListener('pointerenter', dissolve);
  scene.addEventListener('click', dissolve);
  scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dissolve(); } });
  reduced.addEventListener?.('change', () => { particles = []; orbiters = []; dissolving = false; busy = false; hatOpacity = 1; targetSpeed = 28; });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
