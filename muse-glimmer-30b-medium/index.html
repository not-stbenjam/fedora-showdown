<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Fedora Ember</title>
<style>
html,body{margin:0;height:100%;background:#050508;color:#e8e8ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:
radial-gradient(1200px 800px at 50% 40%,#11121a 0%,#070709 60%,#050508 100%);
}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.caption{position:fixed;bottom:6vh;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.65;pointer-events:none}
.glow{position:fixed;inset:-20%;background:
radial-gradient(600px 400px at 50% 30%,rgba(238,0,0,.08),transparent 60%),
radial-gradient(400px 300px at 50% 70%,rgba(238,0,0,.05),transparent 60%);
filter:blur(40px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.glow{display:none}}
</style>
</head>
<body>
<div class="stage">
<div class="glow"></div>
<canvas id="c"></canvas>
<div class="caption">Red Hat • Fedora — hover to ember</div>
</div>
<script>
(() => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });
let w,h,centerX,centerY,dpr=1;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  w = canvas.width = innerWidth*dpr;
  h = canvas.height = innerHeight*dpr;
  canvas.style.width = innerWidth+'px';
  canvas.style.height = innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  centerX = innerWidth/2;
  centerY = innerHeight/2;
}
addEventListener('resize', resize); resize();

/* build mask and particles */
const mask = document.createElement('canvas');
mask.width = mask.height = 256;
const mctx = mask.getContext('2d');
mctx.translate(128,128);
mctx.fillStyle = '#000';
/* brim */
mctx.beginPath();
mctx.ellipse(0,18,78,18,0,0,Math.PI*2);
mctx.fill();
/* crown */
mctx.beginPath();
mctx.moveTo(-28,-5);
mctx.lineTo(-38,-55);
mctx.lineTo(-18,-45);
mctx.lineTo(-8,-80);
mctx.lineTo(8,-80);
mctx.lineTo(18,-45);
mctx.lineTo(38,-55);
mctx.lineTo(28,-5);
mctx.closePath();
mctx.fill();

const img = mctx.getImageData(0,0,256,256).data;
const particles = [];
const step = 4;
for(let y=0;y<256;y+=step){
  for(let x=0;x<256;x+=step){
    const i = ((y*256)+x)*4+3;
    if(img[i]>0){
      const bx = (x-128);
      const by = (y-128);
      const ang = Math.random()*Math.PI*2;
      const rad = 80 + Math.random()*180;
      particles.push({
        bx, by,
        ex: Math.cos(ang)*rad,
        ey: Math.sin(ang)*rad,
        isOrbiter: Math.random()<0.025,
        orbitA: Math.random()*Math.PI*2,
        orbitR: 18+Math.random()*34,
        orbitS: 0.6+Math.random()*0.8
      });
    }
  }
}
const scale = Math.min(innerWidth,innerHeight)*0.0019;
let rotation = 0;
let rotSpeed = reduced ? 0 : 0.35;
let animStart = null;
let animating = false;
let hovered = false;
let last = performance.now();

function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function easeInCubic(t){return t*t*t}
function lerp(a,b,t){return a+(b-a)*t}
function rotatePoint(x,y,ang){
  const c=Math.cos(ang), s=Math.sin(ang);
  return [x*c - y*s, x*s + y*c];
}

function startAnim(){
  if(animating) return;
  animating = true;
  animStart = performance.now();
  hovered = true;
}

canvas.addEventListener('pointerenter', startAnim);
canvas.addEventListener('pointerdown', startAnim);
addEventListener('pointerleave', ()=>{hovered=false;});

function draw(t){
  const now = performance.now();
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;

  ctx.clearRect(0,0,innerWidth,innerHeight);

  // soft vignette
  const g = ctx.createRadialGradient(centerX,centerY, Math.min(innerWidth,innerHeight)*0.2, centerX,centerY, Math.max(innerWidth,innerHeight)*0.8);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,innerWidth,innerHeight);

  if(!reduced){
    const targetSpeed = hovered ? 0.07 : 0.35;
    rotSpeed += (targetSpeed - rotSpeed)*0.05;
    rotation += rotSpeed * dt;
  }

  let prog = 0;
  if(animating){
    prog = Math.min(1, (now - animStart)/1800);
    if(prog>=1){animating=false; hovered=false;}
  }

  ctx.save();
  ctx.translate(centerX, centerY);

  // shadow for depth
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 60;
  ctx.shadowOffsetY = 30;

  for(const p of particles){
    const [rx, ry] = rotatePoint(p.bx*scale, p.by*scale, rotation);
    let x = rx, y = ry;

    if(animating){
      if(prog < 0.32){
        const k = easeOutCubic(prog/0.32);
        x = lerp(rx, rx + p.ex*0.6, k);
        y = lerp(ry, ry + p.ey*0.6, k);
      }else if(prog < 0.72){
        const sw = Math.sin((prog-0.32)/0.4*Math.PI*2)*12;
        x = rx + p.ex*0.6 + Math.cos(prog*10 + p.bx)*sw;
        y = ry + p.ey*0.6 + Math.sin(prog*10 + p.by)*sw;
      }else{
        const k = easeInCubic((prog-0.72)/0.28);
        const ex = rx + p.ex*0.6;
        const ey = ry + p.ey*0.6;
        x = lerp(ex, rx, k);
        y = lerp(ey, ry, k);
      }
    }

    if(!animating && p.isOrbiter){
      p.orbitA += p.orbitS*dt;
      x += Math.cos(p.orbitA)*p.orbitR*scale*0.9;
      y += Math.sin(p.orbitA)*p.orbitR*scale*0.9;
    }

    ctx.beginPath();
    ctx.fillStyle = 'rgba(238,0,0,0.9)';
    ctx.shadowColor = 'rgba(238,0,0,0.6)';
    ctx.shadowBlur = 10;
    ctx.arc(x, y, 1.4, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
