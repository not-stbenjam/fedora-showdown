<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Fedora</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a0f;
    color: #e9e6e2;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, rgba(48, 22, 30, .55), transparent 70%),
      radial-gradient(ellipse 90% 40% at 50% 78%, rgba(120, 30, 40, .10), transparent 65%),
      radial-gradient(ellipse 120% 100% at 50% 50%, #131219 0%, #0a0a0f 70%, #060609 100%);
  }
  .stage::after {                       /* faint film grain / vignette for depth */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: manipulation; outline: none;
  }
  canvas:focus-visible { outline: 2px solid rgba(255,255,255,.22); outline-offset: -8px; }
  .caption {
    position: absolute; left: 0; right: 0;
    bottom: clamp(26px, 8vh, 92px);
    text-align: center; pointer-events: none;
    padding: 0 24px;
  }
  .caption h1 {
    font-size: clamp(14px, 1.5vw, 19px); font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase; color: #ece7e2;
  }
  .caption h1 span { color: #e8433a; }
  .caption p {
    margin-top: 10px; font-size: clamp(12px, 1.15vw, 14px);
    letter-spacing: .04em; color: rgba(233,230,226,.48);
  }
  .caption hr {
    width: 28px; height: 1px; border: 0; margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, rgba(232,67,58,.8), transparent);
  }
</style>
</head>
<body>
<main class="stage">
  <canvas id="scene" tabindex="0" role="img" aria-label="A red fedora, spinning slowly in three dimensions"></canvas>
  <div class="caption">
    <h1>The <span>Fedora</span></h1>
    <hr>
    <p id="hint">Hover or tap to scatter the embers</p>
  </div>
</main>
<script>
(() => {
'use strict';
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);

// ---- Reduced motion ---------------------------------------------------------
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = false;
const applyMotionPref = () => {
  reduced = mq.matches;
  hint.textContent = reduced ? 'Hover or tap for a soft glow' : 'Hover or tap to scatter the embers';
};
if (mq.addEventListener) mq.addEventListener('change', applyMotionPref); else mq.addListener(applyMotionPref);
applyMotionPref();

// ---- Geometry: a fedora as a modulated surface of revolution ----------------
// Local space: y up, +z is the front of the hat. Brim radius ≈ 1.
const BRIM_R = 1.06, CROWN_R = 0.58, CROWN_H = 0.66;
function surf(u, th) {
  const c = Math.cos(th), s = Math.sin(th);
  let r, y, region = 0;
  if (u < 0.34) {                              // brim: outer edge -> crown base
    const k = u / 0.34, e = 1 - k;             // e = 1 at the edge
    r = lerp(BRIM_R, CROWN_R, k);
    y = 0.05 * e * e - 0.08 * e * c + 0.03 * e * e * Math.abs(s);   // snap-brim: front dips, sides curl
  } else if (u < 0.74) {                       // crown wall
    const k = (u - 0.34) / 0.40;
    y = k * CROWN_H;
    const pinch = 1 - 0.22 * Math.pow(k, 2.2) * s * s;               // sides pinch toward the top
    r = (CROWN_R - 0.06 * k * k) * pinch * (1 + 0.03 * k * c);
    region = k < 0.17 ? 1 : 0;                 // ribbon band at the base
  } else {                                     // top cap with a front-to-back crease
    const k = (u - 0.74) / 0.26, rr = 1 - k;   // rr = 1 at rim, 0 at center
    const pinch = 1 - 0.22 * s * s;
    r = (CROWN_R - 0.06) * pinch * rr * (1 + 0.03 * c);
    const x0 = r * s;
    const dome = 0.06 * (1 - rr * rr);
    const crease = 0.13 * Math.exp(-(x0 * x0) / 0.03) * (1 - rr * rr * rr);
    y = CROWN_H + dome - crease;
  }
  return { x: r * s, y, z: r * c, region };
}

const NU = 44, NV = 72;
const V = [];
for (let i = 0; i <= NU; i++) for (let j = 0; j < NV; j++) V.push(surf(i / NU, j / NV * TAU));
const NVERT = V.length;
const RX = new Float32Array(NVERT), RY = new Float32Array(NVERT), RZ = new Float32Array(NVERT);
const PX = new Float32Array(NVERT), PY = new Float32Array(NVERT);

const Q = [];
for (let i = 0; i < NU; i++) {
  const u = (i + 0.5) / NU;
  let ao = 1;                                  // faked ambient occlusion in the brim/crown crease
  if (u < 0.34) ao = 1 - 0.40 * smooth(0.55, 1, u / 0.34);
  else if (u < 0.74) ao = 1 - 0.40 * (1 - smooth(0, 0.30, (u - 0.34) / 0.40));
  const region = surf(u, 0).region;
  for (let j = 0; j < NV; j++) {
    const j2 = (j + 1) % NV;
    const a = i * NV + j, b = i * NV + j2, c = (i + 1) * NV + j2, d = (i + 1) * NV + j;
    const A = V[a], B = V[b], C = V[c], D = V[d];
    const e1x = C.x - A.x, e1y = C.y - A.y, e1z = C.z - A.z;
    const e2x = D.x - B.x, e2y = D.y - B.y, e2z = D.z - B.z;
    const nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
    const len = Math.hypot(nx, ny, nz) || 1e-6;
    Q.push({ a, b, c, d, nx: nx / len, ny: ny / len, nz: nz / len, area: len * 0.5,
             ly: (A.y + B.y + C.y + D.y) / 4, region, ao, z: 0 });
  }
}
const ORDER = Q.map((_, i) => i);

// ---- Glow sprites -----------------------------------------------------------
function makeSprite(r, g, b) {
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g2 = c.getContext('2d');
  const grd = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0.00, 'rgba(255,240,228,1)');
  grd.addColorStop(0.16, `rgba(${r},${g},${b},0.95)`);
  grd.addColorStop(0.42, `rgba(${r},${g},${b},0.30)`);
  grd.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
  g2.fillStyle = grd; g2.fillRect(0, 0, s, s);
  return c;
}
const SPR = [makeSprite(255, 62, 50), makeSprite(255, 150, 70), makeSprite(255, 222, 190)];

// ---- Particles: surface samples of the hat, weighted by area ----------------
const PN = Math.min(innerWidth, innerHeight) < 640 ? 2200 : 3600;
const F = () => new Float32Array(PN);
const P = { hx: F(), hy: F(), hz: F(), ox: F(), oy: F(), oz: F(), up: F(), sa: F(), sb: F(),
            f1: F(), f2: F(), f3: F(), p1: F(), p2: F(), p3: F(), sz: F(), tf: F(), tp: F(),
            sp: new Uint8Array(PN) };
{
  const cum = new Float32Array(Q.length); let tot = 0;
  for (let i = 0; i < Q.length; i++) { tot += Q[i].area; cum[i] = tot; }
  for (let k = 0; k < PN; k++) {
    const r = Math.random() * tot; let lo = 0, hi = Q.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < r) lo = m + 1; else hi = m; }
    const q = Q[lo], A = V[q.a], B = V[q.b], C = V[q.c], D = V[q.d];
    const s = Math.random(), t = Math.random();
    const x = lerp(lerp(A.x, B.x, s), lerp(D.x, C.x, s), t);
    const y = lerp(lerp(A.y, B.y, s), lerp(D.y, C.y, s), t);
    const z = lerp(lerp(A.z, B.z, s), lerp(D.z, C.z, s), t);
    P.hx[k] = x; P.hy[k] = y; P.hz[k] = z;
    let dx = x + rnd(-0.4, 0.4), dy = y - 0.3 + rnd(-0.4, 0.4), dz = z + rnd(-0.4, 0.4);
    const l = Math.hypot(dx, dy, dz) || 1, mag = rnd(0.6, 1.9);
    P.ox[k] = dx / l * mag; P.oy[k] = dy / l * mag; P.oz[k] = dz / l * mag;
    P.up[k] = rnd(0.25, 1.1);
    P.sa[k] = rnd(1.2, 2.6); P.sb[k] = rnd(0.8, 2.0);
    P.f1[k] = rnd(1.5, 3.5); P.f2[k] = rnd(1.5, 3.5); P.f3[k] = rnd(1.5, 3.5);
    P.p1[k] = rnd(0, TAU); P.p2[k] = rnd(0, TAU); P.p3[k] = rnd(0, TAU);
    P.sz[k] = rnd(5, 11); P.tf[k] = rnd(3, 8); P.tp[k] = rnd(0, TAU);
    const u = Math.random(); P.sp[k] = u < 0.55 ? 0 : u < 0.9 ? 1 : 2;
  }
}
// ---- Dissolve timeline --------------------------------------------------------
// A threshold sweeps down the hat releasing particles; each released particle
// travels for DUR seconds and lands back exactly where it started.
const YMAX = 0.74, YMIN = -0.10, BAND = 0.18, T_SWEEP = 0.9, DUR = 3.4;
const VSWEEP = (YMAX - YMIN + 2 * BAND) / T_SWEEP;
const TOTAL = T_SWEEP + DUR + 0.05;
const thr = t => YMAX + BAND - t * VSWEEP;
const released = (t, y) => { const th = thr(t); return smooth(th, th + BAND, y); };
const meshAlphaAt = (te, y) => clamp(1 - released(te, y) + released(te - DUR, y), 0, 1);

// ---- Camera, lights, state ----------------------------------------------------
const CAM = 6;
let W = 0, H = 0, S = 200, cx0 = 0, cy0 = 0;
let spin = -0.6, spinSpeed = 0, tilt = 0.42, floatY = 0;
let cs = 1, ss = 0, ct = 1, st = 0;
let effectStart = -1e9, pulseStart = -1e9, wasActive = false, intensity = 0;
const orbs = [];

const nrm = (x, y, z) => { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; };
const [L1x, L1y, L1z] = nrm(-0.55, 0.78, 0.55);   // key light: upper left, slightly in front
const [L2x, L2y, L2z] = nrm(0.7, -0.35, 0.45);    // cool fill from lower right
const RED = [226, 26, 32], RIBBON = [36, 17, 21];

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W * 0.30, H * 0.21);
  cx0 = W / 2; cy0 = H * 0.45;
  for (const o of orbs) o.trail.length = 0;
}
addEventListener('resize', resize);
resize();

// ---- Drawing ------------------------------------------------------------------
function drawHalo(a) {
  const y = cy0 - 0.2 * S;
  const g = ctx.createRadialGradient(cx0, y, 0, cx0, y, S * 1.75);
  g.addColorStop(0, `rgba(255,56,44,${a.toFixed(3)})`);
  g.addColorStop(0.45, `rgba(190,30,40,${(a * 0.35).toFixed(3)})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawShadow(vis) {
  if (vis <= 0.01) return;
  const px = cx0 + S * 0.10, py = cy0 + 0.60 * S, rx = S * 1.12, ry = S * 0.28;
  ctx.save(); ctx.translate(px, py); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(0,0,0,${(0.62 * vis).toFixed(3)})`);
  g.addColorStop(0.45, `rgba(0,0,0,${(0.32 * vis).toFixed(3)})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();
}

function drawMesh(te, active, pulse) {
  for (let i = 0; i < NVERT; i++) {
    const v = V[i];
    const x1 = v.x * cs + v.z * ss, z1 = -v.x * ss + v.z * cs;          // spin about y
    const yw = v.y * ct - z1 * st + floatY, zw = v.y * st + z1 * ct;     // tilt about x
    const sc = CAM / (CAM - zw);
    RX[i] = x1; RY[i] = yw; RZ[i] = zw;
    PX[i] = cx0 + x1 * sc * S; PY[i] = cy0 - yw * sc * S;
  }
  for (let i = 0; i < Q.length; i++) { const q = Q[i]; q.z = RZ[q.a] + RZ[q.b] + RZ[q.c] + RZ[q.d]; }
  ORDER.sort((i, j) => Q[i].z - Q[j].z);                                // painter's algorithm

  ctx.lineWidth = 0.6; ctx.lineJoin = 'round';
  for (let k = 0; k < ORDER.length; k++) {
    const q = Q[ORDER[k]];
    let alpha = 1;
    if (active) { alpha = meshAlphaAt(te, q.ly); if (alpha < 0.02) continue; }

    const nx1 = q.nx * cs + q.nz * ss, nz1 = -q.nx * ss + q.nz * cs;
    let nx = nx1, ny = q.ny * ct - nz1 * st, nz = q.ny * st + nz1 * ct;
    const mx = (RX[q.a] + RX[q.b] + RX[q.c] + RX[q.d]) / 4, my = (RY[q.a] + RY[q.b] + RY[q.c] + RY[q.d]) / 4;
    let vx = -mx, vy = -my, vz = CAM - q.z / 4;
    const vl = Math.hypot(vx, vy, vz); vx /= vl; vy /= vl; vz /= vl;
    let facing = nx * vx + ny * vy + nz * vz, under = false;
    if (facing < 0) { nx = -nx; ny = -ny; nz = -nz; facing = -facing; under = true; }

    const diff = Math.max(0, nx * L1x + ny * L1y + nz * L1z);
    const fill = Math.max(0, nx * L2x + ny * L2y + nz * L2z) * 0.6;
    const hx = L1x + vx, hy = L1y + vy, hz = L1z + vz, hl = Math.hypot(hx, hy, hz);
    const ribbon = q.region === 1;
    const spec = Math.pow(Math.max(0, (nx * hx + ny * hy + nz * hz) / hl), ribbon ? 16 : 44) * (ribbon ? 0.35 : 0.6);
    const rim = Math.pow(1 - facing, 3) * 0.7;
    const base = ribbon ? RIBBON : RED;
    const light = ((under ? 0.12 : 0.22) + 0.22 * pulse) * q.ao + 0.92 * diff * q.ao;
    const r = base[0] * light + fill * 34 + spec * 235 + rim * 95;
    const g = base[1] * light + fill * 42 + spec * 205 + rim * 32;
    const b = base[2] * light + fill * 66 + spec * 195 + rim * 34;
    const col = `rgb(${r | 0},${g | 0},${b | 0})`;

    let ax = PX[q.a], ay = PY[q.a], bx = PX[q.b], by = PY[q.b], cx = PX[q.c], cy = PY[q.c], dx = PX[q.d], dy = PY[q.d];
    if (alpha < 1) {                                                    // quads shrink as they dissolve
      const kx = (ax + bx + cx + dx) / 4, ky = (ay + by + cy + dy) / 4, sh = Math.pow(alpha, 0.6);
      ax = lerp(kx, ax, sh); ay = lerp(ky, ay, sh); bx = lerp(kx, bx, sh); by = lerp(ky, by, sh);
      cx = lerp(kx, cx, sh); cy = lerp(ky, cy, sh); dx = lerp(kx, dx, sh); dy = lerp(ky, dy, sh);
      ctx.globalAlpha = smooth(0, 0.5, alpha);
    } else ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.lineTo(dx, dy); ctx.closePath();
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(now, te) {
  ctx.globalCompositeOperation = 'lighter';
  const th1 = thr(te), th2 = thr(te - DUR), szk = S / 220;
  for (let i = 0; i < PN; i++) {
    const y = P.hy[i];
    const rel = smooth(th1, th1 + BAND, y) - smooth(th2, th2 + BAND, y);
    if (rel < 0.01) continue;
    const tr = (YMAX + 1.5 * BAND - y) / VSWEEP;
    const p = clamp((te - tr) / DUR, 0, 1);
    const env = smooth(0, 0.3, p) * (1 - smooth(0.6, 1, p));          // out, hold, home
    const dx = P.hx[i] + env * P.ox[i], dz = P.hz[i] + env * P.oz[i];
    let dy = y + env * (P.oy[i] + P.up[i]);
    const ang = env * (P.sa[i] + P.sb[i] * p);                          // swirl about the crown
    const ca = Math.cos(ang), sa = Math.sin(ang);
    let x = dx * ca + dz * sa, z = -dx * sa + dz * ca;
    if (env > 0.001) {
      const w = env * 0.13;
      x += w * Math.sin(now * P.f1[i] + P.p1[i]);
      dy += w * Math.sin(now * P.f2[i] + P.p2[i]);
      z += w * Math.sin(now * P.f3[i] + P.p3[i]);
    }
    const x1 = x * cs + z * ss, z1 = -x * ss + z * cs;
    const yw = dy * ct - z1 * st + floatY, zw = dy * st + z1 * ct;
    const sc = CAM / (CAM - zw);
    const px = cx0 + x1 * sc * S, py = cy0 - yw * sc * S;
    const sz = P.sz[i] * (1 + env * 0.6) * sc * szk;
    const tw = 0.7 + 0.3 * Math.sin(now * P.tf[i] + P.tp[i]);
    ctx.globalAlpha = rel * tw * 0.9;
    ctx.drawImage(SPR[P.sp[i]], px - sz / 2, py - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---- Orbiting embers ----------------------------------------------------------
function spawnOrbs(now) {
  for (let i = 0; i < 9; i++) orbs.push({
    r: rnd(1.25, 1.8), h: rnd(-0.15, 0.55), ax: rnd(-0.55, 0.55), az: rnd(-0.4, 0.4),
    th: rnd(0, TAU), w: (Math.random() < 0.5 ? -1 : 1) * rnd(0.45, 0.85),
    sp: Math.random() < 0.7 ? 1 : 2, sz: rnd(6, 9), trail: [], born: now
  });
}
function updateOrbs(now, dt) {
  for (const o of orbs) {
    o.th += o.w * dt * (1 + 0.6 * intensity);
    const x0 = o.r * Math.cos(o.th), y0 = o.h + 0.1 * Math.sin(2 * o.th + 1), z0 = o.r * Math.sin(o.th);
    const y1 = y0 * Math.cos(o.ax) - z0 * Math.sin(o.ax), z1 = y0 * Math.sin(o.ax) + z0 * Math.cos(o.ax);
    const x2 = x0 * Math.cos(o.az) - y1 * Math.sin(o.az), y2 = x0 * Math.sin(o.az) + y1 * Math.cos(o.az);
    const yw = y2 + floatY, sc = CAM / (CAM - z1);
    o.trail.push({ x: cx0 + x2 * sc * S, y: cy0 - yw * sc * S, z: z1, s: sc });
    if (o.trail.length > 26) o.trail.shift();
  }
}
function drawOrbs(now, behind) {
  if (!orbs.length) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const o of orbs) {
    const T = o.trail, n = T.length; if (n < 2) continue;
    const fade = smooth(0, 1.4, now - o.born), c = o.sp === 1 ? '255,150,80' : '255,90,70';
    for (let k = 1; k < n; k++) {
      const pt = T[k]; if ((pt.z < 0) !== behind) continue;
      const f = k / (n - 1);
      ctx.strokeStyle = `rgba(${c},${(f * f * 0.5 * fade).toFixed(3)})`;
      ctx.lineWidth = (0.4 + 1.6 * f) * pt.s * S / 220;
      ctx.beginPath(); ctx.moveTo(T[k - 1].x, T[k - 1].y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    }
    const hd = T[n - 1];
    if ((hd.z < 0) === behind) {
      const sz = o.sz * hd.s * S / 220;
      ctx.globalAlpha = fade * (0.8 + 0.2 * Math.sin(now * 5 + o.th));
      ctx.drawImage(SPR[o.sp], hd.x - sz / 2, hd.y - sz / 2, sz, sz);
      ctx.globalAlpha = 1;
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---- Interaction --------------------------------------------------------------
const nowS = () => performance.now() / 1000;
function trigger() {
  const now = nowS();
  if (reduced) { if (now - pulseStart > 1.2) pulseStart = now; return; }
  if (now - effectStart < TOTAL + 0.5) return;
  effectStart = now;
}
const hit = (x, y) => { const dx = x - cx0, dy = y - (cy0 - 0.15 * S); return dx * dx + dy * dy < (S * 1.2) ** 2; };
let inside = false;
canvas.addEventListener('pointermove', e => {
  const h = hit(e.clientX, e.clientY);
  if (h && !inside) trigger();
  inside = h; canvas.style.cursor = h ? 'pointer' : 'default';
});
canvas.addEventListener('pointerdown', e => { if (hit(e.clientX, e.clientY)) trigger(); });
canvas.addEventListener('pointerleave', () => { inside = false; });
canvas.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); } });

// ---- Main loop ----------------------------------------------------------------
let last = nowS();
function frame(tms) {
  const now = tms / 1000, dt = Math.min(0.05, Math.max(0, now - last)); last = now;
  const te = now - effectStart;
  const active = !reduced && te >= 0 && te < TOTAL;

  if (!reduced) {
    const target = active ? 0.1 : 0.5;                                  // slow the spin while dissolved
    spinSpeed += (target - spinSpeed) * (1 - Math.exp(-dt * (active ? 4 : 1.2)));
    spin += spinSpeed * dt;
    floatY = 0.035 * Math.sin(now * 0.9);
    tilt = 0.42 + 0.03 * Math.sin(now * 0.47);
  } else { spinSpeed = 0; floatY = 0; tilt = 0.42; }
  cs = Math.cos(spin); ss = Math.sin(spin); ct = Math.cos(tilt); st = Math.sin(tilt);

  intensity = active ? smooth(0, 0.8, te) * (1 - smooth(TOTAL - 1, TOTAL, te)) : 0;
  const tp = now - pulseStart;
  const pulse = reduced && tp < 6 ? smooth(0, 0.35, tp) * Math.exp(-tp * 1.4) : 0;
  if (wasActive && !active && orbs.length === 0) spawnOrbs(now);
  wasActive = active;

  ctx.clearRect(0, 0, W, H);
  drawHalo(0.09 + 0.02 * Math.sin(now * 0.7) + 0.14 * intensity + 0.22 * pulse);
  const vis = active ? meshAlphaAt(te, 0.3) : 1;
  drawShadow(vis * clamp(1 - floatY * 4, 0.7, 1.1));
  if (!reduced) updateOrbs(now, dt);
  drawOrbs(now, true);
  drawMesh(te, active, pulse);
  if (active) drawParticles(now, te);
  drawOrbs(now, false);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
