<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070a12;
    font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #caption {
    position: fixed;
    left: 50%;
    bottom: 11vh;
    transform: translateX(-50%);
    text-align: center;
    color: rgba(255, 224, 178, 0.92);
    font-size: clamp(14px, 2.6vh, 20px);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    font-weight: 500;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 18px rgba(255, 190, 120, 0.55),
                 0 2px 8px rgba(0, 0, 0, 0.8);
  }
  #caption small {
    display: block;
    font-size: clamp(9px, 1.4vh, 12px);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    margin-top: 0.7em;
    color: rgba(255, 224, 178, 0.55);
    font-weight: 400;
    text-transform: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #stage { cursor: default; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption">The Fedora<small>Red Hat style · hover to disperse</small></div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d", { alpha: false });
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- sizing ----------
  var W, H, CX, CY, F;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H * 0.44;
    F = Math.min(W, H) * 0.9;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- glow sprite ----------
  var SPR = 96;
  var sprite = document.createElement("canvas");
  sprite.width = sprite.height = SPR;
  var sctx = sprite.getContext("2d");
  var grad = sctx.createRadialGradient(SPR/2, SPR/2, 0, SPR/2, SPR/2, SPR/2);
  grad.addColorStop(0, "rgba(255,238,200,1)");
  grad.addColorStop(0.25, "rgba(255,196,130,0.9)");
  grad.addColorStop(0.6, "rgba(255,120,50,0.28)");
  grad.addColorStop(1, "rgba(255,90,30,0)");
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, SPR, SPR);

  // cool orbiter sprite
  var spriteCool = document.createElement("canvas");
  spriteCool.width = spriteCool.height = SPR;
  var cctx = spriteCool.getContext("2d");
  var cgrad = cctx.createRadialGradient(SPR/2, SPR/2, 0, SPR/2, SPR/2, SPR/2);
  cgrad.addColorStop(0, "rgba(215,235,255,1)");
  cgrad.addColorStop(0.3, "rgba(150,190,255,0.8)");
  cgrad.addColorStop(0.7, "rgba(90,120,255,0.2)");
  cgrad.addColorStop(1, "rgba(60,90,255,0)");
  cctx.fillStyle = cgrad;
  cctx.fillRect(0, 0, SPR, SPR);

  // ---------- hat geometry ----------
  var particles = [];

  function add(px, py, pz) {
    particles.push({
      hx: px, hy: py, hz: pz,
      // scatter direction + distance + motion
      dx: (Math.random() - 0.5) * 2,
      dy: (Math.random() - 0.5) * 2 + 0.25,
      dz: (Math.random() - 0.5) * 2,
      dist: 1.6 + Math.random() * 2.6,
      phase: Math.random() * Math.PI * 2,
      spd: 1.2 + Math.random() * 2.2,
      // orbit flag for the trailing few
      orb: Math.random() < 0.012,
      orad: 0.55 + Math.random() * 0.55,
      oy: (Math.random() - 0.3) * 1.1 + 0.1,
      oph: Math.random() * Math.PI * 2,
      ospd: (0.5 + Math.random()) * (Math.random() < 0.5 ? -1 : 1),
      cool: false
    });
  }

  function buildHat() {
    particles.length = 0;
    var thetaN = 84;
    var i, j, t, r, y;

    // crown side (cylinder)
    var yN = 7;
    var crownR = 0.62, crownH = 0.78;
    for (i = 0; i < thetaN; i++) {
      t = (i / thetaN) * Math.PI * 2;
      for (j = 0; j <= yN; j++) {
        y = (j / yN) * crownH;
        add(crownR * Math.cos(t), y, crownR * Math.sin(t));
      }
    }
    // crown dome
    var domeN = 6;
    for (i = 0; i < thetaN; i++) {
      t = (i / thetaN) * Math.PI * 2;
      for (j = 0; j < domeN; j++) {
        var u = (j + 0.5) / domeN; // 0..1 across dome arc
        var ang = u * Math.PI * 0.5;
        r = crownR * Math.cos(ang);
        y = crownH + crownR * 0.85 * Math.sin(ang);
        add(r * Math.cos(t), y, r * Math.sin(t));
      }
    }
    // brim (disc with slight thickness + tilt)
    var rN = 6;
    var brimR = 1.0;
    for (i = 0; i < thetaN; i++) {
      t = (i / thetaN) * Math.PI * 2;
      for (j = 0; j < rN; j++) {
        r = 0.22 + ((j + 0.5) / rN) * (brimR - 0.22);
        add(r * Math.cos(t), -0.015, r * Math.sin(t));
        // lower layer for thickness
        add(r * Math.cos(t), -0.045, r * Math.sin(t));
      }
    }
    // band ring
    var bandN = 120;
    for (i = 0; i < bandN; i++) {
      t = (i / bandN) * Math.PI * 2;
      add(crownR * Math.cos(t), 0.42, crownR * Math.sin(t));
    }
    // a handful of cool-toned orbiters
    for (i = 0; i < 14; i++) {
      var p = particles[Math.floor(Math.random() * particles.length)];
      p.cool = true;
    }
  }
  buildHat();
  console.log("particles:", particles.length);

  // ---------- interaction state ----------
  var hovered = false;
  var dissolve = false;   // a dissolve sequence is running
  var prog = 0;           // 0..1 across the sequence
  var DUR = 4.6;          // seconds (out + swirl + back)
  var spinAngle = 0;
  var spinSpeed = 0.95;   // target when idle
  var currentSpin = reduced ? 0 : 0.95;
  var tiltX = 0, tiltZ = 0;
  var animTime = 0;

  var last = performance.now();

  function startDissolve() {
    if (reduced) return;
    hovered = true;
    dissolve = true;
    prog = 0;
  }
  canvas.addEventListener("pointerenter", function () { if (!reduced) startDissolve(); });
  canvas.addEventListener("pointerdown", function (e) {
    if (reduced) return;
    e.preventDefault();
    startDissolve();
  });
  window.addEventListener("pointermove", function (e) {
    var nx = (e.clientX / W) * 2 - 1;
    var ny = (e.clientY / H) * 2 - 1;
    tiltX = -ny * 0.10;
    tiltZ =  nx * 0.14;
  });
  document.addEventListener("pointerleave", function () { hovered = false; });

  // ---------- main loop ----------
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    animTime += dt;

    // dissolve sequence clock
    if (dissolve) {
      prog += dt / DUR;
      if (prog >= 1) { prog = 1; dissolve = false; }
    }
    // envelope: rises then falls to reform
    var u = prog;
    var env = dissolve ? Math.pow(Math.sin(Math.PI * u), 0.55) : 0;

    // ease spin speed down while hovered
    var target = hovered ? 0.16 : 0.95;
    currentSpin += (target - currentSpin) * Math.min(1, dt * 3.2);
    if (!reduced) spinAngle += currentSpin * dt;

    // fade factor: leave longer trails while dispersing
    var fadeA = 0.32 - 0.16 * env;

    // ---- paint background / fade for trails ----
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = fadeA;
    var g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#0d1322");
    g.addColorStop(0.5, "#070b13");
    g.addColorStop(1, "#04060c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // ground shadow / halo
    ctx.globalCompositeOperation = "lighter";
    var sg = ctx.createRadialGradient(CX, CY + 120, 0, CX, CY + 120, Math.min(W, H) * 0.35);
    sg.addColorStop(0, "rgba(255,160,80,0.16)");
    sg.addColorStop(0.5, "rgba(255,120,60,0.05)");
    sg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sg;
    ctx.globalAlpha = 0.8;
    ctx.fillRect(CX - W, CY, W * 2, H);
    ctx.globalAlpha = 1;

    // ---- particles ----
    var cosS = Math.cos(spinAngle), sinS = Math.sin(spinAngle);
    var cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
    var cosZ = Math.cos(tiltZ), sinZ = Math.sin(tiltZ);
    var camD = 3.4;
    var i, p, px, py, pz;

    for (i = 0; i < particles.length; i++) {
      p = particles[i];

      // --- choose model-space position ---
      if (dissolve && u < 1) {
        var osc = Math.sin(animTime * p.spd + p.phase) * 0.06;
        px = p.hx + p.dx * p.dist * env;
        py = p.hy + p.dy * p.dist * env + 0.5 * env + osc;
        pz = p.hz + p.dz * p.dist * env;
        // swirl: rotate around vertical axis
        var sw = 2.1 * env;
        var cs = Math.cos(sw), sn = Math.sin(sw);
        var tpx = px * cs - pz * sn;
        pz = px * sn + pz * cs;
        px = tpx;
      } else if (p.orb) {
        // orbiters circle the hat
        var oa = p.oph + animTime * p.ospd;
        px = p.orad * Math.cos(oa);
        py = p.oy + Math.sin(animTime * 1.4 + p.oph) * 0.08;
        pz = p.orad * Math.sin(oa);
      } else {
        px = p.hx; py = p.hy; pz = p.hz;
      }

      // --- global spin around Y ---
      var x1 = px * cosS - pz * sinS;
      var z1 = px * sinS + pz * cosS;
      var y1 = py;

      // --- tilt for depth ---
      var y2 = y1 * cosX - z1 * sinX;
      var z2 = y1 * sinX + z1 * cosX;
      var x2 = x1 * cosZ - y2 * sinZ;
      var y3 = x1 * sinZ + y2 * cosZ;

      var depth = z2 + camD;
      if (depth <= 0.4) continue;
      var inv = F / depth;
      var sx = CX + x2 * inv;
      var sy = CY - y3 * inv;
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;

      // depth lighting + ember glow boost
      var light = 1.05 - (depth - camD) * 0.14;
      if (light < 0.35) light = 0.35;
      var ember = env * 1.7;
      var size = (3.2 + ember * 5.2) * inv * 0.028;
      if (size < 0.6) size = 0.6;
      var alpha = (0.28 + ember * 0.55) * light;
      if (alpha > 0.95) alpha = 0.95;

      ctx.globalAlpha = alpha;
      if (p.cool) {
        var sz2 = size * (0.8 + env * 0.7);
        ctx.drawImage(spriteCool, sx - sz2 / 2, sy - sz2 / 2, sz2, sz2);
      } else {
        ctx.drawImage(sprite, sx - size / 2, sy - size / 2, size, size);
      }
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  // ---------- static render for reduced motion ----------
  function staticRender() {
    var cosS = 1, sinS = 0, cosX = 1, sinX = 0, cosZ = 1, sinZ = 0;
    var camD = 3.4, i, p, px, py, pz;
    var g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#0d1322");
    g.addColorStop(0.5, "#070b13");
    g.addColorStop(1, "#04060c");
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    var sg = ctx.createRadialGradient(CX, CY + 120, 0, CX, CY + 120, Math.min(W, H) * 0.35);
    sg.addColorStop(0, "rgba(255,160,80,0.18)");
    sg.addColorStop(0.5, "rgba(255,120,60,0.06)");
    sg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(CX - W, CY, W * 2, H);
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      if (p.orb) {
        px = p.hx * 0.9; py = p.hy; pz = p.hz * 0.9;
      } else { px = p.hx; py = p.hy; pz = p.hz; }
      var depth = pz + camD;
      var inv = F / depth;
      var sx = CX + px * inv;
      var sy = CY - py * inv;
      var size = 3.2 * inv * 0.028;
      ctx.globalAlpha = 0.5;
      ctx.drawImage(p.cool ? spriteCool : sprite, sx - size / 2, sy - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
  }

  if (reduced) {
    staticRender();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
